lesson: git-01
cards:
  - id: git-01-c-branch
    type: explain
    competencies: [git.branching]
    front: What is a branch in Git, and why is creating one cheap?
    back: A branch is a name that points at one commit, its tip. Creating one adds a name and copies nothing. When you commit on it, the name moves to the new commit.
  - id: git-01-c-head
    type: explain
    competencies: [git.branching]
    front: What is HEAD, and what is a detached HEAD?
    back: HEAD says where you are. Normally it names the current branch, and that branch moves when you commit. In a detached HEAD it points straight at a commit, so new commits belong to no branch until you create one with `git switch -c name`.
  - id: git-01-c-predict-pointers
    type: predict
    competencies: [git.branching, git.commits]
    front: |
      branches = {"main": "c"}
      head = "main"
      branches["fix"] = branches[head]
      head = "fix"
      branches[head] = "d"
      print(branches)
    back: 'Only the branch that HEAD names moves. `fix` points at the new commit `d` and `main` stays at `c`.'
  - id: git-01-c-rebase-ids
    type: explain
    competencies: [git.rebase-merge]
    front: Why does a rebase change your commits' ids, and when is that a problem?
    back: Rebase replays your commits on a new parent, and a commit with a different parent is a different commit. That is fine on a private branch. On a branch others have built on, they must repair their history by hand, so merge instead.
  - id: git-01-c-fast-forward
    type: basic
    competencies: [git.rebase-merge]
    front: When does `git merge` fast-forward, and when does it say "Already up to date"?
    back: It fast-forwards when your tip is an ancestor of the other branch, so your branch just moves forward with no merge commit. It says "Already up to date" when the other branch is already part of your history.
  - id: git-01-c-conflict
    type: basic
    competencies: [git.rebase-merge]
    front: After a merge conflict, what are the steps to finish the merge?
    back: Edit the file into the text you want and delete the three marker lines, run `git add <file>`, then `git commit` or `git merge --continue`. `git merge --abort` goes back to before the merge.
  - id: git-01-c-undo-choice
    type: explain
    competencies: [git.undo]
    front: A bad commit is already on the shared main branch. Why use `git revert` rather than `git reset`?
    back: Revert adds a new commit that undoes the bad one, so history only grows and nobody has to repair their copy. Reset moves the branch back, and pushing that needs a force-push that rewrites history others already have.
  - id: git-01-c-reset-modes
    type: cloze
    competencies: [git.undo]
    front: 'In `git reset`, ____ keeps your changes staged, the default ____ keeps them unstaged in the working tree, and ____ discards them.'
    back: '`--soft` keeps changes staged. `--mixed` (the default) keeps them in the working tree, unstaged. `--hard` overwrites the working tree too.'
  - id: git-01-c-restore
    type: basic
    competencies: [git.undo]
    front: What do `git restore <file>` and `git restore --staged <file>` do?
    back: '`git restore <file>` overwrites the file in your working tree with the staged version, so uncommitted edits are lost for good. `--staged` only unstages the file and leaves your edits.'
  - id: git-01-c-reflog
    type: basic
    competencies: [git.undo]
    front: You ran `git reset --hard` and lost a commit. Where do you look?
    back: '`git reflog` lists where HEAD and your branches used to point in your local repository. Find the old tip and reset to it. Entries expire after a while (90 days by default).'
  - id: git-01-c-force
    type: explain
    competencies: [git.undo]
    front: Why is a plain `git push` refused after you rebased a branch you had already pushed, and what is the safer force option?
    back: A normal push only fast-forwards, so the remote branch must be an ancestor of what you push. A rebase breaks that. `--force-with-lease` overwrites it only if the remote is still where you last saw it, so you do not destroy a teammate's newer commits.
  - id: git-01-c-secret-history
    type: explain
    competencies: [git.undo]
    front: A key was pushed to a branch. In what order do you act, and what does `git filter-repo` do?
    back: Revoke or rotate the key first. Then rewrite history with a tool like `git filter-repo`, which gives the affected commits new ids, force-push, and ask collaborators to rebase rather than merge. Forks and cached views may still hold old commits.
  - id: git-01-c-conventional
    type: basic
    competencies: [git.commits]
    front: What does a Conventional Commits subject look like, and what does the `!` mean?
    back: '`type(scope)!: description`. The scope and the `!` are optional. The `!` right before the colon marks a breaking change.'
  - id: git-01-c-review
    type: explain
    competencies: [git.pull-requests]
    front: What makes a pull request easy to review?
    back: One purpose and a small diff, a title and description that say what changed, why and how it was tested, a link to the issue, and passing checks. A draft pull request is the way to ask for early feedback.
