lesson: sql-01
cards:
  - id: sql-01-c-clause-order
    type: explain
    competencies: [sql.select]
    front: In what order do you write the clauses of a simple query, and what does each do?
    back: SELECT picks the columns, FROM names the table, WHERE keeps the rows that match, ORDER BY sorts the result, and LIMIT keeps the first n rows. They must be written in this order.
  - id: sql-01-c-no-order
    type: explain
    competencies: [sql.select]
    front: Why must you use ORDER BY before LIMIT?
    back: A table has no built-in row order, so without ORDER BY the first rows are arbitrary. ORDER BY decides which rows come first, and LIMIT then cuts the result off.
  - id: sql-01-c-and-or
    type: basic
    competencies: [sql.select]
    front: In WHERE a OR b AND c, which is applied first?
    back: AND is applied before OR, so it means a OR (b AND c). Use brackets when you mix them, for example (a OR b) AND c.
  - id: sql-01-c-quotes
    type: basic
    competencies: [sql.select]
    front: What do single quotes and double quotes mean in PostgreSQL?
    back: Single quotes make a text value, as in 'booking'. Double quotes mark an identifier, such as a column or table name.
  - id: sql-01-c-distinct
    type: basic
    competencies: [sql.select]
    front: What does SELECT DISTINCT do?
    back: It removes repeated rows from the result, so each different combination of the selected values appears once. NULLs count as equal to each other here.
  - id: sql-01-c-null-meaning
    type: explain
    competencies: [sql.nulls]
    front: What is NULL, and what is it not?
    back: NULL means that no value is recorded, so it is unknown or missing. It is not zero, not an empty string and not the text 'NULL'.
  - id: sql-01-c-null-equals
    type: explain
    competencies: [sql.nulls]
    front: Why does WHERE reason = NULL return no rows, and what do you write instead?
    back: A comparison with NULL gives unknown, and WHERE keeps a row only when the condition is true. Use IS NULL, or IS NOT NULL for the opposite.
  - id: sql-01-c-not-equal-null
    type: explain
    competencies: [sql.nulls]
    front: Why does WHERE reason <> 'billing' drop the rows where the reason is NULL, and how do you keep them?
    back: NULL <> 'billing' is unknown, and unknown rows are dropped. Add OR reason IS NULL, or use reason IS DISTINCT FROM 'billing'.
  - id: sql-01-c-order-null
    type: explain
    competencies: [sql.nulls]
    front: Where do NULLs go in an ORDER BY in PostgreSQL, and how do you control it?
    back: NULL sorts as larger than any value, so it comes last in ascending order and first in descending order. Add NULLS FIRST or NULLS LAST to choose, or filter the NULLs out with IS NOT NULL.
  - id: sql-01-c-not-in-null
    type: explain
    competencies: [sql.nulls]
    front: Why does x NOT IN (1, NULL) return no rows?
    back: It means x <> 1 AND x <> NULL. The second test is unknown for every row, so the whole condition is never true. Remove the NULL from the list.
