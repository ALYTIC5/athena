  from invoice import Invoice
  from split import split_evenly, split_invoice


  def test_shares_always_add_up_to_the_total():
      assert sum(split_evenly(1001, 3)) == 1001
      inv = Invoice("A-1", tax_bps=0)
      inv.add("Dinner", 3333)
      shares = split_invoice(inv, 4)
      assert sum(shares) == 3333
      assert max(shares) - min(shares) <= 1


  def test_discount_rounds_down():
      inv = Invoice("A-2", tax_bps=0, discount_bps=1250)
      inv.add("Parts", 1001)
      assert inv.discount() == 125
      assert inv.total() == 876


  def test_tax_of_half_a_cent_rounds_up():
      inv = Invoice("A-3", tax_bps=1000)
      inv.add("Pen", 25)
      assert inv.tax() == 3
      assert inv.total() == 28
      other = Invoice("A-4", tax_bps=1000)
      other.add("Ink", 45)
      assert other.total() == 50


  def test_less_than_half_a_cent_rounds_down():
      inv = Invoice("A-6", tax_bps=1000)
      inv.add("Clip", 24)
      assert inv.tax() == 2
      assert inv.total() == 26


  def test_split_with_a_tip():
      inv = Invoice("A-5", tax_bps=0)
      inv.add("Coffee", 25)
      assert split_invoice(inv, 1, tip_bps=1000) == [28]
bugExplanation: |
  `apply_bps` promises that half a cent rounds up, but it uses `round(amount * bps / BPS)`. Python's `round` rounds exact halves to the nearest even integer, so 2.5 becomes 2 and 4.5 becomes 4 while 3.5 becomes 4. Tax and tips that land exactly on half a cent are therefore sometimes a cent short, depending on the parity of the result. `floor_bps` and `split_evenly` are correct: the discount is meant to round down and `divmod` hands out the remainder cent by cent. Use integer arithmetic instead, for example `(amount * bps + BPS // 2) // BPS`.
