  money.py: |
    """Money helpers. Amounts are integer cents; rates are integer basis points (1 bp = 0.01%)."""

    BPS = 10_000


    def to_cents(text):
        """Parse a decimal string such as '12.5' or '3' into cents without using floats."""
        whole, _, frac = text.strip().partition(".")
        frac = (frac + "00")[:2]
        return int(whole) * 100 + int(frac)


    def format_cents(cents):
        """Format cents as a string like '12.50'."""
        sign = "-" if cents < 0 else ""
        dollars, rest = divmod(abs(cents), 100)
        return f"{sign}{dollars}.{rest:02d}"


    def apply_bps(amount, bps):
        """Return amount * bps / 10000 rounded to whole cents (half a cent rounds up)."""
        return (amount * bps + BPS // 2) // BPS


    def floor_bps(amount, bps):
        """Return amount * bps / 10000 rounded down, for where the customer must never be overcharged."""
        return amount * bps // BPS
