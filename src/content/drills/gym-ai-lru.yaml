id: gym-ai-lru
kind: ai-assisted
title: 'Least recently used cache'
competencies: [int.ai-assisted]
timeLimitMin: 30
task: |
  `LRUCache` should hold at most `capacity` entries and throw away the least recently used one when it is full. Both
  `get` and `put` (including a `put` that updates an existing key) count as a use; `in` and `len` do not. `keys()` lists
  the keys from least to most recently used. The tests below fail. You may use an AI assistant. Before each prompt,
  write down what you think is wrong and why. Verify any answer with the tests before you trust it, and re-run all of
  them after every change.
files:
  lru.py: |
    """A small least-recently-used cache."""


    class LRUCache:
        def __init__(self, capacity):
            self.capacity = capacity
            self._data = {}  # insertion order: least recently used first

        def get(self, key, default=None):
            """Value for key, or default. A hit counts as a use."""
            value = self._data.get(key)
            if not value:
                return default
            return value

        def put(self, key, value):
            """Store value. If the cache is full, the least recently used key is dropped."""
            if key in self._data:
                self._data[key] = value
                return
            if len(self._data) >= self.capacity:
                oldest = next(iter(self._data))
                del self._data[oldest]
            self._data[key] = value

        def keys(self):
            """Keys from least to most recently used."""
            return list(self._data)

        def __contains__(self, key):
            return key in self._data

        def __len__(self):
            return len(self._data)
failingTest: |
  from lru import LRUCache


  def test_oldest_key_is_dropped_first():
      cache = LRUCache(2)
      cache.put("a", 1)
      cache.put("b", 2)
      cache.put("c", 3)
      assert cache.keys() == ["b", "c"]
      assert len(cache) == 2


  def test_get_counts_as_a_use():
      cache = LRUCache(2)
      cache.put("a", 1)
      cache.put("b", 2)
      assert cache.get("a") == 1
      cache.put("c", 3)
      assert cache.keys() == ["a", "c"]


  def test_updating_a_key_counts_as_a_use():
      cache = LRUCache(2)
      cache.put("a", 1)
      cache.put("b", 2)
      cache.put("a", 10)
      cache.put("c", 3)
      assert cache.keys() == ["a", "c"]
      assert cache.get("a") == 10


  def test_updating_a_full_cache_drops_nothing():
      cache = LRUCache(2)
      cache.put("a", 1)
      cache.put("b", 2)
      cache.put("b", 20)
      assert len(cache) == 2
      assert cache.keys() == ["a", "b"]


  def test_falsy_values_are_real_values():
      cache = LRUCache(2)
      cache.put("zero", 0)
      cache.put("empty", "")
      assert cache.get("zero", "missing") == 0
      assert cache.get("empty", "missing") == ""


  def test_missing_key_and_membership():
      cache = LRUCache(2)
      cache.put("a", 1)
      cache.put("b", 2)
      assert cache.get("nope") is None
      assert cache.get("nope", 5) == 5
      assert "a" in cache
      cache.put("c", 3)
      assert "a" not in cache
bugExplanation: |
  There are three separate problems. `get` never moves the key to the most recent end, so a key you just read is still
  first in line to be dropped. `put` on an existing key replaces the value in place without refreshing its position
  (and when you fix that, the existing key must be removed before the full check, or updating a full cache evicts an
  innocent key). And `get` tests `if not value`, so a stored 0 or "" is mistaken for a missing key; test
  `key not in self._data` instead. To refresh, pop the key and insert it again.
