  notes.py: |
    """Short free-text notes kept for a customer."""

    MAX_NOTE_LENGTH = 120


    def clean_note(text):
        """Trim a note and cut it to MAX_NOTE_LENGTH characters."""
        return text.strip()[:MAX_NOTE_LENGTH]


    def add_note(note, notes=[]):
        """Add a cleaned note to a list of notes and return that list.

        Pass a customer's own list to add to it; leave it out to start a new list.
        """
        cleaned = clean_note(note)
        if cleaned:
            notes.append(cleaned)
        return notes


    def longest_note(notes):
        """Return the longest note, or an empty string if there are none."""
        if not notes:
            return ""
        return max(notes, key=len)


    def matching_notes(notes, word):
        """Notes that contain the word, ignoring case. Returns a new list."""
        word = word.lower()
        return [note for note in notes if word in note.lower()]


    def merge_notes(first, second):
        """Notes of both lists, without repeating a note that is already in the first."""
        merged = list(first)
        for note in second:
            if note not in merged:
                merged.append(note)
        return merged


    def truncate_all(notes, limit):
        """Copies of the notes cut to `limit` characters, with "..." on the ones that were cut."""
        result = []
        for note in notes:
            if len(note) > limit:
                result.append(note[:limit].rstrip() + "...")
            else:
                result.append(note)
        return result
  customers.py: |
    """Customer records."""

    from notes import add_note, merge_notes


    def new_customer(name, first_note=None):
        """Make a customer record, with a first note if one is given."""
        notes = add_note(first_note) if first_note else []
        return {"name": name.strip(), "notes": notes}


    def remember(customer, note):
        """Add a note to an existing customer and return the customer."""
        customer["notes"] = add_note(note, customer["notes"])
        return customer


    def has_notes(customer):
        """True if the customer has at least one note."""
        return len(customer["notes"]) > 0


    def merge_customers(keep, other):
        """Fold the notes of `other` into `keep` and return `keep`."""
        keep["notes"] = merge_notes(keep["notes"], other["notes"])
        return keep


    def rename(customer, new_name):
        """Change the customer's name (trimmed) and return the customer."""
        customer["name"] = new_name.strip()
        return customer


    def find_by_name(customers, name):
        """The first customer with this name (case-insensitive), or None."""
        wanted = name.strip().lower()
        for customer in customers:
            if customer["name"].lower() == wanted:
                return customer
        return None
  report.py: |
    """Plain-text summary of customers and their notes."""

    from notes import longest_note, matching_notes


    def total_notes(customers):
        """Count the notes across all customers."""
        return sum(len(customer["notes"]) for customer in customers)


    def describe(customer):
        """One line for a customer: the name, the note count and the longest note."""
        count = len(customer["notes"])
        longest = longest_note(customer["notes"])
        if count == 0:
            return f"{customer['name']}: no notes"
        return f"{customer['name']}: {count} note(s), longest: {longest}"


    def mentions(customers, word):
        """Names of customers with at least one note containing the word."""
        return [c["name"] for c in customers if matching_notes(c["notes"], word)]


    def overview(customers):
        """A header with the totals, then one describe() line per customer."""
        header = f"{len(customers)} customer(s), {total_notes(customers)} note(s)"
        return "\n".join([header] + [describe(customer) for customer in customers])
failingTest: |
  from customers import merge_customers, new_customer, remember
  from report import mentions, overview, total_notes


  def test_each_customer_keeps_their_own_first_note():
      amara = new_customer("Amara", "Prefers mornings")
      bilal = new_customer("Bilal", "Needs step-free access")
      assert amara["notes"] == ["Prefers mornings"]
      assert bilal["notes"] == ["Needs step-free access"]


  def test_notes_added_later_stay_with_that_customer():
      amara = new_customer("Amara", "Prefers mornings")
      bilal = new_customer("Bilal", "Needs step-free access")
      remember(bilal, "Pays by card")
      assert amara["notes"] == ["Prefers mornings"]
      assert total_notes([amara, bilal]) == 3


  def test_search_merge_and_overview():
      amara = new_customer("Amara", "Prefers mornings")
      bilal = new_customer("Bilal", "Needs step-free access")
      merge_customers(amara, bilal)
      assert mentions([amara, bilal], "MORNINGS") == ["Amara"]
      assert overview([amara, bilal]).split("\n")[0] == "2 customer(s), 3 note(s)"
bugExplanation: |
  `add_note` has a default argument `notes=[]`. Python creates that list once, when the function is defined, and reuses
  it every time the argument is left out. `new_customer` calls `add_note(first_note)` without a list, so every customer
  created with a first note shares one list, and each new first note is appended to it. Use `notes=None` and create a
  new list inside the function when `notes` is `None`. (`merge_notes` copies with `list(first)` and `new_customer` uses a
  fresh `[]` when there is no first note, so those are fine.)
