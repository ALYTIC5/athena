id: gym-ai-daterange
kind: ai-assisted
title: 'Date ranges and month ends'
competencies: [int.ai-assisted]
timeLimitMin: 30
task: |
  `days_between` should count the days from a start date to an end date including both ends (the same day counts as 1,
  an end before the start counts as 0), `list_dates` should list those days, and `add_months` should move a date by
  whole months, clamping to the last day of a shorter month. The tests below fail. You may use an AI assistant. Before
  each prompt, write down what you think is wrong and why. Verify any answer with the tests before you trust it, and
  re-run all of them after every change.
files:
  dateranges.py: |
    """Date ranges and month arithmetic. No clocks: every date is passed in."""
    from datetime import date, timedelta


    def is_leap(year):
        """True for leap years."""
        return year % 4 == 0 and year % 100 != 0


    def days_in_month(year, month):
        """Number of days in the given month."""
        if month == 2:
            return 29 if is_leap(year) else 28
        return 30 if month in (4, 6, 9, 11) else 31


    def days_between(start, end):
        """Days from start to end, counting both ends. Zero if end is before start."""
        return (end - start).days


    def list_dates(start, end):
        """Every date from start to end, both included."""
        return [start + timedelta(days=i) for i in range(days_between(start, end))]


    def add_months(d, months):
        """Move d by whole months; the day is clamped to the length of the target month."""
        month = d.month + months
        year = d.year + month // 12
        month = month % 12
        day = min(d.day, days_in_month(year, month))
        return date(year, month, day)
