kind: code-reading
title: 'The booking code that loses letters'
competencies: [int.code-reading]
timeLimitMin: 30
files:
  codes.py: |
    """Booking codes look like BK-<reference>, for example BK-KB17.

    A reference is 2 to 8 letters or digits. Codes are compared in upper case.
    """

    PREFIX = "BK-"
    MIN_REFERENCE_LENGTH = 2
    MAX_REFERENCE_LENGTH = 8
    ALLOWED = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"


    def strip_prefix(code):
        """Return the reference part of a booking code (the code without its BK- prefix)."""
        return code.strip().lstrip(PREFIX)


    def is_valid(code):
        """A valid code starts with BK- and has a reference of 2 to 8 allowed characters."""
        code = code.strip()
        if not code.startswith(PREFIX):
            return False
        reference = code[len(PREFIX):]
        if not MIN_REFERENCE_LENGTH <= len(reference) <= MAX_REFERENCE_LENGTH:
            return False
        return all(char in ALLOWED for char in reference)


    def to_code(reference):
        """Build the full booking code from a reference."""
        return PREFIX + reference.strip().upper()


    def normalize(code):
        """Canonical form: stripped, upper case, with the prefix added if it is missing."""
        code = code.strip().upper()
        if code.startswith(PREFIX):
            return code
        return PREFIX + code
  bookings.py: |
    """Bookings stored by reference."""

    from codes import is_valid, strip_prefix, to_code


    def make_index(rows):
        """Build {reference: customer} from (code, customer) rows, skipping invalid codes."""
        index = {}
        for code, customer in rows:
            if is_valid(code):
                index[strip_prefix(code)] = customer
        return index


    def find_customer(index, code):
        """Return the customer for a booking code, or None if the code is not in the index."""
        if not is_valid(code):
            return None
        return index.get(strip_prefix(code))


    def codes_for(index):
        """All booking codes in the index, sorted."""
        return sorted(to_code(reference) for reference in index)


    def find_many(index, codes):
        """Map each code to its customer; unknown codes map to None."""
        return {code: find_customer(index, code) for code in codes}


    def references_starting_with(index, letters):
        """Sorted references that begin with the given letters (case-insensitive)."""
        letters = letters.upper()
        return sorted(reference for reference in index if reference.startswith(letters))


    def move_booking(index, old_code, new_code):
        """Re-key a booking under a new code. Return True if it was moved."""
        if not is_valid(new_code):
            return False
        customer = find_customer(index, old_code)
        if customer is None:
            return False
        del index[strip_prefix(old_code)]
        index[strip_prefix(new_code)] = customer
        return True
  report.py: |
    """Lines for a printed booking list."""

    from bookings import codes_for, references_starting_with


    def listing(index):
        """One line per booking, in code order."""
        lines = []
        for code in codes_for(index):
            lines.append(f"{code:<10} {index[code[3:]]}")
        return "\n".join(lines)


    def heading(index):
        """A heading such as "3 bookings" (singular for one)."""
        count = len(index)
        noun = "booking" if count == 1 else "bookings"
        return f"{count} {noun}"


    def filtered_listing(index, letters):
        """Listing restricted to references that start with the given letters."""
        wanted = set(references_starting_with(index, letters))
        narrowed = {ref: name for ref, name in index.items() if ref in wanted}
        return listing(narrowed)


    def full_sheet(index):
        """Heading, a rule of dashes as wide as the heading, then the listing."""
        title = heading(index)
        return "\n".join([title, "-" * len(title), listing(index)])
failingTest: |
  from bookings import find_customer, make_index, move_booking
  from codes import strip_prefix
  from report import full_sheet


  def test_strip_prefix_keeps_the_whole_reference():
      assert strip_prefix("BK-KB17") == "KB17"
      assert strip_prefix("BK-B2") == "B2"


  def test_find_customer_by_full_code():
      index = make_index([("BK-KB17", "Amara"), ("BK-ZX9", "Bilal")])
      assert find_customer(index, "BK-KB17") == "Amara"
      assert find_customer(index, "BK-ZX9") == "Bilal"
      assert find_customer(index, "BK-KB18") is None


  def test_codes_differing_only_in_leading_letters_stay_distinct():
      index = make_index([("BK-KB17", "Amara"), ("BK-B17", "Bilal")])
      assert find_customer(index, "BK-KB17") == "Amara"
      assert find_customer(index, "BK-B17") == "Bilal"


  def test_sheet_lists_every_booking_and_moves_work():
      index = make_index([("BK-KB17", "Amara"), ("BK-ZX9", "Bilal")])
      assert move_booking(index, "BK-ZX9", "BK-ZX10")
      assert full_sheet(index).split("\n")[2:] == ["BK-KB17    Amara", "BK-ZX10    Bilal"]
bugExplanation: |
  `strip_prefix` calls `lstrip("BK-")`. `lstrip` does not remove a prefix: it removes every leading character that is in
  the set `{"B", "K", "-"}`, so it also eats the first letters of the reference. `"BK-KB17"` becomes `"17"`, so references
  are mangled and codes that differ only in leading B or K letters (`BK-KB17` and `BK-B17`) collide on the same key. Remove the prefix explicitly, for example with `startswith` and a slice by
  `len(PREFIX)`. The other helpers (`is_valid`, `normalize`, the `code[3:]` slice in `report.py`) already handle the prefix correctly.
