    """A short text report on call minutes."""

    from loader import merge_agents, parse_rows
    from stats import average_minutes, busiest, median_minutes, share_of_total, total_minutes


    def pluralize(count, word):
        """Text such as "1 agent" or "2 agents"."""
        return f"{count} {word}" if count == 1 else f"{count} {word}s"


    def report(text, top=2):
        rows = parse_rows(text)
        lines = [f"total {total_minutes(rows)} min, average {average_minutes(rows)} min"]
        for row in busiest(rows, top):
            lines.append(f"{row['agent']}: {row['minutes']} min")
        return "\n".join(lines)


    def shares_line(text):
        """One line such as "Amara 33%, Bilal 67%" in the order of the rows."""
        rows = merge_agents(parse_rows(text))
        shares = share_of_total(rows)
        return ", ".join(f"{name} {percent}%" for name, percent in shares.items())


    def summary(text):
        """Agent count, median and the shares line, separated by semicolons."""
        rows = merge_agents(parse_rows(text))
        parts = [
            pluralize(len(rows), "agent"),
            f"median {median_minutes(rows)} min",
            shares_line(text),
        ]
        return "; ".join(parts)
failingTest: |
  from loader import merge_agents, parse_rows
  from report import summary
  from stats import above_average, busiest, total_minutes

  DATA = "Amara,9\nBilal,40\nChen,10\nDeji,5\n"


  def test_busiest_orders_by_the_number_of_minutes():
      rows = parse_rows(DATA)
      assert [row["agent"] for row in busiest(rows, 2)] == ["Bilal", "Chen"]


  def test_totals_and_averages_work_on_numbers():
      rows = parse_rows(DATA)
      assert total_minutes(rows) == 64
      assert above_average(rows) == ["Bilal"]


  def test_repeated_agents_are_added_up_and_summarised():
      text = "# week 1\nAmara,9\nBilal,40\nAmara,11\n"
      rows = merge_agents(parse_rows(text))
      assert [(row["agent"], row["minutes"]) for row in rows] == [("Amara", 20), ("Bilal", 40)]
      assert summary(text) == "2 agents; median 30.0 min; Amara 33%, Bilal 67%"
bugExplanation: |
  `parse_row` returns the minutes as the text it read (`"9"`, `"40"`), not as numbers. Text compares letter by letter,
  so `"9"` is greater than `"40"` and `busiest` puts the wrong agents first; `sum` over text raises a `TypeError`, and
  `merge_agents` would glue `"9"` and `"11"` into `"911"`. The conversion belongs where the data enters the program: use
  `int(minutes.strip())` in `parse_row`. The statistics functions are correct once they receive numbers.
