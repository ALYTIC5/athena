    """Read call-minute rows from simple text lines such as "Amara,9".

    Blank lines and lines starting with "#" are ignored.
    """


    def is_data_line(line):
        """True for a line that holds a row (not blank, not a comment)."""
        stripped = line.strip()
        return bool(stripped) and not stripped.startswith("#")


    def parse_row(line):
        """Turn one line into {"agent": name, "minutes": number}."""
        agent, minutes = line.strip().split(",")
        return {"agent": agent.strip(), "minutes": minutes.strip()}


    def parse_rows(text):
        """Parse every data line of text."""
        return [parse_row(line) for line in text.splitlines() if is_data_line(line)]


    def merge_agents(rows):
        """Combine rows of the same agent into one row, keeping first-seen order."""
        merged = {}
        for row in rows:
            name = row["agent"]
            if name in merged:
                merged[name]["minutes"] += row["minutes"]
            else:
                merged[name] = {"agent": name, "minutes": row["minutes"]}
        return list(merged.values())
  stats.py: |
    """Statistics over parsed call-minute rows."""


    def total_minutes(rows):
        """Sum of all minutes."""
        return sum(row["minutes"] for row in rows)


    def busiest(rows, n):
        """The n rows with the most minutes, most minutes first."""
        return sorted(rows, key=lambda row: row["minutes"], reverse=True)[:n]


    def average_minutes(rows):
        """Average minutes per row, rounded to one decimal place. Zero for no rows."""
        if not rows:
            return 0
        return round(total_minutes(rows) / len(rows), 1)


    def above_average(rows):
        """Names of the agents with more minutes than the average, in the order of the rows."""
        average = average_minutes(rows)
        return [row["agent"] for row in rows if row["minutes"] > average]


    def median_minutes(rows):
        """Median of the minutes (mean of the middle two for an even count). Zero for no rows."""
        if not rows:
            return 0
        values = sorted(row["minutes"] for row in rows)
        middle = len(values) // 2
        if len(values) % 2:
            return values[middle]
        return (values[middle - 1] + values[middle]) / 2


    def minutes_by_agent(rows):
        """{agent: minutes} for rows, adding up repeated agents."""
        totals = {}
        for row in rows:
            totals[row["agent"]] = totals.get(row["agent"], 0) + row["minutes"]
        return totals


    def share_of_total(rows):
        """Percentage of all minutes handled by each agent, rounded to a whole number."""
        total = total_minutes(rows)
        if total == 0:
            return {row["agent"]: 0 for row in rows}
        return {row["agent"]: round(100 * row["minutes"] / total) for row in rows}
