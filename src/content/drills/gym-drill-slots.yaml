  slots.py: |
    """Generate appointment slots inside opening hours. Times are minutes since midnight."""


    def generate_slots(open_minute, close_minute, length):
        """Start minutes of every slot of `length` minutes that fits before closing time.

        A slot that ends exactly at closing time fits.
        """
        return list(range(open_minute, close_minute - length, length))


    def slot_label(start_minute, length):
        """Text such as "09:00-09:30" for a slot."""
        end_minute = start_minute + length
        return f"{clock(start_minute)}-{clock(end_minute)}"


    def clock(minute):
        """Format minutes since midnight as HH:MM."""
        return f"{minute // 60:02d}:{minute % 60:02d}"


    def parse_clock(text):
        """Parse "HH:MM" into minutes since midnight."""
        hours, minutes = text.strip().split(":")
        return int(hours) * 60 + int(minutes)


    def overlaps(start_a, length_a, start_b, length_b):
        """True if two slots share any time. Slots that only touch do not overlap."""
        return start_a < start_b + length_b and start_b < start_a + length_a
  booked.py: |
    """Take booked slots out of a day's slots."""


    def free_slots(slots, booked):
        """Slots that are not booked, in order."""
        taken = set(booked)
        return [slot for slot in slots if slot not in taken]


    def count_free(slots, booked):
        """How many slots are still free."""
        return len(free_slots(slots, booked))


    def next_free(slots, booked, after):
        """The first free slot that starts after the given minute, or None."""
        for slot in free_slots(slots, booked):
            if slot > after:
                return slot
        return None


    def booked_ratio(slots, booked):
        """Share of the slots that are booked, from 0.0 to 1.0 (0.0 when there are no slots)."""
        if not slots:
            return 0.0
        return 1 - count_free(slots, booked) / len(slots)
  hours.py: |
    """Weekly opening hours. Days are three-letter names; times are minutes since midnight."""

    from slots import clock, generate_slots

    WEEK = ("Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun")

    OPENING_HOURS = {
        "Mon": (540, 1020),
        "Tue": (540, 1020),
        "Wed": (540, 780),
        "Thu": (540, 1020),
        "Fri": (540, 960),
        "Sat": (600, 720),
    }


    def hours_for(day):
        """(open, close) minutes for a day, or None when the practice is closed."""
        return OPENING_HOURS.get(day)


    def is_open(day, minute):
        """True if the practice is open at this minute. Closing time itself counts as closed."""
        hours = hours_for(day)
        if hours is None:
            return False
        return hours[0] <= minute < hours[1]


    def hours_text(day):
        """Text such as "Mon 09:00-17:00" or "Sun closed"."""
        hours = hours_for(day)
        if hours is None:
            return f"{day} closed"
        return f"{day} {clock(hours[0])}-{clock(hours[1])}"


    def slots_per_day(length):
        """{day: number of slots} for every day of the week."""
        counts = {}
        for day in WEEK:
            hours = hours_for(day)
            counts[day] = len(generate_slots(hours[0], hours[1], length)) if hours else 0
        return counts
  report.py: |
    """Printed list of free slots for a day."""

    from booked import booked_ratio, free_slots
    from slots import generate_slots, parse_clock, slot_label


    def day_sheet(open_minute, close_minute, length, booked):
        slots = generate_slots(open_minute, close_minute, length)
        lines = [slot_label(slot, length) for slot in free_slots(slots, booked)]
        return "\n".join(lines) if lines else "fully booked"


    def sheet_from_text(open_text, close_text, length, booked_texts):
        """Same sheet, but with "HH:MM" strings for the hours and the booked starts."""
        booked = [parse_clock(text) for text in booked_texts]
        return day_sheet(parse_clock(open_text), parse_clock(close_text), length, booked)


    def occupancy_line(open_minute, close_minute, length, booked):
        """Text such as "50% booked" for the day."""
        slots = generate_slots(open_minute, close_minute, length)
        percent = round(100 * booked_ratio(slots, booked))
        return f"{percent}% booked"
