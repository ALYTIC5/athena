  - id: sql-04-q-migration-notnull
    pools: [mastery]
    objective: 4
    type: single
    competencies: [sql.migrations, sql.schema]
    stem: 'ALTER TABLE bookings ADD COLUMN status text NOT NULL fails on a table that already has rows. What is the usual fix?'
    options:
      - text: Add a DEFAULT, or add the column as nullable, fill it in, and then set NOT NULL
        correct: true
        why: The existing rows need a value for the new column. A default supplies one, and a constant default is quick to add in PostgreSQL 11 and later.
      - text: Delete all the rows first
        correct: false
        why: This destroys data to avoid a design step. The rows need a value, not removal.
      - text: Add a CHECK constraint on the column
        correct: false
        why: A CHECK limits values but does not give the existing rows one.
      - text: Use UNIQUE instead of NOT NULL
        correct: false
        why: UNIQUE is a different rule, and the existing rows would still have no value.

  # ---- PostgreSQL from Python (objective 5) ----
  - id: sql-04-q-psycopg-placeholder
    pools: [mastery, warmup]
    objective: 5
    type: single
    competencies: [sql.parameters]
    stem: Which psycopg 3 call is safe when reason comes from a user?
    options:
      - text: conn.execute("SELECT id FROM calls WHERE reason = %s", (reason,))
        correct: true
        why: The SQL and the value travel separately, so the value is only ever data. The values go in a tuple, even when there is just one.
      - text: conn.execute(f"SELECT id FROM calls WHERE reason = '{reason}'")
        correct: false
        why: The text becomes part of the SQL, so quote marks in reason can change the command.
      - text: conn.execute("SELECT id FROM calls WHERE reason = '%s'" % reason)
        correct: false
        why: The % operator fills in the text in Python before psycopg sees it, which is the same as pasting.
      - text: conn.execute("SELECT id FROM calls WHERE reason = '" + reason + "'")
        correct: false
        why: Joining strings pastes the value into the SQL in the same way.
  - id: sql-04-q-psycopg-bug
    pools: [mastery]
    objective: 5
    type: bug
    competencies: [sql.parameters]
    code: |
      def find_job(conn, event_id):
          query = f"SELECT id FROM jobs WHERE event_id = '{event_id}'"
          return conn.execute(query).fetchone()
    buggyLine: 2
    explanation: The event id is pasted into the SQL text with an f-string, so a value such as x' OR '1'='1 changes the query. Write conn.execute("SELECT id FROM jobs WHERE event_id = %s", (event_id,)).fetchone().
  - id: sql-04-q-psycopg-with
    pools: [mastery]
    objective: 5
    type: single
    competencies: [sql.parameters, sql.transactions]
    stem: 'with psycopg.connect(dsn) as conn: conn.execute(insert_statement). There is no explicit commit. What happens when the block ends without an error?'
    options:
      - text: The transaction is committed, and the connection is closed
        correct: true
        why: In psycopg 3 leaving the with block normally commits and closes the connection. If an exception leaves the block, it rolls back instead.
      - text: The insert is lost, because psycopg never commits for you
        correct: false
        why: psycopg does not commit after each statement, but the with block commits for you when it ends normally.
      - text: The insert is committed, but the connection stays open
        correct: false
        why: For a connection, the with block also closes it at the end.
      - text: The insert is committed immediately after the execute call
        correct: false
        why: By default psycopg starts a transaction and keeps it open until commit or the end of the block (unless you set autocommit).
  - id: sql-04-q-placeholder-identifier
    pools: [mastery, warmup]
    objective: 5
    type: single
    competencies: [sql.parameters]
    stem: A report endpoint receives a table name from the user. Can you pass it as a %s parameter?
    options:
      - text: No. A placeholder stands for a value only. Choose the table from a fixed list in your code
        correct: true
        why: Names are part of the command's structure. Checking the name against a list you wrote (or building it with psycopg's sql.Identifier) is the safe way.
      - text: Yes, placeholders work for table names too
        correct: false
        why: A table name sent as a value would be treated as a string, and the statement would fail.
      - text: Yes, as long as you add quote marks around the %s
        correct: false
        why: Quote marks turn it into a string literal, not a table name, and they invite injection.
      - text: No, user input may never be used in a query at all
        correct: false
        why: Values are fine as parameters. Only names must come from your code.

