lesson: sql-03
items:
  # ---- Chunk 1: keys and constraints (objective 1) ----
  - id: sql-03-q-primary-key
    pools: [check, mastery, warmup]
    chunk: 1
    objective: 1
    type: single
    competencies: [sql.schema]
    stem: What does PRIMARY KEY guarantee for a column?
    options:
      - text: Each value is unique and never NULL
        correct: true
        why: A primary key identifies exactly one row, so it must be unique and must always have a value.
      - text: Each value is unique, but it may be NULL
        correct: false
        why: That describes UNIQUE alone. A primary key also forbids NULL.
      - text: Each value is a number that counts up
        correct: false
        why: Keys do not have to be numbers. An identity column is what generates them.
      - text: Each value is the same in every table
        correct: false
        why: A key identifies a row in its own table. Other tables refer to it with a foreign key.
  - id: sql-03-q-foreign-key
    pools: [check, mastery, warmup]
    chunk: 1
    objective: 1
    type: single
    competencies: [sql.schema]
    stem: bookings.customer_id REFERENCES customers(id). What does the database now refuse?
    options:
      - text: A booking for a customer id that does not exist
        correct: true
        why: The foreign key makes sure that every booking points to a real customer. The error is SQLSTATE 23503.
      - text: 'Two bookings for the very same customer'
        correct: false
        why: Many bookings can point to one customer. That is the usual relationship.
      - text: 'A customer who has no bookings at all'
        correct: false
        why: The key constrains the booking side only. A customer can exist without bookings.
      - text: 'Any change at all to the customers table'
        correct: false
        why: 'Customers can still be added and most columns changed. Only deleting a customer that bookings still point to is refused.'
  - id: sql-03-q-unique-composite
    pools: [mastery, warmup]
    objective: 1
    type: single
    competencies: [sql.schema]
    stem: A table has UNIQUE (stylist_id, starts_at). Which rows can it hold?
    options:
      - text: 'Same time for two stylists, two times for one'
        correct: true
        why: Only the pair has to be unique. The same stylist can repeat with a different time, and the same time can repeat with a different stylist.
      - text: One row for each stylist, whatever the time
        correct: false
        why: That would need UNIQUE on stylist_id alone.
      - text: One row for each time, whatever the stylist
        correct: false
        why: That would need UNIQUE on starts_at alone.
      - text: 'Rows where both columns differ from every other row'
        correct: false
        why: The constraint looks at the pair of values together, not each column separately.
  - id: sql-03-q-sqlstate
    pools: [mastery]
    objective: 1
    type: single
    competencies: [sql.schema]
    stem: An insert breaks a UNIQUE constraint. Which SQLSTATE does PostgreSQL report?
    options:
      - text: '23505'
        correct: true
        why: 23505 is unique_violation. The code lets a program tell this error from others.
      - text: '23503'
        correct: false
        why: 23503 is foreign_key_violation, for a reference to a row that does not exist.
      - text: '23502'
        correct: false
        why: 23502 is not_null_violation, for a NULL in a required column.
      - text: '23514'
        correct: false
        why: 23514 is check_violation, for a row that fails a CHECK condition.
  - id: sql-03-q-check-null
    pools: [mastery]
    objective: 1
    type: single
    competencies: [sql.schema, sql.nulls]
    stem: A table has CHECK (ends_at > starts_at) and ends_at has no NOT NULL. An insert gives ends_at as NULL. What happens?
    options:
      - text: The row is accepted, because the condition is unknown
        correct: true
        why: A CHECK refuses a row only when its condition is false. A comparison with NULL is unknown, so the row passes. Add NOT NULL.
      - text: The row is refused, because NULL is not greater than anything
        correct: false
        why: The condition is unknown, not false, so a CHECK lets it through.
      - text: The row is refused with a foreign key error
        correct: false
        why: No foreign key is involved. The only rule that could refuse it is NOT NULL.
      - text: The database changes NULL to the start time
        correct: false
        why: The database never replaces a value to satisfy a constraint.
  - id: sql-03-q-db-vs-app
    pools: [mastery]
    objective: 1
    type: single
    competencies: [sql.schema]
    stem: Application code already checks that a slot is free before it inserts a booking. Why is a UNIQUE constraint still needed?
    options:
      - text: 'Two requests can pass the check together'
        correct: true
        why: The check and the insert are separate steps, so both requests see a free slot. The constraint is the one guarantee that cannot be raced.
      - text: Application code cannot read the table
        correct: false
        why: It can read it, which is how it does the check.
      - text: Constraints make the check run faster
        correct: false
        why: Speed is not the reason. Correctness under concurrent use is.
      - text: A constraint does the check in the browser
        correct: false
        why: Constraints are enforced by the database server, whatever program writes to the table.
  - id: sql-03-q-on-delete
    pools: [mastery]
    objective: 1
    type: single
    competencies: [sql.schema]
    stem: A foreign key has no ON DELETE rule. What happens if you delete a customer who still has bookings?
    options:
      - text: The delete is refused with an error
        correct: true
        why: The default rule, NO ACTION, refuses a delete that would leave bookings pointing at nothing.
      - text: The bookings are deleted as well
        correct: false
        why: That needs ON DELETE CASCADE.
      - text: The bookings keep a customer_id that points nowhere
        correct: false
        why: The foreign key exists to prevent exactly this.
      - text: The customer_id of the bookings is set to NULL
        correct: false
        why: That needs ON DELETE SET NULL, and a column that allows NULL.
  - id: sql-03-q-identity
    pools: [mastery]
    objective: 1
    type: single
    competencies: [sql.schema]
    stem: What is the point of id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY?
    options:
      - text: The database picks the next id, so inserts do not supply one
        correct: true
        why: The database numbers the rows, and ALWAYS refuses a value supplied by mistake.
      - text: The id is the same as the row number and changes when rows are deleted
        correct: false
        why: Ids are never reused or renumbered. A deleted row leaves a gap.
      - text: The id is chosen by the application and checked by the database
        correct: false
        why: With ALWAYS the application does not supply it.
      - text: The id is stored as text
        correct: false
        why: It is an integer.

  # ---- Normalisation (objective 2) ----
  - id: sql-03-q-anomaly
    pools: [mastery, warmup]
    objective: 2
    type: single
    competencies: [sql.normalisation]
    stem: A calls table stores the caller's phone number on every call row. What goes wrong when the number changes?
    options:
      - text: 'Many rows must change, and one missed row disagrees'
        correct: true
        why: This is an update anomaly. A fact stored in many places can disagree with itself.
      - text: Nothing, because the new number is added automatically
        correct: false
        why: A database does not know the rows describe the same caller.
      - text: The calls with the old number are deleted
        correct: false
        why: Rows are not deleted by an update, but they stay out of step.
      - text: The table is locked until the number is fixed
        correct: false
        why: Locking is not related to repeated data.
  - id: sql-03-q-normalise-goal
    pools: [mastery]
    objective: 2
    type: single
    competencies: [sql.normalisation]
    stem: What is the aim of normalising a table?
    options:
      - text: Store each fact once, in the table about that thing
        correct: true
        why: Facts about a caller live in the callers table, and the call rows point to it with a key.
      - text: 'Make every table have the same columns in the same order'
        correct: false
        why: Tables describe different things, so their columns differ.
      - text: 'Put all the data in one big table to avoid joins'
        correct: false
        why: That is the opposite. One big table repeats facts.
      - text: 'Make queries run faster in every case, without exception'
        correct: false
        why: Normalising protects correctness. Some reads need joins and get slower.
  - id: sql-03-q-depends-on-key
    pools: [mastery]
    objective: 2
    type: single
    competencies: [sql.normalisation]
    stem: A calls table has call_id, caller_id, caller_name and reason. Which column does not depend on the call?
    options:
      - text: caller_name, because it depends on the caller
        correct: true
        why: A name belongs to the caller. It should be in the callers table and found through caller_id.
      - text: 'reason, because it describes the call itself'
        correct: false
        why: The reason is a fact about this call, so it belongs here.
      - text: 'caller_id, because it is a key to the caller table'
        correct: false
        why: caller_id is the link to the caller. Each call needs it.
      - text: 'call_id, because it is a number that counts up'
        correct: false
        why: call_id identifies the call and is the key of this table.
  - id: sql-03-q-insert-anomaly
    pools: [mastery]
    objective: 2
    type: single
    competencies: [sql.normalisation]
    stem: A single table holds callers and their calls. Why can you not record a new caller who has not called yet?
    options:
      - text: 'Every row is a call, so a caller needs one'
        correct: true
        why: This is an insert anomaly. A separate callers table lets a caller exist without calls.
      - text: 'Tables cannot have empty columns in them'
        correct: false
        why: Columns can be NULL. The design is the problem.
      - text: 'The caller would have no id to be stored with'
        correct: false
        why: An id could be generated. The problem is that the only table has no place for a caller without a call.
      - text: 'Phone numbers must be unique in the table'
        correct: false
        why: Uniqueness is not the issue. The structure is.
  - id: sql-03-q-denormalise
    pools: [mastery, warmup]
    objective: 2
    type: single
    competencies: [sql.normalisation]
    stem: When is it reasonable to store a copy of a fact, such as the price at the time of an order, in another table?
    options:
      - text: 'When the copy records what was true at the time'
        correct: true
        why: An order must keep the price paid, even if the product price changes. It is a snapshot, not a duplicate of live data.
      - text: 'Whenever a join looks slow in a test'
        correct: false
        why: Measure first. A copy has a cost, which is keeping it correct.
      - text: 'Never, because the normal forms forbid any copy'
        correct: false
        why: Normalising is a guide. Deliberate copies are common, with a reason.
      - text: 'Whenever a column name is very long'
        correct: false
        why: The length of a name has nothing to do with it.
  - id: sql-03-q-denormalise-cost
    pools: [mastery]
    objective: 2
    type: single
    competencies: [sql.normalisation]
    stem: What is the cost of copying a fact into a second table to avoid a join?
    options:
      - text: 'You must keep the copies in step'
        correct: true
        why: Every change has to reach all the copies. That is the update anomaly again, accepted on purpose.
      - text: The database refuses the second copy
        correct: false
        why: Nothing stops you. The cost comes later.
      - text: The first copy is deleted
        correct: false
        why: Copying does not remove anything.
      - text: Queries on the table stop working
        correct: false
        why: The queries work. The risk is wrong answers.
  - id: sql-03-q-normalise-steps
    pools: [mastery]
    objective: 2
    type: order
    competencies: [sql.normalisation, sql.schema]
    stem: Put the steps of splitting a messy table in order.
    steps:
      - Find the facts that are repeated on many rows
      - Create a table for that thing, with a primary key
      - Fill it with SELECT DISTINCT from the old table
      - Point the old rows at it with a foreign key and remove the repeated columns

  # ---- Parameterised queries (objective 3) ----
  - id: sql-03-q-injection
    pools: [mastery, warmup]
    objective: 3
    type: single
    competencies: [sql.parameters]
    stem: What is SQL injection?
    options:
      - text: 'User input becomes part of the command'
        correct: true
        why: When SQL is built by pasting text into a string, the text can contain SQL. The database then runs it as part of the command.
      - text: A fast way to load many rows into a table
        correct: false
        why: Loading many rows is a bulk insert. Injection is an attack.
      - text: An error that happens when two users write at once
        correct: false
        why: That is a concurrency problem, not an attack.
      - text: 'A way to add a column to a table safely'
        correct: false
        why: Adding a column is done with ALTER TABLE.
  - id: sql-03-q-placeholder
    pools: [mastery, warmup]
    objective: 3
    type: single
    competencies: [sql.parameters]
    stem: Which call is parameterised?
    options:
      - text: db.execute("SELECT id FROM calls WHERE reason = ?", (reason,))
        correct: true
        why: The SQL text and the value are sent separately, so the value can only be data.
      - text: db.execute(f"SELECT id FROM calls WHERE reason = '{reason}'")
        correct: false
        why: The f-string pastes the value into the SQL text before the database sees it.
      - text: db.execute("SELECT id FROM calls WHERE reason = '" + reason + "'")
        correct: false
        why: Joining strings with + pastes the value into the SQL in the same way.
      - text: db.execute("SELECT id FROM calls WHERE reason = '{}'".format(reason))
        correct: false
        why: The format method also builds the text in Python, before the database runs it.
  - id: sql-03-q-escape
    pools: [mastery]
    objective: 3
    type: single
    competencies: [sql.parameters]
    stem: Why is escaping quotes by hand a weaker defence than placeholders?
    options:
      - text: 'It is easy to miss a case in some driver'
        correct: true
        why: Placeholders keep values out of the SQL text, so there is nothing to escape and nothing to forget.
      - text: Escaping makes the query slower than placeholders
        correct: false
        why: Speed is not the reason. Safety is.
      - text: Escaping only works for numbers
        correct: false
        why: Escaping is meant for text. Numbers need placeholders as well.
      - text: Databases do not support quotes in text
        correct: false
        why: Text with quotes is fine when it is sent as a value.
  - id: sql-03-q-identifier
    pools: [mastery]
    objective: 3
    type: single
    competencies: [sql.parameters]
    stem: A user chooses which column to sort a list by. Can a ? placeholder stand for the column name?
    options:
      - text: 'No, so check the name against an allowed list'
        correct: true
        why: Placeholders stand for values only. A column name has to be in the SQL text, so only a name from an allowlist may be used.
      - text: Yes, placeholders can stand for any part of the SQL
        correct: false
        why: They stand for values. The database treats a value as data, not as a name.
      - text: 'Yes, but only in PostgreSQL and similar databases'
        correct: false
        why: This is the same in the common databases.
      - text: No, so paste the name into the SQL as typed
        correct: false
        why: Pasting a name as typed is the injection risk.
  - id: sql-03-q-number
    pools: [mastery]
    objective: 3
    type: single
    competencies: [sql.parameters]
    stem: The query is built with an f-string, but the only user input is a number, such as {min_seconds}, taken straight from the request without conversion. Is it safe?
    options:
      - text: 'No, because the number can arrive as SQL text'
        correct: true
        why: Web input arrives as text. Use a placeholder for numbers as well.
      - text: Yes, because numbers cannot contain SQL
        correct: false
        why: A value typed by a user is text until the program converts it. If it is pasted before that, it can carry SQL.
      - text: Yes, as long as the number is positive
        correct: false
        why: The sign does not matter. The text could be anything.
      - text: 'No, but only for decimal numbers like 1.5'
        correct: false
        why: The type does not matter. Pasted text is the problem.
  - id: sql-03-q-orm
    pools: [mastery]
    objective: 3
    type: single
    competencies: [sql.parameters]
    stem: A project uses an ORM, a library that builds queries for you. Where can injection still happen?
    options:
      - text: 'In raw SQL built from user input'
        correct: true
        why: The ORM's normal query methods use parameters. Raw fragments pasted from input bring the risk back.
      - text: Never, because an ORM makes injection impossible
        correct: false
        why: It removes the risk only where you use its methods as intended.
      - text: 'Only in the database server itself'
        correct: false
        why: The weakness is in how the application builds the query.
      - text: Only when the table has a primary key
        correct: false
        why: Keys have no effect on injection.
  - id: sql-03-q-bug-injection
    pools: [mastery]
    objective: 3
    type: bug
    competencies: [sql.parameters]
    code: |
      def find_customer(db, email):
          query = "SELECT id FROM customers WHERE email = '" + email + "'"
          return db.execute(query).fetchone()
    buggyLine: 2
    explanation: The email is pasted into the SQL text, so a value such as x' OR '1'='1 changes the query. Use db.execute("SELECT id FROM customers WHERE email = ?", (email,)).
