  - id: py-03-q-nonlocal
    pools: [mastery, warmup]
    objective: 1
    type: single
    competencies: [py.scope-closures]
    stem: What does nonlocal count do inside an inner function?
    options:
      - text: It lets the inner function rebind the count of the enclosing function
        correct: true
        why: Without it, assigning to count would create a new local name in the inner function.
      - text: It makes count a global variable
        correct: false
        why: That is what global does. nonlocal refers to the enclosing function, not the module.
      - text: It makes count a read-only constant
        correct: false
        why: Python has no such declaration. nonlocal is about which scope a name belongs to.
      - text: It copies count into the inner function
        correct: false
        why: No copy is made. The inner function shares the enclosing variable.
  - id: py-03-q-closure-remembers
    pools: [mastery, warmup]
    objective: 1
    type: single
    competencies: [py.scope-closures]
    stem: A function returns an inner function that uses one of its parameters. The outer function has finished. What happens when the inner function is called?
    options:
      - text: It still works, because it keeps a reference to the enclosing variable
        correct: true
        why: This is a closure. The enclosing variable stays alive as long as the inner function does.
      - text: It raises NameError, because the outer function has ended
        correct: false
        why: The variable lives on inside the closure, so the name is still found.
      - text: It uses the value the parameter had in the first call to the outer function
        correct: false
        why: Each call to the outer function makes its own variable, and the inner function uses the one from its own call.
      - text: It looks the name up in the global scope instead
        correct: false
        why: The enclosing scope is checked before the global scope, and the name is found there.
  - id: py-03-q-late-binding-fix
    pools: [mastery, warmup]
    objective: 1
    type: single
    competencies: [py.scope-closures]
    stem: 'fs = [lambda: i for i in range(3)] gives [2, 2, 2] when you call each function. Which change gives [0, 1, 2]?'
    options:
      - text: 'Write lambda i=i: i, so each function stores its own i'
        correct: true
        why: A default value is evaluated when the lambda is created, so each function keeps its own value.
      - text: Use range(2, -1, -1) so the list is filled backwards
        correct: false
        why: The order of the loop does not change when the lambdas read i. They still read the last value.
      - text: Call each function twice
        correct: false
        why: Calling more often does not change the variable the lambdas share.
      - text: Write global i inside the lambda
        correct: false
        why: A lambda cannot contain a statement, and a global would still be one shared variable.
  - id: py-03-q-shadow-builtin
    pools: [mastery]
    objective: 1
    type: single
    competencies: [py.scope-closures]
    stem: 'A script sets list = [1, 2] near the top. Later, list("ab") raises TypeError. Why?'
    options:
      - text: The global name list now hides the built-in list, and a list is not callable
        correct: true
        why: The global scope is searched before the built-ins, so the built-in is hidden by the new name.
      - text: list can only be called with numbers
        correct: false
        why: list accepts any iterable, including a string.
      - text: Built-in names can only be used once per program
        correct: false
        why: You can use a built-in as often as you like until you rebind its name.
      - text: A string cannot be turned into a list
        correct: false
        why: list("ab") gives ['a', 'b'] when list is the built-in.
