lesson: py-03
items:
  # ---- Chunk 1: scope and closures (objective 1) ----
  - id: py-03-q-legb-order
    pools: [check, mastery, warmup]
    chunk: 1
    objective: 1
    type: single
    competencies: [py.scope-closures]
    stem: Inside a function, Python needs the value of a name. In which order does it look?
    options:
      - text: Local, then enclosing functions, then global, then built-in
        correct: true
        why: This is the LEGB rule, and Python stops at the first place that has the name.
      - text: Global, then local, then enclosing functions, then built-in
        correct: false
        why: The function's own local names are checked first, so a local name hides a global one.
      - text: Built-in, then global, then enclosing functions, then local
        correct: false
        why: This is the reverse of the real order. Built-in names such as len are the last place Python looks.
      - text: Enclosing functions, then local, then built-in, then global
        correct: false
        why: The local scope always comes first, and the global scope comes before the built-ins.
  - id: py-03-q-unbound-local
    pools: [check, mastery]
    chunk: 1
    objective: 1
    type: single
    competencies: [py.scope-closures]
    stem: 'What happens when add(5) is called?'
    code: |
      total = 0

      def add(n):
          total += n
          return total
    options:
      - text: UnboundLocalError, because assigning to total makes it local to add
        correct: true
        why: Any assignment inside a function makes that name local for the whole function, so total is read before it has a value.
      - text: It returns 5, because Python finds the global total
        correct: false
        why: Reading a global works, but += also assigns, so total becomes a local name in add.
      - text: It changes the global total to 5 and returns 5
        correct: false
        why: Changing a global from a function needs a global declaration. Without one the name is local.
      - text: NameError, because total is not defined anywhere
        correct: false
        why: The global total exists. The error is about the local name, which has no value yet.
  - id: py-03-q-predict-loop-closures
    pools: [check, mastery]
