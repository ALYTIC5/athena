  - id: py-03-q-bug-closure
    pools: [mastery]
    objective: 1
    type: bug
    competencies: [py.scope-closures]
    code: |
      def make_greeters(names):
          greeters = []
          for name in names:
              def greet():
                  return "Hello " + name
              greeters.append(greet)
          return greeters
    buggyLine: 4
    explanation: Each greet reads name when it is called, and by then the loop has finished, so every greeter says hello to the last name. Give each function its own value, for example def greet(name=name), or build it in a helper function.
  - id: py-03-q-global-read
    pools: [mastery]
    objective: 1
    type: single
    competencies: [py.scope-closures]
    stem: 'RATE = 0.2 is set at module level. A function only reads RATE and never assigns to it. What happens?'
    options:
      - text: It works, because the global name is found after the local scope
        correct: true
        why: Reading follows the LEGB order, so no declaration is needed when you only read.
      - text: It raises NameError, because RATE needs a global declaration to be read
        correct: false
        why: A global declaration is only needed to assign. Reading finds the name by the normal lookup.
      - text: It raises UnboundLocalError, because RATE is not local
        correct: false
        why: That error appears when a name is assigned in the function and read first. Here it is never assigned.
      - text: It works only if RATE is a number
        correct: false
        why: The type of the value does not matter. Any global name can be read.

  # ---- Chunk 2: flexible arguments and decorators (objectives 2 and 3) ----
  - id: py-03-q-args-type
    pools: [check, mastery, warmup]
    chunk: 2
    objective: 2
    type: single
    competencies: [py.args-kwargs]
    stem: 'def f(*args): ... is called as f(1, "a", 3). What is args inside the function?'
    options:
      - text: The tuple (1, "a", 3)
        correct: true
        why: Extra positional arguments are collected into a tuple.
      - text: The list [1, "a", 3]
        correct: false
        why: It is a tuple, which cannot be changed. Convert it with list(args) if you need a list.
      - text: 'The dict {0: 1, 1: "a", 2: 3}'
        correct: false
        why: A dict is what **kwargs collects, and it uses names as keys, not positions.
      - text: Only the first argument, 1
        correct: false
        why: args holds all the extra positional arguments, not just the first.
  - id: py-03-q-keyword-only
    pools: [check, mastery, warmup]
    chunk: 2
    objective: 2
    type: single
    competencies: [py.args-kwargs]
    stem: 'def book(name, *, slot): ... What happens with book("amara", "09:00")?'
    options:
      - text: A TypeError, because slot must be given by keyword
        correct: true
        why: Parameters after a bare * can only be passed by name, as in book("amara", slot="09:00").
      - text: It works, and slot is "09:00"
        correct: false
        why: The bare * means everything after it is keyword-only, so a positional value is not accepted.
      - text: It works, and slot is None
        correct: false
        why: There is no default for slot, and the extra positional value is an error.
      - text: A SyntaxError, because * cannot stand alone
        correct: false
        why: A bare * is valid. It marks where keyword-only parameters begin.
  - id: py-03-q-predict-show
    pools: [check, mastery]
    chunk: 2
    objective: 2
    type: predict
    competencies: [py.args-kwargs]
    code: |
      def show(first, *args, sep="-", **kwargs):
          print(first, args, sep, kwargs)

      show(1, 2, 3, sep="+", a=4)
    investigate:
      - Which arguments end up in args, and which in kwargs?
      - Why can sep not be given positionally?
  - id: py-03-q-kwargs-type
    pools: [mastery]
    objective: 2
    type: single
    competencies: [py.args-kwargs]
    stem: 'def f(**kwargs): ... is called as f(a=1, b=2). What is kwargs?'
    options:
      - text: 'A dict, {"a": 1, "b": 2}'
        correct: true
        why: Extra keyword arguments are collected into a dict, with the names as keys.
      - text: A tuple, (1, 2)
        correct: false
        why: That is what *args does for positional arguments, and it would lose the names.
      - text: A tuple of pairs, (("a", 1), ("b", 2))
        correct: false
        why: It is a real dict, so you can use kwargs["a"] and kwargs.items().
      - text: A list of names, ["a", "b"]
        correct: false
        why: The values are collected too, not only the names.
  - id: py-03-q-unpack-call
    pools: [mastery, warmup]
    objective: 2
    type: single
    competencies: [py.args-kwargs]
    stem: 'def f(a, b, c=0): return a + b + c. What does f(*[1, 2], **{"c": 3}) return?'
    options:
      - text: '6'
        correct: true
        why: '* spreads the list into positional arguments (a=1, b=2) and ** spreads the dict into keyword arguments (c=3).'
      - text: '3'
        correct: false
        why: The keyword argument c=3 is passed too, so the total is 1 + 2 + 3.
      - text: A TypeError, because a list cannot be passed to a function
        correct: false
        why: The * in front of the list unpacks it. Without the star it would be one argument.
      - text: A TypeError, because c is given twice
        correct: false
        why: c is only given once, through the dict. The list holds just a and b.
  - id: py-03-q-decorator-equivalent
    pools: [mastery]
    objective: 3
    type: single
    competencies: [py.decorators]
    stem: 'A function is defined with @shout on the line above def greet(name). What does that line do?'
    options:
      - text: It is the same as writing greet = shout(greet) after the def
        correct: true
        why: The decorator is called with the function and its result replaces the name greet.
      - text: It calls greet once when it is defined
        correct: false
        why: The decorator is called, but the decorated function is not called until you call it.
      - text: It copies greet into a new function called shout
        correct: false
        why: shout is the decorator and already exists. The name greet is rebound to what shout returns.
      - text: It marks greet as read-only
        correct: false
        why: A decorator can do anything a function can do, but it does not mark a function read-only.
  - id: py-03-q-wraps-why
    pools: [mastery, warmup]
    objective: 3
    type: single
    competencies: [py.decorators]
    stem: What does @functools.wraps(func) on a wrapper function do?
    options:
      - text: It copies the name and docstring of func onto the wrapper
        correct: true
        why: Without it, the decorated function would report the wrapper's name, which makes tracebacks and help text confusing.
      - text: It makes the wrapper run faster
        correct: false
        why: It adds a little work when the decorator is applied. It does not change speed.
      - text: It calls func once before the wrapper
        correct: false
        why: wraps only copies information. The wrapper decides when func is called.
      - text: It stops the wrapper from receiving keyword arguments
        correct: false
        why: It has no effect on arguments. Use *args and **kwargs in the wrapper to accept all of them.
  - id: py-03-q-bug-wrapper-return
    pools: [mastery]
    objective: 3
    type: bug
    competencies: [py.decorators, py.args-kwargs]
    code: |
      import functools

      def log_calls(func):
          @functools.wraps(func)
          def wrapper(*args, **kwargs):
              print("calling", func.__name__)
              func(*args, **kwargs)
          return wrapper
    buggyLine: 8
    explanation: The wrapper calls func but throws the result away, so every decorated function returns None. Write return func(*args, **kwargs).
  - id: py-03-q-decorator-factory
    pools: [mastery]
    objective: 3
    type: single
    competencies: [py.decorators]
    stem: 'A function is decorated with @timed(clock). What must timed(clock) return?'
    options:
      - text: A decorator, which is a function that takes a function and returns one
        correct: true
        why: Python evaluates timed(clock) first, then applies the result as the decorator.
      - text: The decorated function itself
        correct: false
        why: The function does not exist yet when timed(clock) runs. It is passed to the returned decorator.
      - text: The current time
        correct: false
        why: That would be a number, and a number cannot be applied to a function.
      - text: None, because the clock is only a setting
        correct: false
        why: A decorator that takes a setting is a function that returns the real decorator, so None would break it.
  - id: py-03-q-first-class
    pools: [mastery, warmup]
    objective: 3
    type: single
    competencies: [py.decorators, py.scope-closures]
    stem: Why can you pass a function as an argument or return one from another function?
    options:
      - text: A function is an object, like a number or a list
        correct: true
        why: Functions are first-class objects. They can be stored in variables, collections and arguments, and returned.
      - text: Only functions defined with lambda can be passed
        correct: false
        why: Functions defined with def can be passed too. Lambda is only a short way to write one.
      - text: Python copies the function body each time
        correct: false
        why: Passing a function passes a reference to the same object. Nothing is copied.
      - text: Only built-in functions can be passed
        correct: false
        why: Any function can be passed, including your own.
  - id: py-03-q-predict-decorator
    pools: [mastery]
    objective: 3
    type: predict
    competencies: [py.decorators, py.args-kwargs]
    code: |
      import functools

      def shout(func):
          @functools.wraps(func)
          def wrapper(*args, **kwargs):
              return func(*args, **kwargs).upper()
          return wrapper

      @shout
      def greet(name):
          return "hi " + name

      print(greet("amara"), greet.__name__)
    investigate:
      - What would greet.__name__ print without functools.wraps?
      - Which function does the call greet("amara") run first?

  # ---- Chunk 3: iterators and generators (objective 4) ----
  - id: py-03-q-generator-call
    pools: [check, mastery, warmup]
    chunk: 3
    objective: 4
    type: single
    competencies: [py.iterators-generators]
    stem: 'def numbers(): yield 1 ... print("start") is in the body before the first yield. What does g = numbers() do?'
    options:
      - text: It returns a generator and runs none of the body yet
        correct: true
        why: The body starts running at the first next(g), up to the first yield.
      - text: It prints start and then returns the generator
        correct: false
        why: Calling a generator function does not run its body. Nothing is printed until you ask for the first item.
      - text: It runs the whole body and returns a list
        correct: false
        why: A generator function never returns a list by itself. It produces items one at a time.
      - text: It raises an error, because the function has no return
        correct: false
        why: A generator function does not need return. yield is enough.
  - id: py-03-q-generator-memory
    pools: [check, mastery]
    chunk: 3
    objective: 4
    type: single
    competencies: [py.iterators-generators]
    stem: A file has ten million call records. Why can a generator that yields one record at a time handle it with little memory?
    options:
      - text: It holds one record at a time instead of all of them
        correct: true
        why: Each record is produced when asked for and can be discarded after use, so memory use stays small.
      - text: It compresses the records
        correct: false
        why: A generator does not compress anything. It avoids building the whole collection.
      - text: It stores the records on disk automatically
        correct: false
        why: A generator does not use disk. It produces items on demand.
      - text: It reads the records faster than a list can
        correct: false
        why: The saving is in memory, not in total reading time.
