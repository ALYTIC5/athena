  - id: py-03-q-bug-generator
    pools: [mastery]
    objective: 4
    type: bug
    competencies: [py.iterators-generators, py.scope-closures]
    code: |
      def batches(records, size):
          batch = []
          for record in records:
              batch.append(record)
              if len(batch) == size:
                  yield batch
                  batch.clear()
          if batch:
              yield batch
    buggyLine: 7
    explanation: The generator yields the same list object each time and then empties it with clear(), so a caller that collects the batches, for example with list(batches(...)), ends up with several references to one empty list. Start a new list with batch = [] instead.
