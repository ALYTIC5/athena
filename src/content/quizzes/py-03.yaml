  - id: py-03-q-one-shot
    pools: [mastery]
    objective: 4
    type: single
    competencies: [py.iterators-generators]
    stem: 'gen = (n for n in range(3)). After a = list(gen), what does b = list(gen) give?'
    options:
      - text: An empty list, because the generator is already used up
        correct: true
        why: A generator can be consumed only once. To go through the items again, create a new generator.
      - text: The same list as a, [0, 1, 2]
        correct: false
        why: Lists can be read again and again, but a generator cannot.
      - text: A StopIteration error
        correct: false
        why: list() catches StopIteration and simply ends, so you get an empty list.
      - text: A list of None values
        correct: false
        why: Nothing is produced after the end, so the list is empty.
  - id: py-03-q-for-protocol
    pools: [mastery]
    objective: 4
    type: single
    competencies: [py.iterators-generators]
    stem: What does a for loop do with the object after the word in?
    options:
      - text: It gets an iterator with iter(), then calls next() until StopIteration
        correct: true
        why: This is the iterator protocol. It is why lists, files and generators can all be used in a for loop.
      - text: It copies all the items into a list first
        correct: false
        why: A for loop reads one item at a time. That is why it works on endless generators too.
      - text: It calls len() and then uses an index
        correct: false
        why: Many iterables have no length and no index, such as generators.
      - text: It only works on lists and tuples
        correct: false
        why: Any iterable works, including dicts, sets, strings, files and generators.
  - id: py-03-q-iterable-vs-iterator
    pools: [mastery, warmup]
    objective: 4
    type: single
    competencies: [py.iterators-generators]
    stem: Which statement about a list and a generator is correct?
    options:
      - text: A list is an iterable that can be looped over again, and a generator is an iterator that is used up once
        correct: true
        why: Each for loop over a list starts a fresh iterator, but a generator is its own iterator.
      - text: A list is an iterator, and a generator is an iterable
        correct: false
        why: This swaps the two ideas. A generator is itself an iterator.
      - text: Both can be looped over any number of times
        correct: false
        why: A generator is used up after one pass.
      - text: Neither can be used in a for loop
        correct: false
        why: Both can. A for loop accepts any iterable.
  - id: py-03-q-islice
    pools: [mastery]
    objective: 4
    type: single
    competencies: [py.iterators-generators]
    stem: A generator produces an endless stream of readings. How do you take the first five?
    options:
      - text: list(itertools.islice(readings, 5))
        correct: true
        why: islice takes a slice of an iterator lazily, so it stops after five items.
      - text: list(readings)[:5]
        correct: false
        why: list(readings) tries to collect the whole endless stream first and never finishes.
      - text: readings[:5]
        correct: false
        why: A generator cannot be sliced with square brackets. Use itertools.islice.
      - text: len(readings) == 5
        correct: false
        why: A generator has no length, and a comparison would not take items.
  - id: py-03-q-yield-vs-return
    pools: [mastery, warmup]
    objective: 4
    type: single
    competencies: [py.iterators-generators]
    stem: What is the difference between yield and return in a function?
    options:
      - text: yield hands back a value and pauses, and return ends the function
        correct: true
        why: A generator can yield many values. After a return, nothing more is produced.
      - text: yield ends the function, and return pauses it
        correct: false
        why: This swaps them. return is the one that ends the function.
      - text: They are the same, but yield is faster
        correct: false
        why: They behave differently. yield keeps the local state between items.
      - text: yield can only be used with numbers
        correct: false
        why: A generator can yield any object.
  - id: py-03-q-order-next
    pools: [mastery]
    objective: 4
    type: order
    competencies: [py.iterators-generators]
    stem: Put these events in the order they happen the first time you use a generator function.
    steps:
      - You call the generator function and get a generator object
      - You call next on the generator, and the body starts
      - The body runs until it reaches the first yield
      - The yielded value is returned to you, and the function pauses
  - id: py-03-q-predict-gen-state
    pools: [mastery]
    objective: 4
    type: predict
    competencies: [py.iterators-generators]
    code: |
      def countdown(n):
          while n > 0:
              yield n
              n -= 1

      gen = countdown(3)
      print(next(gen), next(gen), list(gen))
