lesson: py-02
items:
  # ---- Chunk 1: choosing a collection, and comprehensions (objectives 1 and 3) ----
  - id: py-02-q-pick-collection
    pools: [check, mastery, warmup]
    chunk: 1
    objective: 1
    type: single
    competencies: [py.collections]
    stem: You are reading a day of call records and need to know quickly whether a caller has already been seen. Which collection fits best?
    options:
      - text: A set of caller ids
        correct: true
        why: A set stores each item once and answers "is it in here?" without looking at every item.
      - text: A list of caller ids
        correct: false
        why: A list keeps every repeat and has to be searched from the start to answer the question.
      - text: A tuple of caller ids
        correct: false
        why: A tuple is a list that cannot change. It has the same slow search and cannot grow as you read more records.
      - text: A dict that maps each caller id to the string "seen"
        correct: false
        why: This works for lookup but stores a pointless value for every caller. A set stores only the ids, which is all the question needs.
  - id: py-02-q-hashable
    pools: [check, mastery, warmup]
    chunk: 1
    objective: 1
    type: single
    competencies: [py.collections]
    stem: Which of these can be used as a dict key?
    options:
      - text: '[9, 30]'
        correct: false
        why: A list can change, so it has no stable hash. Python raises TypeError (unhashable type).
      - text: '(9, 30)'
        correct: true
        why: A tuple of numbers cannot change and its items are hashable, so the tuple is hashable. It works as a key, for example (hour, minute).
      - text: '{9, 30}'
        correct: false
        why: A set can change, so it is not hashable. A frozenset would be.
      - text: '{"hour": 9}'
        correct: false
        why: A dict can change, so it is not hashable either.
  - id: py-02-q-predict-collections
    pools: [check, mastery]
    chunk: 1
    objective: 1
    type: predict
    competencies: [py.collections]
    code: |
      seen = {"bayu", "amara", "bayu"}
      prices = {"tea": 2, "cake": 5}
      prices["tea"] = 3
      prices["milk"] = 1
      print(len(seen), list(prices), prices["tea"])
    investigate:
      - Why does the set have two items although three were written?
      - Which position does "tea" keep in the dict after its value changes, and why?
  - id: py-02-q-tuple-vs-list
    pools: [mastery, warmup]
    objective: 1
    type: single
    competencies: [py.collections]
    stem: You store one call as (caller, hour, reason), and the three parts never change after the call is logged. Which is the better choice, and why?
    options:
      - text: A tuple, because it is a fixed record that cannot be changed by accident
        correct: true
        why: Use a tuple for a fixed group of related values. Its immutability protects the record and makes it hashable.
      - text: A list, because a list is the usual choice for a record you may want to edit later
        correct: false
        why: Lists are not faster for this. A list is for a sequence of similar items that may grow or change, and it cannot be a dict key.
      - text: A set, because it removes duplicates and then looks each part up fast
        correct: false
        why: A set has no order or positions, so you could not tell which part is the caller, and equal values would merge.
      - text: A dict, because a record always needs named fields
        correct: false
        why: A dict is a good choice when you want named fields, but a tuple is the simpler choice for a short fixed record.
  - id: py-02-q-dict-order
    pools: [mastery, warmup]
    objective: 1
    type: single
    competencies: [py.collections]
    stem: In current Python versions, in which order does a loop over a dict give its keys?
    options:
      - text: The order the keys were first added, as the language guarantees
        correct: true
        why: Since Python 3.7 the language guarantees insertion order for dicts. Changing the value of an existing key does not move it.
      - text: Alphabetical order, as the dict sorts its keys when you add them
        correct: false
        why: A dict never sorts its keys. Use sorted(d) when you want sorted keys.
      - text: A random order that can change on every run, as Python decides at start-up
        correct: false
        why: This was a common belief before Python 3.7. Today the order is defined.
      - text: The order of the values, smallest value first
        correct: false
        why: A dict does not look at values to decide order.
  - id: py-02-q-set-order
    pools: [mastery]
    objective: 1
    type: single
    competencies: [py.collections, py.mutability]
    stem: You print the callers in a set of strings to a report, and the lines appear in a different order on different days. What is the right fix?
    options:
      - text: Use sorted(callers) when you print
        correct: true
        why: Never rely on the order of a set. Sort when order matters.
      - text: Convert the set to a tuple first
        correct: false
        why: tuple(callers) keeps whatever arbitrary order the set had at that moment. It does not make the order stable.
      - text: Call callers.sort() before printing
        correct: false
        why: Sets have no sort method. Only lists do, and list.sort changes the list in place.
      - text: Use a set with fewer items
        correct: false
        why: The size of a set does not change its order guarantees.
  - id: py-02-q-comprehension-read
    pools: [mastery, warmup]
    objective: 3
    type: single
    competencies: [py.comprehensions]
    stem: What does this expression build?
    code: |
      [c["caller"] for c in calls if c["hour"] < 12]
    options:
      - text: A list of the callers whose calls were before noon
        correct: true
        why: Read it as "the caller of each call c in calls, where the hour is below 12". The if part filters, and the result is a list because of the square brackets.
      - text: A set of the callers whose calls were before noon
        correct: false
        why: A set comprehension uses curly brackets. Square brackets build a list, so repeats stay.
      - text: A generator that produces callers one at a time
        correct: false
        why: A generator expression uses round brackets. Square brackets build the whole list at once.
      - text: A dict that maps each caller to the hour
        correct: false
        why: A dict comprehension has a key and a value separated by a colon. This one has a single expression.
  - id: py-02-q-comprehension-write
    pools: [mastery]
    objective: 3
    type: single
    competencies: [py.comprehensions]
    stem: 'Which comprehension builds {"amara": 2, "bayu": 1} from the dict counts = {"amara": 2, "bayu": 1, "chen": 0}, leaving out callers with no calls?'
    options:
      - text: '{name: n for name, n in counts.items() if n > 0}'
        correct: true
        why: A dict comprehension loops over the pairs and keeps those where n is above 0.
      - text: '[name: n for name, n in counts.items() if n > 0]'
        correct: false
        why: This is not valid Python. Square brackets build a list, and a list item cannot be a key and value pair written with a colon.
      - text: '{name for name, n in counts.items() if n > 0}'
        correct: false
        why: This is a set comprehension. It keeps the names but drops the counts.
      - text: '(name: n for name, n in counts.items() if n > 0)'
        correct: false
        why: A generator expression produces single values, and a colon pair is not valid there.
  - id: py-02-q-genexp
    pools: [mastery]
    objective: 3
    type: single
    competencies: [py.comprehensions]
    stem: What is the difference between sum([s for s in seconds]) and sum(s for s in seconds)?
    options:
      - text: The second is a generator expression and builds no list first
        correct: true
        why: Both give the same total. The generator expression avoids storing all the items in memory at once.
      - text: The second gives a different total, because it skips repeated values
        correct: false
        why: The two forms produce the same values, so the total is the same.
      - text: The first is a syntax error, because sum cannot take a list written like that
        correct: false
        why: Both are valid. The first builds a list and then sums it.
      - text: The second sorts the values before it adds them, and the first does not
        correct: false
        why: Generator expressions work with any function that takes an iterable. The real difference is when the items are produced.
  - id: py-02-q-predict-dictcomp
    pools: [mastery]
    objective: 3
    type: predict
    competencies: [py.comprehensions, py.collections]
    code: |
      words = ["aa", "b", "aa", "ccc"]
      lengths = {w: len(w) for w in words}
      print(lengths, len([w for w in words if len(w) > 1]))
    investigate:
      - Why does the dict have three items when the list has four?
      - Which value does a repeated key end up with if the values differ?

  # ---- Chunk 2: counting, grouping and sorting (objective 4) ----
  - id: py-02-q-counter-missing
    pools: [check, mastery, warmup]
    chunk: 2
    objective: 4
    type: single
    competencies: [py.collections]
    stem: 'counts = Counter(["a", "b", "a"]). What does counts["z"] give?'
    options:
      - text: 0, and no entry for "z" is added
        correct: true
        why: A Counter returns 0 for a missing item instead of raising KeyError, and just reading it does not add the key.
      - text: A KeyError
        correct: false
        why: That is what a plain dict does. A Counter is a dict subclass that treats a missing item as a count of zero.
      - text: None
        correct: false
        why: Counter returns the number 0, which is what you want when you add to it.
      - text: 0, and "z" is added to the counter
        correct: false
        why: Reading a missing item does not add it. Only assigning, or adding to the count, creates the entry. (A defaultdict is different. It does add the key.)
  - id: py-02-q-defaultdict-factory
    pools: [check, mastery, warmup]
    chunk: 2
    objective: 4
    type: single
    competencies: [py.collections]
    stem: 'groups = defaultdict(list). What does groups["new"].append(1) do when "new" is not yet a key?'
    options:
      - text: It makes an empty list for "new", then appends 1
        correct: true
        why: When a key is missing, defaultdict calls the factory (list) to make the starting value.
      - text: It raises KeyError, as it would for a plain dict
        correct: false
        why: That is what a plain dict does. The default factory exists to avoid this.
      - text: It does nothing, because the key is missing
        correct: false
        why: Reading a missing key creates it with the factory value, so the append works.
      - text: It makes the key, with the value None
        correct: false
        why: The starting value comes from the factory. list() gives an empty list, so append works.
  - id: py-02-q-parsons-top-reasons
    pools: [check]
