  - id: py-02-q-predict-counter
    pools: [check, mastery]
    chunk: 2
    objective: 4
    type: predict
    competencies: [py.collections]
    code: |
      from collections import Counter

      words = ["b", "a", "b", "c", "a", "b"]
      counts = Counter(words)
      print(counts["b"], counts["z"], len(counts))
      print(sorted(counts, key=lambda w: (-counts[w], w)))
    investigate:
      - Why does reading counts["z"] not change len(counts)?
      - What does the minus sign in the key do?
  - id: py-02-q-sorted-key
    pools: [mastery, warmup]
    objective: 4
    type: single
    competencies: [py.collections]
    stem: 'What does sorted(calls, key=lambda c: c["seconds"]) return?'
    options:
      - text: A new list of the calls, shortest first
        correct: true
        why: sorted always returns a new list. The key function says what to compare, and the default direction is smallest first.
      - text: The same list, sorted in place in memory
        correct: false
        why: That describes calls.sort(...). sorted builds a new list.
      - text: A list of just the seconds values
        correct: false
        why: The key function only decides the order. The items returned are the calls themselves.
      - text: None, because sorted changes the list in place
        correct: false
        why: list.sort returns None, but sorted returns the new list.
  - id: py-02-q-sort-stable
    pools: [mastery]
    objective: 4
    type: single
    competencies: [py.collections]
    stem: 'Two calls have the same "seconds", and call A comes before call B in the input. After sorted(calls, key=lambda c: c["seconds"]), which comes first?'
    options:
      - text: Call A, because equal keys keep their input order
        correct: true
        why: Python sorts are stable. That is also why a second sort key (such as the id) is needed when you want a specific tie order.
      - text: Call B, because the later item wins a tie
        correct: false
        why: Ties never reorder the items. The input order is kept.
      - text: Either one, because the order of ties is not defined
        correct: false
        why: The order of ties is defined, not random.
      - text: Python raises an error when two keys are equal
        correct: false
        why: Equal keys are allowed and common.
  - id: py-02-q-tiebreak-key
    pools: [mastery]
    objective: 4
    type: single
    competencies: [py.collections]
    stem: 'What order does sorted(calls, key=lambda c: (-c["seconds"], c["id"])) give?'
    options:
      - text: Longest first, and for equal lengths the smaller id first
        correct: true
        why: Tuples compare one part at a time. The negative seconds put longer calls first, and the id breaks ties in alphabetical order.
      - text: Shortest first, and for equal lengths the larger id first
        correct: false
        why: This reverses both parts. The minus sign flips only the seconds, and ids sort ascending.
      - text: Smaller id first, and for equal ids the longest first
        correct: false
        why: The first part of the tuple decides the order, and the second part only breaks ties.
      - text: It raises an error, because a key cannot be a tuple
        correct: false
        why: A key can return any value that can be compared, and tuples can be compared.
  - id: py-02-q-sorted-vs-sort
    pools: [mastery]
    objective: 4
    type: single
    competencies: [py.collections, py.mutability]
    stem: 'A function does top = calls.sort(key=lambda c: c["seconds"]) and then top[0]. What happens?'
    options:
      - text: A TypeError, because sort returns None
        correct: true
        why: top is None, and None is not subscriptable. Use sorted(...) when you want the new list, or call sort and then use calls.
      - text: top holds the new sorted list, and calls is left unchanged
        correct: false
        why: This describes sorted. sort works in place and returns nothing.
      - text: top holds the sorted list, and calls is sorted in place as well
        correct: false
        why: sort returns None, so top is not the list.
      - text: top[0] is the longest call in the list
        correct: false
        why: sort puts the shortest first, and in any case top is None.
  - id: py-02-q-most-common
    pools: [mastery]
    objective: 4
    type: single
    competencies: [py.collections]
    stem: 'What does Counter(reasons).most_common(2) return?'
    options:
      - text: The two (reason, count) pairs with the top counts
        correct: true
        why: most_common(n) returns pairs, sorted by count from highest to lowest. Ties keep the order the items were first seen.
      - text: A list of the two top reasons only
        correct: false
        why: The pairs include the counts.
      - text: A new Counter that holds two items
        correct: false
        why: It returns a plain list of pairs, so you can loop over it or slice it.
      - text: Only the single most common reason
        correct: false
        why: With n=2 it returns two pairs. most_common(1) would return one pair, still inside a list.
  - id: py-02-q-bug-defaultdict
    pools: [mastery]
    objective: 4
    type: bug
    competencies: [py.collections]
    code: |
      def reasons_by_caller(calls):
          groups = {}
          for call in calls:
              groups[call["caller"]].append(call["reason"])
          return groups
    buggyLine: 4
    explanation: A plain dict has no list for a caller seen for the first time, so the first append raises KeyError. Start with groups = defaultdict(list), or create the list when the key is missing.

  # ---- Chunk 3: what it costs (objectives 2 and 5) ----
  - id: py-02-q-membership-cost
    pools: [check, mastery, warmup]
    chunk: 3
    objective: 2
    type: single
    competencies: [py.complexity, py.collections]
    stem: 'You test "x in items" many times. How does the cost of one test change as the collection grows?'
    options:
      - text: It grows for a list, and stays about the same for a set or dict
        correct: true
        why: A list is searched item by item. A set or dict finds an item through its hash, which takes about the same time whatever the size.
      - text: It grows with the length for a set, and stays about the same for a list
        correct: false
        why: This is the wrong way round. The hash lookup is what makes sets and dicts fast.
      - text: It is the same for lists, sets and dicts of the same size
        correct: false
        why: The three differ a lot, which is why the choice of collection matters.
      - text: It grows with the square of the length for every collection
        correct: false
        why: One test on a list is linear. The square appears when you repeat the test for every item.
  - id: py-02-q-big-o-loop
    pools: [check, mastery, warmup]
    chunk: 3
    objective: 5
    type: single
    competencies: [py.complexity]
    stem: 'What is the big-O cost of this function, where n is len(items)?'
    code: |
      def count_pairs(items):
          pairs = 0
          for a in items:
              for b in items:
                  if a < b:
                      pairs += 1
          return pairs
    options:
      - text: O(n squared), because the loops are nested
        correct: true
        why: Nested loops over the same input multiply. Doubling n makes the work about four times larger.
      - text: O(n), because there is only one list to read
        correct: false
        why: What counts is how many times the innermost line runs, not how many lists there are.
      - text: O(2n), because there are two loops in total
        correct: false
        why: Two loops one after the other would add. Two loops inside each other multiply.
      - text: O(1), because the function returns just one number
        correct: false
        why: The result is one number, but the work to produce it depends on n.
  - id: py-02-q-predict-steps
    pools: [check, mastery]
    chunk: 3
    objective: 5
    type: predict
    competencies: [py.complexity]
    code: |
      steps = 0
      for a in range(5):
          for b in range(5):
              if a < b:
                  steps += 1
      print(steps)
    investigate:
      - How many times does the line steps += 1 run, and how many times is the if tested?
      - If 5 became 50, roughly how many times would the if be tested?
  - id: py-02-q-big-o-dups
    pools: [mastery]
    objective: 5
    type: single
    competencies: [py.complexity]
    stem: 'A function loops over n items and, for each, does "item in seen" where seen is a list that grows by one item per pass. What is its cost?'
    options:
      - text: O(n squared)
        correct: true
        why: Each test scans up to the whole list, so the total is about 1 + 2 + ... + n steps, which grows with the square of n.
      - text: O(n)
        correct: false
        why: This would be true if "item in seen" took a constant time, as it does for a set.
      - text: O(n log n)
        correct: false
        why: n log n is the cost of sorting. Nothing here halves the work at each step.
      - text: O(1)
        correct: false
        why: The loop runs n times, so the cost cannot be constant.
  - id: py-02-q-big-o-sorted
    pools: [mastery]
    objective: 5
    type: single
    competencies: [py.complexity]
    stem: What is the usual cost of sorted(items) for a list of n items?
    options:
      - text: O(n log n)
        correct: true
        why: Python's sort (Timsort) takes n log n comparisons in the worst case.
      - text: O(n)
        correct: false
        why: A comparison sort cannot be linear in general, although Python's sort is close to it when the data is already nearly sorted.
      - text: O(n squared)
        correct: false
        why: That is the cost of a simple nested-loop sort. Python's sort does better.
      - text: O(log n)
        correct: false
        why: Every item has to be looked at at least once, so the cost is at least n.
  - id: py-02-q-set-convert
    pools: [mastery, warmup]
    objective: 2
    type: single
    competencies: [py.complexity, py.collections]
    stem: You must check 5,000 caller ids against a blocked list of 5,000 ids. What is the best approach?
    options:
      - text: Build a set from the blocked list once, then test each caller in it
        correct: true
        why: Building the set costs about n steps once. Each of the 5,000 tests then costs about one step, instead of up to 5,000.
      - text: Test each caller against the blocked list with "in", one caller at a time
        correct: false
        why: Each test scans up to 5,000 items, so the total is about 25 million comparisons.
      - text: Build a new set from the blocked list inside the loop, for each caller
        correct: false
        why: Rebuilding the set each time brings back the cost you wanted to avoid. Build it once, before the loop.
      - text: Sort both lists, then loop over them with one loop inside the other
        correct: false
        why: Sorting is not needed for a membership question, and it costs n log n.
  - id: py-02-q-set-multiple
    pools: [mastery]
    objective: 2
    type: multiple
    competencies: [py.complexity, py.collections]
    stem: Which statements about membership tests are true? Choose all that apply.
    options:
      - text: '"x in a_set" takes about the same time for 10 items and for 10 million, on average'
        correct: true
        why: A set finds an item through its hash, so the size hardly matters.
      - text: '"key in a_dict" checks the keys, not the values'
        correct: true
        why: A dict membership test looks only at the keys, and it is also a hash lookup.
      - text: '"x in a_list" has to compare x with the items one by one until it finds a match'
        correct: true
        why: This is a linear search. In the worst case it checks every item.
      - text: A set keeps the items in the order they were added
        correct: false
        why: A set promises no order. A dict keeps insertion order, but a set does not.
  - id: py-02-q-dict-lookup
    pools: [mastery]
    objective: 2
    type: single
    competencies: [py.complexity, py.collections]
    stem: What is needed before a value can be used as a dict key or a set item?
    options:
      - text: It must be hashable, so it cannot change
        correct: true
        why: The hash decides where the item is stored, so it must not change while the item is in the collection.
      - text: It must be a string or a number
        correct: false
        why: Numbers, tuples of hashable items and other immutable values work too.
      - text: It must be sorted before it is stored
        correct: false
        why: Dicts and sets do not sort their contents.
      - text: It must be unique in the whole program
        correct: false
        why: It only needs to be unique inside this dict or set. Two equal keys would be the same key.
  - id: py-02-q-big-o-order
    pools: [mastery]
    objective: 5
    type: order
    competencies: [py.complexity]
    stem: Put these costs in order, from the one that grows slowest to the one that grows fastest as n gets large.
    steps:
      - O(1), such as reading a dict item
      - O(n), such as one pass over a list
      - O(n log n), such as sorting
      - O(n squared), such as comparing every pair
  - id: py-02-q-big-o-two-loops
    pools: [mastery]
    objective: 5
    type: single
    competencies: [py.complexity]
    stem: 'A function makes one pass over n calls to count callers, and then a second, separate pass over the same calls to count hours. What is its cost?'
    options:
      - text: O(n), because the two passes add up and the constant is ignored
        correct: true
        why: Sequential loops add. Big-O ignores the constant 2, so the growth is still linear.
      - text: O(n squared), because every call is looked at by two different loops
        correct: false
        why: Only loops inside each other multiply.
      - text: O(2n squared), because each pass is repeated for every call
        correct: false
        why: The loops are not nested, so nothing is squared.
      - text: O(log n), because the second pass can reuse the first
        correct: false
        why: Each pass reads every call, so the cost cannot be smaller than n.
  - id: py-02-q-set-worst-case
    pools: [mastery]
    objective: 2
    type: single
    competencies: [py.complexity, py.collections]
    stem: A reviewer says "set lookups are O(1)". What is the more careful statement?
    options:
      - text: They are O(1) on average, but can be slower in a bad case
        correct: true
        why: The Python documentation gives the average case as constant time. A very bad hash function can make many items collide, which slows lookups.
      - text: They are O(1) in every case, whatever the items are
        correct: false
        why: Constant time holds on average, not in every possible case.
      - text: They are O(log n), as the items are kept sorted
        correct: false
        why: A set is not stored as a sorted structure. It uses hashing.
      - text: They are O(n), as the set is searched in order
        correct: false
        why: A list is searched item by item. A set uses a hash to jump to the right place.
