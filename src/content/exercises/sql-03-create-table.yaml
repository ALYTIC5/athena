id: sql-03-create-table
lesson: sql-03
runtime: sql
kind: make
pools:
  - lesson
title: 'Create a customers table'
difficulty: 1
competencies:
  - sql.schema
timeoutMs: 5000
estMin: 2
extensions: []
schema: |
  SELECT 1;
prompt: |
  Create a table `customers` for a booking system:

  - `id`: an integer primary key that the database generates (`GENERATED ALWAYS AS IDENTITY`).
  - `name`: text, required.
  - `phone`: text, required, and no two customers may have the same phone number.
  - `created_at`: a timestamp with time zone, required, set to the current time when a row is added without a value.

  The checks insert rows to test each rule.
starter: |
  CREATE TABLE customers (
    ...
  );
referenceSolution: |
  CREATE TABLE customers (
    id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    name text NOT NULL,
    phone text NOT NULL UNIQUE,
    created_at timestamptz NOT NULL DEFAULT now()
  );
compare: none
checks:
  - "WITH i AS (INSERT INTO customers (name, phone) VALUES ('Amara Okafor', '+44 7700 900123') RETURNING id, created_at) SELECT count(*) = 1 AND bool_and(id IS NOT NULL AND created_at IS NOT NULL) FROM i"
  - sql: "INSERT INTO customers (name, phone) VALUES ('Dara Obi', '+44 7700 900125'); INSERT INTO customers (name, phone) VALUES ('Ewa Nowak', '+44 7700 900125');"
    expectError: '23505'
  - sql: "INSERT INTO customers (name, phone) VALUES (NULL, '+44 7700 900124');"
    expectError: '23502'
  - sql: "INSERT INTO customers (name, phone) VALUES ('Chen Wei', NULL);"
    expectError: '23502'
  - sql: "INSERT INTO customers (name, phone, created_at) VALUES ('Ola Berg', '+44 7700 900126', NULL);"
    expectError: '23502'
  - sql: "INSERT INTO customers (id, name, phone) VALUES (500, 'Ola Berg', '+44 7700 900127');"
    expectError: '428C9'
  - "SELECT count(*) = 1 FROM information_schema.table_constraints WHERE table_name = 'customers' AND constraint_type = 'PRIMARY KEY'"
wrongSolutions:
  - label: 'Does not make the phone number unique, so two customers can share one'
    code: |
      CREATE TABLE customers (
        id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        name text NOT NULL,
        phone text NOT NULL,
        created_at timestamptz NOT NULL DEFAULT now()
      );
  - label: 'Lets the name be empty (NULL)'
    code: |
      CREATE TABLE customers (
        id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        name text,
        phone text NOT NULL UNIQUE,
        created_at timestamptz NOT NULL DEFAULT now()
      );
  - label: 'Gives created_at no default, so a new row has no creation time'
    code: |
      CREATE TABLE customers (
        id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        name text NOT NULL,
        phone text NOT NULL UNIQUE,
        created_at timestamptz
      );
  - label: 'Lets the phone number be empty (NULL)'
    code: |
      CREATE TABLE customers (
        id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        name text NOT NULL,
        phone text UNIQUE,
        created_at timestamptz NOT NULL DEFAULT now()
      );
hints:
  - 'Which rule belongs to which column: required, unique, generated, or a default?'
  - 'NOT NULL makes a column required. UNIQUE refuses duplicates. DEFAULT now() fills in the current time. GENERATED ALWAYS AS IDENTITY lets the database choose the id.'
  - |-
    phone text ____ ____,
    created_at timestamptz NOT NULL ____ now()
explanation: |
  Each rule is a constraint in the table definition, so the database enforces it for every program that writes to the table. `PRIMARY KEY` means unique and not null, and an identity column lets the database generate the key. `NOT NULL` makes a column required, `UNIQUE` refuses a second row with the same value (SQLSTATE 23505), and `DEFAULT now()` fills a value in when the insert leaves the column out. Alternative: `id bigint GENERATED BY DEFAULT AS IDENTITY` also allows you to supply your own ids, which helps when loading existing data. `ALWAYS` prevents accidents.
