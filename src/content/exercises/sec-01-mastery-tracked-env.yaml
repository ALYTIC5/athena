  - label: Only checks the whole path, so nested files are missed
    code: |
      def tracked_secret_files(paths: list[str]) -> list[str]:
          return [p for p in paths if (p == ".env" or p.startswith(".env.") or p.endswith(".pem")) and p != ".env.example"]
  - label: Looks for ".env" anywhere in the name, so names like not.env are flagged
    code: |
      def tracked_secret_files(paths: list[str]) -> list[str]:
          flagged = []
          for path in paths:
              name = path.rsplit("/", 1)[-1]
              if name == ".env.example":
                  continue
              if ".env" in name or name.endswith(".pem"):
                  flagged.append(path)
          return flagged
explanation: |
  `path.rsplit("/", 1)[-1]` takes the file name, so the same rule works at any depth. Checking `.env.example` first stops the safe file from being caught by the `.env.` prefix. Alternative: `pathlib.PurePosixPath(path).name` does the same and reads more clearly, at the cost of an import. A real project would also list other secret file types in its `.gitignore`.
