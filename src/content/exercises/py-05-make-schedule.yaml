referenceSolution: |
  class DoubleBookingError(Exception):
      """Raised when a slot is already booked."""


  class Schedule:
      def __init__(self) -> None:
          self._booked: dict[str, str] = {}

      def book(self, slot: str, guest: str) -> None:
          if not slot.strip() or not guest.strip():
              raise ValueError("slot and guest must not be empty")
          if slot in self._booked:
              raise DoubleBookingError(slot)
          self._booked[slot] = guest

      def cancel(self, slot: str) -> None:
          del self._booked[slot]

      def guest_at(self, slot: str) -> str | None:
          return self._booked.get(slot)

      def slots(self) -> list[str]:
          return sorted(self._booked)
