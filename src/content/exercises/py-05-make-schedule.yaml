explanation: |
  The class owns one dict, created in `__init__`, so each `Schedule` has its own state. `book` checks before it stores, so a refused booking changes nothing. `cancel` uses `del`, which raises `KeyError` for a missing slot, and `slots` returns `sorted(...)`, which is a new list that callers cannot use to reach the internal dict. The annotations document the contract, and a type checker such as mypy or pyright can then check every call to these methods before the program runs. Python itself does not enforce them. Alternative: store the bookings in a `dataclass` with a `field(default_factory=dict)`. That removes the `__init__`, but the methods still need to be written, and the attribute becomes part of the public constructor.
