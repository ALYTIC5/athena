id: py-05-make-schedule
lesson: py-05
runtime: python
kind: make
pools:
  - lesson
title: 'A Schedule that prevents double-booking'
difficulty: 3
competencies:
  - py.classes
  - py.typing
timeoutMs: 5000
packages: []
prompt: |
  Write a class `Schedule` that keeps one guest for each time slot and never allows two guests in the same slot. `DoubleBookingError` is already defined for you.

  - `Schedule()` starts empty. Every schedule has its own bookings.
  - `book(slot, guest)` records the guest for the slot. If the slot is already booked, raise `DoubleBookingError` and keep the first guest. If `slot` or `guest` is empty or only spaces, raise `ValueError`.
  - `cancel(slot)` removes the booking. Cancelling a slot that is not booked raises `KeyError`.
  - `guest_at(slot)` returns the guest, or `None` if the slot is free.
  - `slots()` returns a new list of the booked slots, sorted.
  - Every parameter and every return value of these four methods needs a type hint.

  Example: after `schedule.book("09:00", "Amara")`, `schedule.guest_at("09:00")` is `"Amara"`, and booking `"09:00"` again raises `DoubleBookingError`.
starter: |
  class DoubleBookingError(Exception):
      """Raised when a slot is already booked."""


  class Schedule:
      ...
visibleTests: |
  def test_book_and_look_up():
      schedule = Schedule()
      schedule.book("09:00", "Amara")
      assert schedule.guest_at("09:00") == "Amara"
      assert schedule.guest_at("10:00") is None

  def test_double_booking_is_refused_and_the_first_guest_stays():
      schedule = Schedule()
      schedule.book("09:00", "Amara")
      try:
          schedule.book("09:00", "Bayu")
      except DoubleBookingError:
          pass
      else:
          raise AssertionError("expected DoubleBookingError")
      assert schedule.guest_at("09:00") == "Amara"
hiddenTests: |
  import inspect


  def raises(error, function, *args):
      try:
          function(*args)
      except error:
          return True
      return False


  def test_cancel_frees_the_slot():
      schedule = Schedule()
      schedule.book("09:00", "Amara")
      schedule.cancel("09:00")
      assert schedule.guest_at("09:00") is None
      schedule.book("09:00", "Bayu")
      assert schedule.guest_at("09:00") == "Bayu"

  def test_cancel_of_an_unbooked_slot_raises_key_error():
      assert raises(KeyError, Schedule().cancel, "09:00")

  def test_empty_slot_or_guest_is_refused():
      schedule = Schedule()
      assert raises(ValueError, schedule.book, "", "Amara")
      assert raises(ValueError, schedule.book, "09:00", "   ")
      assert schedule.slots() == []

  def test_slots_are_sorted():
      schedule = Schedule()
      for slot in ["11:00", "09:00", "10:00"]:
          schedule.book(slot, "guest")
      assert schedule.slots() == ["09:00", "10:00", "11:00"]

  def test_slots_returns_a_new_list():
      schedule = Schedule()
      schedule.book("09:00", "Amara")
      result = schedule.slots()
      result.append("23:00")
      assert schedule.slots() == ["09:00"]

  def test_schedules_are_independent():
      first = Schedule()
      second = Schedule()
      first.book("09:00", "Amara")
      assert second.guest_at("09:00") is None
      assert second.slots() == []

  def test_one_guest_can_hold_two_slots():
      schedule = Schedule()
      schedule.book("09:00", "Amara")
      schedule.book("10:00", "Amara")
      assert schedule.slots() == ["09:00", "10:00"]

  def test_double_booking_error_is_an_exception_type():
      assert issubclass(DoubleBookingError, Exception)

  def test_every_method_has_type_hints():
      for name in ["book", "cancel", "guest_at", "slots"]:
          signature = inspect.signature(getattr(Schedule, name))
          for parameter in list(signature.parameters.values())[1:]:
              assert parameter.annotation is not inspect.Parameter.empty, name + " needs a hint for " + parameter.name
          assert signature.return_annotation is not inspect.Signature.empty, name + " needs a return hint"
