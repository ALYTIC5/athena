referenceSolution: |
  import asyncio


  async def load_context(client, ref: str, timeout: float) -> dict:
      async with asyncio.timeout(timeout):
          customer, slot, price = await asyncio.gather(
              client.fetch("customer", ref),
              client.fetch("slot", ref),
              client.fetch("price", ref),
          )
      return {"customer": customer, "slot": slot, "price": price}
wrongSolutions:
  - label: 'Awaits the lookups one after another, so the waits add up'
    code: |
      import asyncio


      async def load_context(client, ref: str, timeout: float) -> dict:
          async with asyncio.timeout(timeout):
              customer = await client.fetch("customer", ref)
              slot = await client.fetch("slot", ref)
              price = await client.fetch("price", ref)
          return {"customer": customer, "slot": slot, "price": price}
  - label: 'Gathers the lookups but sets no time limit'
    code: |
      import asyncio


      async def load_context(client, ref: str, timeout: float) -> dict:
          customer, slot, price = await asyncio.gather(
              client.fetch("customer", ref),
              client.fetch("slot", ref),
              client.fetch("price", ref),
          )
          return {"customer": customer, "slot": slot, "price": price}
  - label: 'Catches the timeout and returns an empty dict, hiding the failure'
    code: |
      import asyncio


      async def load_context(client, ref: str, timeout: float) -> dict:
          try:
              async with asyncio.timeout(timeout):
                  customer, slot, price = await asyncio.gather(
                      client.fetch("customer", ref),
                      client.fetch("slot", ref),
                      client.fetch("price", ref),
                  )
          except TimeoutError:
              return {}
          return {"customer": customer, "slot": slot, "price": price}
  - label: 'Uses return_exceptions=True, so a failed lookup is returned as a value'
    code: |
      import asyncio


      async def load_context(client, ref: str, timeout: float) -> dict:
          async with asyncio.timeout(timeout):
              customer, slot, price = await asyncio.gather(
                  client.fetch("customer", ref),
                  client.fetch("slot", ref),
                  client.fetch("price", ref),
                  return_exceptions=True,
              )
          return {"customer": customer, "slot": slot, "price": price}
  - label: 'Pairs the names with results in the order they finish, not the order they were started'
    code: |
      import asyncio


      async def load_context(client, ref: str, timeout: float) -> dict:
          names = ["customer", "slot", "price"]
          result = {}
          async with asyncio.timeout(timeout):
              tasks = [asyncio.create_task(client.fetch(name, ref)) for name in names]
              for name, finished in zip(names, asyncio.as_completed(tasks)):
                  result[name] = await finished
          return result
explanation: |
  `asyncio.gather` starts every coroutine you give it and waits for all of them, so the lookups wait side by side and the job takes about as long as the slowest one (3 seconds here) instead of the sum (6 seconds). Its results come back in the order you passed the coroutines, which is why unpacking into `customer, slot, price` is safe. One `asyncio.timeout` around the gather sets a single limit for the whole job; when it expires, asyncio cancels the unfinished lookups and raises `TimeoutError` at the end of the `async with` block.

  An alternative is `await asyncio.wait_for(asyncio.gather(...), timeout)`, which does the same in one line. Catching `TimeoutError` inside the function, as the wrong solution does, hides the failure from the caller, which is usually the part of the code that knows whether to retry or to answer 504.
