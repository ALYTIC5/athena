id: api-02-make-gather-lookups
lesson: api-02
runtime: python
kind: make
pools:
  - lesson
title: Load three lookups at once, with one time limit
difficulty: 3
competencies:
  - py.async
  - api.client
timeoutMs: 5000
estMin: 12
packages: []
prompt: |
  Before a booking confirmation goes out, three lookups must finish: the customer record, the slot, and the price. Each one is a call to an external service, so each one mostly waits. Write `load_context(client, ref, timeout)`.

  - `client` has one coroutine method, `await client.fetch(name, ref)`, which returns the result of one lookup. The names are `"customer"`, `"slot"` and `"price"`.
  - Run the three lookups **at the same time**, not one after another.
  - The whole job has **one** time limit of `timeout` seconds. If the lookups have not all finished by then, raise `TimeoutError` (the built-in one).
  - Return a dict `{"customer": ..., "slot": ..., "price": ...}` with each lookup's result.
  - If a lookup raises an error, let it reach the caller unchanged.

  The tests use a fake client that waits with `asyncio.sleep` on a virtual clock, so they run instantly and measure exactly how long your function would have taken.
starter: |
  import asyncio


  async def load_context(client, ref: str, timeout: float) -> dict:
