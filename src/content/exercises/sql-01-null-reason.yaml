id: sql-01-null-reason
lesson: sql-01
runtime: sql
kind: make
pools:
  - lesson
title: 'Calls with no recorded reason'
difficulty: 2
competencies:
  - sql.nulls
timeoutMs: 5000
estMin: 2
extensions: []
schema: |
  CREATE TABLE calls (
    id integer PRIMARY KEY,
    caller_name text NOT NULL,
    hour integer NOT NULL,
    duration_s integer,
    reason text
  );
  INSERT INTO calls VALUES
    (1, 'Amara', 11, 120, 'booking'),
    (2, 'Bayu', 9, 45, 'billing'),
    (3, 'Chen', 9, NULL, NULL),
    (4, 'Dara', 9, 300, 'booking'),
    (5, 'Esi', 16, 60, NULL),
    (6, 'Farid', 10, 15, 'cancel'),
    (7, 'Gita', 15, NULL, 'booking'),
    (8, 'Hana', 12, 200, 'billing'),
    (9, 'Ivo', 11, 90, 'booking'),
    (10, 'Jun', 10, 30, 'cancel');
prompt: |
  The table `calls` has one row per call: `id`, `caller_name`, `hour` (0 to 23), `duration_s` (seconds, or NULL if the call was not answered) and `reason` (NULL if no reason was recorded). Keep the column names.

  Select `caller_name` of the calls where no reason was recorded (`reason` is NULL), in `id` order.
starter: |
  SELECT ...
referenceSolution: |
  SELECT caller_name FROM calls WHERE reason IS NULL ORDER BY id;
compare:
  orderMatters: true
checks: []
wrongSolutions:
  - label: 'Uses = NULL, which is never true, so no rows come back'
    code: |
      SELECT caller_name FROM calls WHERE reason = NULL ORDER BY id;
  - label: 'Compares with an empty string, but the reason is NULL, not empty'
    code: |
      SELECT caller_name FROM calls WHERE reason = '' ORDER BY id;
  - label: 'Returns the calls that do have a reason'
    code: |
      SELECT caller_name FROM calls WHERE reason IS NOT NULL ORDER BY id;
hints:
  - 'What does a comparison such as reason = NULL give, when the reason is NULL?'
  - 'NULL means unknown, and a comparison with an unknown value is not true. SQL has a special test for it, written with the word IS.'
  - 'SELECT caller_name FROM calls WHERE reason ____ ____ ORDER BY id;'
explanation: |
  A comparison with NULL, including `reason = NULL`, gives unknown, and `WHERE` keeps a row only when the condition is true, so `= NULL` returns nothing. `IS NULL` is the test that answers yes or no for a missing value. NULL is also not the empty string: `reason = ''` matches only rows where the reason is an empty text. Alternative: `reason IS NOT DISTINCT FROM NULL` also matches NULL, but `IS NULL` is the usual short form.
