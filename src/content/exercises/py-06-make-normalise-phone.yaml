explanation: |
  Test first means the rules become examples before the code exists: the international form, the national form, the 0044 form, the characters to ignore, and each kind of bad input. The function then follows the same steps as the tests. It cleans the text, chooses the national part by the prefix (the `0044` check must come before the single `0` check, because `0044...` also starts with `0`), and finally checks the digits. Raising `ValueError` for bad input gives callers one clear thing to handle. Alternative: a regular expression such as `^(?:\+44|0044|0)(\d{10})$` after cleaning does the prefix and the length in one step, but the step-by-step version is easier to read and to extend.
