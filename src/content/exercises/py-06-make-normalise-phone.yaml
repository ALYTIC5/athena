  - test: test_plus_without_digits_is_refused
    message: 'A prefix with no digits after it has 0 digits, not 10, so raise ValueError.'
hints:
  - 'What are the steps: clean the text, find the prefix, check the digits, build the result? Which step can fail?'
  - "Remove the characters in ' -()'. Choose the national part by the prefix: +44, then 0044, then 0. If no prefix fits, raise. Then check the rest has exactly 10 digits and only digits."
  - |-
