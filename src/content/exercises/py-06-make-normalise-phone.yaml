referenceSolution: |
  def normalise_uk_mobile(text: str) -> str:
      cleaned = "".join(ch for ch in text if ch not in " -()")
      if cleaned.startswith("+44"):
          national = cleaned[3:]
      elif cleaned.startswith("0044"):
          national = cleaned[4:]
      elif cleaned.startswith("0"):
          national = cleaned[1:]
      else:
          raise ValueError("not a UK number")
      if len(national) != 10 or not national.isdigit():
          raise ValueError("the national number must be 10 digits")
      return "+44" + national
