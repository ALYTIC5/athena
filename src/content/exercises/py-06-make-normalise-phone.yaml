title: 'Normalise a UK mobile number (test first)'
difficulty: 3
competencies:
  - py.pytest
  - py.exceptions
timeoutMs: 5000
packages: []
prompt: |
  Callers' numbers arrive in many forms. Write `normalise_uk_mobile(text)`, which returns the number in the form `+44` followed by the 10-digit national number, for example `+447700900123`. Work test first: look at the visible tests, write your own small tests in your editor for each rule, and then make them pass.

  - Spaces, hyphens and round brackets in the text are ignored.
  - The text may start with `+44`, with `0044`, or with a single `0` (the national form). The rest must then be exactly 10 digits.
  - Anything else raises `ValueError`: a different start, letters, or a wrong number of digits.

  The examples use only the reserved fictional range `+44 7700 900000` to `+44 7700 900999`.
starter: |
  def normalise_uk_mobile(text: str) -> str:
      ...
visibleTests: |
  def test_international_form():
      assert normalise_uk_mobile("+44 7700 900123") == "+447700900123"

  def test_national_form():
      assert normalise_uk_mobile("07700 900123") == "+447700900123"
hiddenTests: |
  def raises_value_error(text):
      try:
          normalise_uk_mobile(text)
      except ValueError:
          return True
      return False


  def test_double_zero_form():
      assert normalise_uk_mobile("0044 7700 900456") == "+447700900456"

  def test_hyphens_and_brackets_are_ignored():
      assert normalise_uk_mobile("(07700) 900-999") == "+447700900999"

  def test_already_normalised_text_is_unchanged():
      assert normalise_uk_mobile("+447700900000") == "+447700900000"

  def test_too_few_digits_is_refused():
      assert raises_value_error("07700 900")

  def test_too_many_digits_is_refused():
      assert raises_value_error("07700900123456")

  def test_letters_are_refused():
      assert raises_value_error("07700 90012A")

  def test_other_country_code_is_refused():
      assert raises_value_error("+1 555 0100")

  def test_empty_text_is_refused():
      assert raises_value_error("")

  def test_plus_without_digits_is_refused():
      assert raises_value_error("+44")
