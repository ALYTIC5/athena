explanation: |
  The loop is a small state machine with two flags: `in_section` (are we under `## Quickstart`?) and `in_block` (are we between the first pair of fences?). A new `## ` heading resets `in_section`, which is how a block under a later heading is ignored, and returning at the first closing fence is how later blocks are ignored. Alternative: split the README into sections first with one pass, then search the Quickstart section for a block with a second pass. That reads more clearly in two steps, but needs more code. Tools that test READMEs in CI do something similar, which is how teams catch commands that no longer work.
