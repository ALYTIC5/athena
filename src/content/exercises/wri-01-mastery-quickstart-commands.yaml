title: Pull the quickstart commands out of a README
difficulty: 3
competencies:
  - wri.readme
timeoutMs: 5000
packages: []
estMin: 12
prompt: |
  A teammate wants to test that a README's quickstart really works, so they need its commands as a list. Write `quickstart_commands(readme)`.

  Rules:
  - The quickstart section starts at a line `## Quickstart` (ignoring case and spaces after the heading text; the line itself starts with `## `) and ends at the next line that starts with `## `. A `## ` line inside the code block is just a comment line. Its quickstart is the first fenced code block in the section: it starts with a line beginning with three backticks (spaces before them are allowed, and the whole fence line, including any language tag such as `bash`, is not a command) and ends at the next such line.
  - Return the commands in that block, one string per line, in order, without surrounding spaces.
  - Strip each line first. Skip blank lines and comment lines (lines that start with `#`).
  - If a command starts with the prompt `$ ` (a dollar sign and a space), remove the prompt and any spaces after it.
  - If the block is never closed, return the commands found so far.
  - Return an empty list when there is no `## Quickstart` section or it has no code block.
  - Ignore every other code block, in other sections or after the first one.

  Example: a quickstart block containing `# install`, `$ pip install slotkeeper` and `slotkeeper init` returns `["pip install slotkeeper", "slotkeeper init"]`.
starter: |
  def quickstart_commands(readme: str) -> list[str]:
      ...
visibleTests: |
  def test_commands_without_comments_or_prompts():
      readme = "\n".join([
          "## Quickstart",
          "```bash",
          "# install",
          "$ pip install slotkeeper",
          "slotkeeper init",
          "```",
      ])
      assert quickstart_commands(readme) == ["pip install slotkeeper", "slotkeeper init"]

  def test_no_quickstart_returns_empty_list():
      assert quickstart_commands("## Overview\n```bash\necho hi\n```\n") == []
hiddenTests: |
  def block(*lines):
      return "\n".join(["```bash", *lines, "```"])

  def test_blank_lines_are_skipped():
      readme = "## Quickstart\n" + block("make setup", "", "make run")
      assert quickstart_commands(readme) == ["make setup", "make run"]

  def test_only_the_first_block_counts():
      readme = "## Quickstart\n" + block("make setup") + "\nText.\n" + block("make other")
      assert quickstart_commands(readme) == ["make setup"]

  def test_blocks_in_other_sections_are_ignored():
      readme = "\n".join([
          "## Overview",
          block("not this"),
          "## Quickstart",
          block("make setup"),
          "## Usage",
          block("not this either"),
      ])
      assert quickstart_commands(readme) == ["make setup"]

  def test_block_after_the_next_section_starts_is_ignored():
      readme = "## Quickstart\nSee below.\n## Usage\n" + block("make run")
      assert quickstart_commands(readme) == []

  def test_quickstart_without_a_block():
      assert quickstart_commands("## Quickstart\nJust run it.\n") == []

  def test_empty_readme():
      assert quickstart_commands("") == []

  def test_surrounding_spaces_are_removed():
      readme = "## Quickstart\n" + block("   make setup   ", "  $ make run")
      assert quickstart_commands(readme) == ["make setup", "make run"]

  def test_indented_comment_is_skipped():
      readme = "## Quickstart\n" + block("  # install", "make setup")
      assert quickstart_commands(readme) == ["make setup"]

  def test_only_a_leading_prompt_is_removed():
      readme = "## Quickstart\n" + block("echo $ HOME")
      assert quickstart_commands(readme) == ["echo $ HOME"]

  def test_language_tag_on_the_fence_is_not_a_command():
      readme = "## Quickstart\n```sh\nmake setup\n```\n"
      assert quickstart_commands(readme) == ["make setup"]
