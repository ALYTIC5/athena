  - 'You need to know two things as you read line by line: whether you are under the Quickstart heading, and whether you are inside a code block. How could you remember each?'
  - 'Use two flags. A line starting with `## ` sets the section flag to whether it is the Quickstart heading. The first fence line in the section turns the block flag on. Inside the block, skip blank and `#` lines, remove a leading `$ `, collect the rest, and return when the closing fence appears.'
