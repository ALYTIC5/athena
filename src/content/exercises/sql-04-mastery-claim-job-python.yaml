  - label: Runs the statement without a transaction block
    code: |
      def claim_job(conn, now):
          query = (
              "UPDATE jobs SET status = 'running', attempts = attempts + 1 WHERE id = ("
              "SELECT id FROM jobs WHERE status = 'queued' AND run_after <= %s "
              "ORDER BY run_after, id LIMIT 1 FOR UPDATE SKIP LOCKED) RETURNING id, event_id"
          )
          return conn.execute(query, (now,)).fetchone()
  - label: Catches every error and returns None, so a failed claim looks like an empty queue
    code: |
      def claim_job(conn, now):
          query = (
              "UPDATE jobs SET status = 'running', attempts = attempts + 1 WHERE id = ("
              "SELECT id FROM jobs WHERE status = 'queued' AND run_after <= %s "
              "ORDER BY run_after, id LIMIT 1 FOR UPDATE SKIP LOCKED) RETURNING id, event_id"
          )
          try:
              with conn.transaction():
                  return conn.execute(query, (now,)).fetchone()
          except Exception:
              return None
  - label: Locks the row but forgets SKIP LOCKED
    code: |
      def claim_job(conn, now):
          query = (
              "UPDATE jobs SET status = 'running', attempts = attempts + 1 WHERE id = ("
              "SELECT id FROM jobs WHERE status = 'queued' AND run_after <= %s "
              "ORDER BY run_after, id LIMIT 1 FOR UPDATE) RETURNING id, event_id"
          )
          with conn.transaction():
              return conn.execute(query, (now,)).fetchone()
explanation: |
  The claim is one `UPDATE ... RETURNING` with `FOR UPDATE SKIP LOCKED`, so two workers never take the same job. `with conn.transaction():` makes psycopg commit when the block ends normally and roll back if an exception leaves it, so a half-finished claim never stays. The exception must be allowed to reach the caller: catching it and returning `None` makes a database failure look like an empty queue, and the worker would sit idle without noticing. The time goes in as a `%s` parameter, never into the text. Alternative: open the connection with `autocommit=True` and let the single statement be its own transaction; that is fine for a one-statement claim, but `conn.transaction()` keeps working when you later add a second statement.
