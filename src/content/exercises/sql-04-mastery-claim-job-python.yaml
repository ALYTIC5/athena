title: Claim a job from Python inside a transaction
difficulty: 4
competencies:
  - sql.parameters
  - sql.transactions
  - sql.locking-queues
timeoutMs: 5000
estMin: 8
packages: []
prompt: |
  A worker claims one job with psycopg 3. The page gives you a stand-in connection with the same two calls the real one has: `conn.transaction()` (a context manager that commits when the block ends and rolls back if an error leaves it) and `conn.execute(query, params)`, whose cursor has `fetchone()`.

  Write `claim_job(conn, now)`. Run the claim inside `with conn.transaction():`. The statement must be one `UPDATE` that selects the next due job with `FOR UPDATE SKIP LOCKED` and returns `id` and `event_id`. The time `now` comes from the caller, so pass it as a `%s` parameter, not into the SQL text. Return the claimed row, or `None` when nothing is due. If the database raises an error, let it reach the caller.
starter: |
  def claim_job(conn, now):
      ...
visibleTests: |
  class FakeTx:
      def __init__(self, events):
          self.events = events

      def __enter__(self):
          self.events.append("begin")
          return self

      def __exit__(self, exc_type, exc, tb):
          self.events.append("rollback" if exc_type else "commit")
          return False


  class FakeCursor:
      def __init__(self, row):
          self._row = row

      def fetchone(self):
          return self._row


  class FakeConn:
      """Stands in for psycopg.Connection: records events, transactions and execute calls."""

      def __init__(self, row=None, error=None):
          self.row = row
          self.error = error
          self.events = []
          self.calls = []

      def transaction(self):
          return FakeTx(self.events)

      def execute(self, query, params=None):
          self.events.append("execute")
          self.calls.append((query, params))
          if self.error is not None:
              raise self.error
          return FakeCursor(self.row)


  def test_returns_the_claimed_row():
      conn = FakeConn(row=(3, "evt-1003"))
      assert claim_job(conn, "2026-11-02 09:00") == (3, "evt-1003")


  def test_returns_none_when_nothing_is_due():
      assert claim_job(FakeConn(row=None), "2026-11-02 09:00") is None
hiddenTests: |
  class FakeTx:
      def __init__(self, events):
          self.events = events

      def __enter__(self):
          self.events.append("begin")
          return self

      def __exit__(self, exc_type, exc, tb):
          self.events.append("rollback" if exc_type else "commit")
          return False


  class FakeCursor:
      def __init__(self, row):
          self._row = row

      def fetchone(self):
          return self._row


  class FakeConn:
      """Stands in for psycopg.Connection: records events, transactions and execute calls."""

      def __init__(self, row=None, error=None):
          self.row = row
          self.error = error
          self.events = []
          self.calls = []

      def transaction(self):
          return FakeTx(self.events)

      def execute(self, query, params=None):
          self.events.append("execute")
          self.calls.append((query, params))
          if self.error is not None:
              raise self.error
          return FakeCursor(self.row)


  def test_the_claim_runs_inside_a_transaction():
      conn = FakeConn(row=(1, "evt-1"))
      claim_job(conn, "2026-11-02 09:00")
      assert conn.events == ["begin", "execute", "commit"]


  def test_an_error_rolls_back_and_reaches_the_caller():
      conn = FakeConn(error=RuntimeError("connection lost"))
      try:
          claim_job(conn, "2026-11-02 09:00")
      except RuntimeError:
          pass
      else:
          raise AssertionError("the error was swallowed")
      assert conn.events == ["begin", "execute", "rollback"]


  def test_the_statement_locks_and_skips():
      conn = FakeConn(row=None)
      claim_job(conn, "2026-11-02 09:00")
      query = " ".join(conn.calls[0][0].upper().split())
      assert query.startswith("UPDATE")
      assert "FOR UPDATE SKIP LOCKED" in query
      assert "RETURNING" in query


  def test_the_time_is_a_parameter():
      conn = FakeConn(row=None)
      hostile = "2026-11-02' OR '1'='1"
      claim_job(conn, hostile)
      query, params = conn.calls[0]
      assert hostile not in query
      assert query.count("%s") == 1
      assert tuple(params) == (hostile,)


  def test_one_statement_is_sent():
      conn = FakeConn(row=None)
      claim_job(conn, "2026-11-02 09:00")
      assert len(conn.calls) == 1
feedback:
  - test: test_the_claim_runs_inside_a_transaction
    message: Wrap the execute call in `with conn.transaction():` so the claim commits or rolls back as one unit.
  - test: test_an_error_rolls_back_and_reaches_the_caller
    message: Do not catch the error. Leaving the with block through an exception is what triggers the rollback, and the caller needs to know.
  - test: test_the_statement_locks_and_skips
    message: The claim must be a single UPDATE with FOR UPDATE SKIP LOCKED in its subquery, and RETURNING.
  - test: test_the_time_is_a_parameter
    message: Put %s where the time goes and pass (now,) as the second argument of execute.
hints:
