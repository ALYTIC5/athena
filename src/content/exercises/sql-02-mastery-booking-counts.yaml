id: sql-02-mastery-booking-counts
lesson: sql-02
runtime: sql
kind: make
pools:
  - mastery
title: 'Every customer with a booking count, including zero'
difficulty: 3
competencies:
  - sql.joins
  - sql.aggregation
timeoutMs: 5000
estMin: 2
extensions: []
schema: |
  CREATE TABLE customers (
    id integer PRIMARY KEY,
    name text NOT NULL
  );
  CREATE TABLE bookings (
    id integer PRIMARY KEY,
    customer_id integer NOT NULL REFERENCES customers(id),
    starts timestamp NOT NULL,
    ends timestamp NOT NULL
  );
  CREATE TABLE calls (
    id integer PRIMARY KEY,
    customer_id integer REFERENCES customers(id),
    duration_s integer,
    reason text
  );
  INSERT INTO customers VALUES
    (1, 'Amara Okafor'),
    (2, 'Jonas Weber'),
    (3, 'Mei Tanaka'),
    (4, 'Sofia Reyes'),
    (5, 'Tomas Novak');
  INSERT INTO bookings VALUES
    (10, 1, '2026-11-02 09:00', '2026-11-02 10:00'),
    (11, 1, '2026-11-02 09:30', '2026-11-02 10:30'),
    (12, 1, '2026-11-09 09:00', '2026-11-09 10:00'),
    (13, 3, '2026-11-03 14:00', '2026-11-03 15:00'),
    (14, 3, '2026-11-03 15:00', '2026-11-03 16:00'),
    (15, 2, '2026-11-02 09:15', '2026-11-02 09:45');
  INSERT INTO calls VALUES
    (1, 1, 120, 'booking'),
    (2, 1, 45, 'billing'),
    (3, 2, 300, 'cancel'),
    (4, 3, NULL, 'booking'),
    (5, 3, 200, 'booking'),
    (6, NULL, 60, NULL),
    (7, 4, 400, 'billing'),
    (8, 4, 20, 'booking');
prompt: |
  Three tables: `customers` (`id`, `name`), `bookings` (`id`, `customer_id`, `starts`, `ends`) and `calls` (`id`, `customer_id` which is NULL when the caller is unknown, `duration_s` which is NULL for an unanswered call, and `reason`). Each booking and each call belongs to at most one customer.

  Select every customer's `name` and the number of their bookings as `bookings`, including customers who have none (their count is 0), in `name` order.
starter: |
  SELECT ...
referenceSolution: |
  SELECT c.name, COUNT(b.id) AS bookings FROM customers c LEFT JOIN bookings b ON b.customer_id = c.id GROUP BY c.id, c.name ORDER BY c.name;
compare:
  orderMatters: true
checks: []
wrongSolutions:
  - label: 'Uses COUNT(*), which counts the NULL-filled row of a customer without bookings as 1'
    code: |
      SELECT c.name, COUNT(*) AS bookings FROM customers c LEFT JOIN bookings b ON b.customer_id = c.id GROUP BY c.id, c.name ORDER BY c.name;
  - label: 'Uses an inner join, which drops the customers who have no bookings'
    code: |
      SELECT c.name, COUNT(b.id) AS bookings FROM customers c JOIN bookings b ON b.customer_id = c.id GROUP BY c.id, c.name ORDER BY c.name;
  - label: 'Counts the customer id, which is never NULL, so a customer without bookings still shows 1'
    code: |
      SELECT c.name, COUNT(c.id) AS bookings FROM customers c LEFT JOIN bookings b ON b.customer_id = c.id GROUP BY c.id, c.name ORDER BY c.name;
hints:
  - 'Which join keeps the customers with no bookings, and what does COUNT do with NULL values?'
  - 'Use a LEFT JOIN from customers. Then count a column of the bookings table, because COUNT(column) skips NULLs and COUNT(*) does not.'
  - 'SELECT c.name, COUNT(____) AS bookings FROM customers c ____ JOIN bookings b ON b.customer_id = c.id GROUP BY c.id, c.name ORDER BY c.name;'
explanation: |
  A left join gives a customer without bookings one row in which every booking column is NULL. `COUNT(*)` counts rows, so it would say 1. `COUNT(b.id)` counts only non-NULL values of the booking id, so it says 0. This is one of the most common aggregation mistakes: the join must keep the customer, and the count must look at the other table's column. Alternative: a correlated subquery, `(SELECT COUNT(*) FROM bookings b WHERE b.customer_id = c.id)` in the SELECT list, gives the same numbers without a join or a GROUP BY.
