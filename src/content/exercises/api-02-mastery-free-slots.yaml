explanation: |
  The function does three things that every external call needs: it passes a timeout so a slow service cannot hang your code, it turns an error status into an exception with `raise_for_status()` so a failure is not mistaken for data, and it decides explicitly which status is an expected answer (404 here means "no such calendar", so an empty list). Letting `TimeoutError` and the status error propagate leaves the caller, usually a route, to choose the response, for example 504 for a timeout.

  With the real client the code is the same, except `client` is an `httpx.AsyncClient`, the timeout can be an `httpx.Timeout(...)` object, and the errors are `httpx.TimeoutException` and `httpx.HTTPStatusError`. An alternative is to check `response.is_success` yourself, but `raise_for_status()` is the idiom and its exception carries the response for logging.
