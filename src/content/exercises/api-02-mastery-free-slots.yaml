referenceSolution: |
  import asyncio


  async def free_slots(client, calendar_id: str, timeout: float = 5.0) -> list:
      response = await client.get(f"/calendars/{calendar_id}/slots", timeout=timeout)
      if response.status_code == 404:
          return []
      response.raise_for_status()
      return response.json()["slots"]
