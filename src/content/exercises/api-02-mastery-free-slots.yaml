visibleTests: |
  import asyncio


  # Page helper: runs a coroutine on a small event loop with a virtual clock, so the tests are
  # instant and the elapsed time is exact. You do not need to read it.
  class _Selector:
      def __init__(self, loop):
          self.loop = loop

      def select(self, timeout=None):
          if timeout:
              self.loop._now += timeout
          return []

      def close(self):
          pass


  class _VirtualLoop(asyncio.BaseEventLoop):
      def __init__(self):
          super().__init__()
          self._now = 0.0
          self._selector = _Selector(self)

      def time(self):
          return self._now

      def _process_events(self, events):
          pass

      def _write_to_self(self):
          pass


  def run(coro):
      outer = asyncio.events._get_running_loop()
      asyncio.events._set_running_loop(None)
      loop = _VirtualLoop()
      try:
          return loop.run_until_complete(coro)
      finally:
          pending = asyncio.all_tasks(loop)
          for task in pending:
              task.cancel()
          if pending:
              loop.run_until_complete(asyncio.gather(*pending, return_exceptions=True))
          loop.close()
          asyncio.events._set_running_loop(outer)


  class StatusError(Exception):
      pass


  class FakeResponse:
      def __init__(self, status_code, data):
          self.status_code = status_code
          self._data = data

      def json(self):
          return self._data

      def raise_for_status(self):
          if self.status_code >= 400:
              raise StatusError(self.status_code)


  class FakeClient:
      """Answers like httpx: sleeps for `delay`, and raises TimeoutError if that is longer than the timeout."""

      def __init__(self, status_code=200, data=None, delay=0.1):
          self.response = FakeResponse(status_code, {"slots": ["09:00", "10:30"]} if data is None else data)
          self.delay = delay
          self.calls = []

      async def get(self, url, timeout=None):
          self.calls.append((url, timeout))
          await asyncio.sleep(min(self.delay, timeout) if timeout is not None else self.delay)
          if timeout is not None and self.delay > timeout:
              raise TimeoutError("read timed out")
          return self.response


  def test_returns_the_slots():
      client = FakeClient()
      assert run(free_slots(client, "c-4")) == ["09:00", "10:30"]
      assert client.calls[0][0] == "/calendars/c-4/slots"

  def test_a_missing_calendar_gives_an_empty_list():
      assert run(free_slots(FakeClient(404, {"detail": "no such calendar"}), "c-9")) == []

  def test_a_server_error_is_raised():
      try:
          run(free_slots(FakeClient(503, {"detail": "down"}), "c-4"))
      except StatusError:
          return
      raise AssertionError("a 503 should raise the error from raise_for_status()")
hiddenTests: |
  def caught(coro):
      try:
          run(coro)
      except BaseException as error:
          return error
      return None


  def test_the_default_timeout_is_five_seconds():
      client = FakeClient()
      run(free_slots(client, "c-4"))
      assert client.calls == [("/calendars/c-4/slots", 5.0)]

  def test_a_custom_timeout_is_passed_on():
      client = FakeClient()
      run(free_slots(client, "c-4", timeout=1.5))
      assert client.calls[0][1] == 1.5

  def test_a_slow_service_raises_timeout_error():
      error = caught(free_slots(FakeClient(delay=8), "c-4"))
      assert isinstance(error, TimeoutError), f"expected TimeoutError, got {error!r}"

  def test_a_slow_service_is_fine_with_a_longer_timeout():
      assert run(free_slots(FakeClient(delay=8), "c-4", timeout=10)) == ["09:00", "10:30"]

  def test_other_client_errors_are_raised_not_hidden():
      for status in (400, 401, 403, 429, 500):
          error = caught(free_slots(FakeClient(status, {"detail": "no"}), "c-4"))
          assert isinstance(error, StatusError), f"status {status} should raise, got {error!r}"

  def test_an_empty_list_of_slots_is_a_valid_answer():
      assert run(free_slots(FakeClient(200, {"slots": []}), "c-4")) == []

  def test_a_success_status_other_than_200_is_not_an_error():
      assert run(free_slots(FakeClient(201, {"slots": ["11:00"]}), "c-4")) == ["11:00"]
