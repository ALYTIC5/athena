title: Fetch free slots from a calendar service with a timeout
difficulty: 3
competencies:
  - api.client
  - py.async
timeoutMs: 5000
estMin: 15
packages: []
prompt: |
  A calendar service lists free appointment slots. Write `free_slots(client, calendar_id, timeout=5.0)`, a coroutine that uses an httpx-style client.

  - Call `await client.get(f"/calendars/{calendar_id}/slots", timeout=timeout)`. Always pass the timeout as the `timeout=` keyword, so a stalled server cannot hold your code forever.
  - The response has `.status_code`, `.json()` and `.raise_for_status()`. Like httpx, `raise_for_status()` raises an exception for any 4xx or 5xx status.
  - If the status is **404**, the calendar does not exist: return `[]`.
  - For any other error status, let `response.raise_for_status()` raise, and do not catch it.
  - If the status is a success, return `response.json()["slots"]`.
  - If the client raises `TimeoutError` because the service was too slow, let it reach the caller. Do not catch it. (The real httpx client raises `httpx.TimeoutException`, not the built-in `TimeoutError`; the fake raises the built-in one so the tests need no package.)

  The tests use a fake client with a virtual clock, so no network is used and nothing really waits.
