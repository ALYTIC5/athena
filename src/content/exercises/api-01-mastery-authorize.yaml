referenceSolution: |
  def authorize(headers: dict[str, str], keys: dict[str, dict], required_scope: str) -> int:
      value = ""
      for name, header_value in headers.items():
          if name.lower() == "authorization":
              value = header_value
      scheme, _, token = value.partition(" ")
      if scheme.lower() != "bearer" or token not in keys:
          return 401
      if required_scope not in keys[token]["scopes"]:
          return 403
      return 200
wrongSolutions:
  - label: Answers 403 when there are no credentials
    code: |
      def authorize(headers: dict[str, str], keys: dict[str, dict], required_scope: str) -> int:
          value = next((v for name, v in headers.items() if name.lower() == "authorization"), "")
          scheme, _, token = value.partition(" ")
          if scheme.lower() != "bearer" or token not in keys:
              return 403
          if required_scope not in keys[token]["scopes"]:
              return 403
          return 200
  - label: Looks for the exact header name Authorization
    code: |
      def authorize(headers: dict[str, str], keys: dict[str, dict], required_scope: str) -> int:
          value = headers.get("Authorization", "")
          scheme, _, token = value.partition(" ")
          if scheme.lower() != "bearer" or token not in keys:
              return 401
          if required_scope not in keys[token]["scopes"]:
              return 403
          return 200
  - label: Checks the key but never the scope
    code: |
      def authorize(headers: dict[str, str], keys: dict[str, dict], required_scope: str) -> int:
          value = next((v for name, v in headers.items() if name.lower() == "authorization"), "")
          scheme, _, token = value.partition(" ")
          if scheme.lower() != "bearer" or token not in keys:
              return 401
          return 200
  - label: Takes the last word of the header, whatever the scheme
    code: |
      def authorize(headers: dict[str, str], keys: dict[str, dict], required_scope: str) -> int:
          value = next((v for name, v in headers.items() if name.lower() == "authorization"), "")
          token = value.split(" ")[-1]
          if token not in keys:
              return 401
          if required_scope not in keys[token]["scopes"]:
              return 403
          return 200
  - label: Cuts the token at a fixed position without checking the scheme
    code: |
      def authorize(headers: dict[str, str], keys: dict[str, dict], required_scope: str) -> int:
          value = ""
          for name, header_value in headers.items():
              if name.lower() == "authorization":
                  value = header_value
          token = value[7:]
          if token not in keys:
              return 401
          if required_scope not in keys[token]["scopes"]:
              return 403
          return 200
  - label: Lower-cases the whole header, so tokens match in any case
    code: |
      def authorize(headers: dict[str, str], keys: dict[str, dict], required_scope: str) -> int:
          value = next((v for name, v in headers.items() if name.lower() == "authorization"), "").lower()
          scheme, _, token = value.partition(" ")
          lowered = {key.lower(): info for key, info in keys.items()}
          if scheme != "bearer" or token not in lowered:
              return 401
          if required_scope not in lowered[token]["scopes"]:
              return 403
          return 200
explanation: |
  Authentication comes before authorisation. First work out who is calling: if there is no usable `Bearer` credential, or the token is not one you issued, the answer is 401, because the server does not know the caller. Only then ask whether this caller may do this: a known caller without the scope gets 403. Header names are case-insensitive and the scheme word is too, but the token is a secret string and must match exactly. `partition(" ")` splits at the first space and leaves an empty token when there is none, so `Bearer` alone is rejected without extra code. Alternative: build a lower-cased copy of the headers, `{k.lower(): v for k, v in headers.items()}`, and read `["authorization"]` from it. That is shorter when you need several headers, but copies the dict on every request. A real server also compares secrets in constant time, which a later lesson covers.
