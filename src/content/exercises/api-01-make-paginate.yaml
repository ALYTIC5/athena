explanation: |
  The cursor is a position in id order, not a place in the list. Sorting a copy by id, keeping the ids greater than the cursor and cutting off `limit` items gives the page, and the client sends the last id back to continue. The page is the last one when nothing is left after it, so `next_cursor` is set only when `len(ordered) > limit`. Because the comparison uses ids, it keeps working when the cursor item has been deleted or new items arrive earlier in the list, which is exactly where offset pagination repeats or skips rows. `sorted` builds a new list, so the caller's list stays unchanged. Alternative: offset pagination is `ordered[offset:offset + limit]`. It is simpler and lets a client jump to page 40, but pages shift when rows are inserted or deleted, and a database must still read past all the skipped rows. In a real API the cursor is usually encoded so that clients treat it as opaque, and for a database table the filter becomes a query with `WHERE id > cursor ORDER BY id LIMIT limit`.
