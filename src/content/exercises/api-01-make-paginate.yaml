  - label: Looks the cursor up in the list, so a deleted cursor item raises an error
    code: |
      def paginate(items: list[dict], limit: int, cursor: str | None = None) -> dict:
          if not 1 <= limit <= 100:
              raise ValueError("limit must be from 1 to 100")
          ordered = sorted(items, key=lambda item: item["id"])
          ids = [item["id"] for item in ordered]
          start = 0 if cursor is None else ids.index(cursor) + 1
          page = ordered[start:start + limit]
          more = start + limit < len(ordered)
          return {"items": page, "next_cursor": page[-1]["id"] if more else None}
  - label: Sorts the caller's list in place
    code: |
      def paginate(items: list[dict], limit: int, cursor: str | None = None) -> dict:
          if not 1 <= limit <= 100:
              raise ValueError("limit must be from 1 to 100")
          items.sort(key=lambda item: item["id"])
          if cursor is not None:
              rest = [item for item in items if item["id"] > cursor]
          else:
              rest = items
          page = rest[:limit]
          more = len(rest) > limit
          return {"items": page, "next_cursor": page[-1]["id"] if more else None}
  - label: Includes the cursor item again (greater than or equal)
