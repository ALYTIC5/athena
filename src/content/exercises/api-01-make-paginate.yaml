packages: []
prompt: |
  Write `paginate(items, limit, cursor=None)`, the helper behind `GET /bookings?limit=2&cursor=b-002`.

  - `items` is a list of dicts, each with a string `"id"` such as `"b-003"`. The ids are unique and sort correctly as text. The list is **not** guaranteed to be in order.
  - Pages go in ascending order of `"id"`.
  - `cursor` is the `"id"` of the last item on the previous page, or `None` for the first page. A page holds the items whose `"id"` is **greater than** the cursor.
  - Return a dict `{"items": [...], "next_cursor": ...}`. `items` has at most `limit` entries. `next_cursor` is the `"id"` of the last returned item **if more items follow it**, and `None` on the last page.
  - `limit` must be an integer from 1 to 100. Otherwise raise `ValueError`.
  - Do not change the list you were given.

  The cursor item may have been deleted since the last request, so do not look it up in the list.

  Example: for ids `b-001` to `b-005` and `limit=2`, the first call returns `b-001`, `b-002` and `next_cursor` `"b-002"`. Calling again with that cursor returns `b-003`, `b-004` and `"b-004"`, and then the last call returns `b-005` and `None`.
starter: |
