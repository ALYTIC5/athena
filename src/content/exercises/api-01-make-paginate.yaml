visibleTests: |
  BOOKINGS = [{"id": f"b-{n:03d}", "customer": f"customer {n}"} for n in range(1, 6)]


  def ids(page):
      return [item["id"] for item in page["items"]]


  def test_first_page():
      page = paginate(BOOKINGS, 2)
      assert ids(page) == ["b-001", "b-002"]
      assert page["next_cursor"] == "b-002"

  def test_second_page_uses_the_cursor():
      page = paginate(BOOKINGS, 2, "b-002")
      assert ids(page) == ["b-003", "b-004"]
      assert page["next_cursor"] == "b-004"

  def test_last_page_has_no_next_cursor():
      page = paginate(BOOKINGS, 2, "b-004")
      assert ids(page) == ["b-005"]
      assert page["next_cursor"] is None
hiddenTests: |
  BOOKINGS = [{"id": f"b-{n:03d}", "customer": f"customer {n}"} for n in range(1, 6)]


  def ids(page):
      return [item["id"] for item in page["items"]]


  def test_a_page_that_ends_exactly_at_the_end_has_no_next_cursor():
      page = paginate(BOOKINGS, 5)
      assert ids(page) == ["b-001", "b-002", "b-003", "b-004", "b-005"]
      assert page["next_cursor"] is None

  def test_exact_multiple_of_the_limit_ends_cleanly():
      page = paginate(BOOKINGS[:4], 2, "b-002")
      assert ids(page) == ["b-003", "b-004"]
      assert page["next_cursor"] is None

  def test_limit_larger_than_what_is_left():
      page = paginate(BOOKINGS, 100, "b-003")
      assert ids(page) == ["b-004", "b-005"]
      assert page["next_cursor"] is None

  def test_empty_list():
      assert paginate([], 3) == {"items": [], "next_cursor": None}

  def test_cursor_after_the_last_item():
      assert paginate(BOOKINGS, 2, "b-005") == {"items": [], "next_cursor": None}

  def test_unsorted_input_is_returned_in_id_order():
      shuffled = [BOOKINGS[3], BOOKINGS[0], BOOKINGS[4], BOOKINGS[2], BOOKINGS[1]]
      page = paginate(shuffled, 3)
      assert ids(page) == ["b-001", "b-002", "b-003"]
      assert page["next_cursor"] == "b-003"

  def test_the_input_list_is_not_changed():
      shuffled = [BOOKINGS[3], BOOKINGS[0], BOOKINGS[2]]
      before = list(shuffled)
      paginate(shuffled, 2)
      assert shuffled == before

  def test_a_deleted_cursor_item_still_works():
      remaining = [b for b in BOOKINGS if b["id"] != "b-002"]
      page = paginate(remaining, 2, "b-002")
      assert ids(page) == ["b-003", "b-004"]
      assert page["next_cursor"] == "b-004"

  def test_items_are_returned_whole():
      page = paginate(BOOKINGS, 1)
      assert page["items"] == [{"id": "b-001", "customer": "customer 1"}]

  def test_following_the_cursors_visits_every_item_once():
      seen = []
      cursor = None
      for _ in range(10):
          page = paginate(BOOKINGS, 2, cursor)
          seen.extend(ids(page))
          cursor = page["next_cursor"]
          if cursor is None:
              break
      assert seen == ["b-001", "b-002", "b-003", "b-004", "b-005"]

  def test_bad_limits_raise_value_error():
      for bad in (0, -1, 101):
          try:
              paginate(BOOKINGS, bad)
          except ValueError:
              continue
          raise AssertionError(f"limit {bad} should raise ValueError")

  def test_non_integer_limits_raise_value_error():
      for bad in (2.5, "3", None):
          try:
              paginate(BOOKINGS, bad)
          except ValueError:
              continue
          raise AssertionError(f"limit {bad!r} should raise ValueError")

  def test_the_limits_one_and_one_hundred_are_allowed():
      assert ids(paginate(BOOKINGS, 1)) == ["b-001"]
      assert len(paginate(BOOKINGS, 100)["items"]) == 5
