referenceSolution: |
  def reschedule(bookings: list[dict], booking_id: str, new_slot: str) -> list[dict]:
      result = []
      found = False
      for booking in bookings:
          if booking["id"] == booking_id:
              result.append({**booking, "slot": new_slot})
              found = True
          else:
              result.append(booking)
      if not found:
          raise KeyError(booking_id)
      return result
wrongSolutions:
  - label: Mutates the original booking dict
    code: |
      def reschedule(bookings: list[dict], booking_id: str, new_slot: str) -> list[dict]:
          result = list(bookings)
          for booking in result:
              if booking["id"] == booking_id:
                  booking["slot"] = new_slot
                  return result
          raise KeyError(booking_id)
  - label: Returns the input list itself, edited in place
    code: |
      def reschedule(bookings: list[dict], booking_id: str, new_slot: str) -> list[dict]:
          for index, booking in enumerate(bookings):
              if booking["id"] == booking_id:
                  bookings[index] = {**booking, "slot": new_slot}
                  return bookings
          raise KeyError(booking_id)
  - label: Returns quietly when the id is unknown
    code: |
      def reschedule(bookings: list[dict], booking_id: str, new_slot: str) -> list[dict]:
          return [
              {**booking, "slot": new_slot} if booking["id"] == booking_id else booking
              for booking in bookings
          ]
explanation: |
  The function builds a new list. For the booking it moves it builds a new dict with `{**booking, "slot": new_slot}`, so
  the dict the caller holds is never touched. The other bookings are shared with the original list, which is fine because
  nothing changes them. Cost: one pass, O(n) time and O(n) extra space. Alternative: copy every dict
  (`[dict(b) for b in bookings]`) and then edit the copy, which is safer if later code might mutate the shared dicts but
  does more work. A `KeyError` is the usual signal for a missing key or id.
