id: py-01-make-reschedule
lesson: py-01
runtime: python
kind: make
pools:
  - lesson
title: Reschedule a booking without changing the original list
difficulty: 2
competencies:
  - py.mutability
  - py.functions
  - py.values-names
timeoutMs: 5000
packages: []
prompt: |
  A booking is a dict such as `{"id": "b1", "name": "Amara", "slot": "09:00"}`. Ids are unique.

  Write `reschedule(bookings, booking_id, new_slot)`. It returns a **new list** in which the booking with `booking_id` has `new_slot` as its slot. Every other booking stays as it was. The list you were given, and the dicts in it, must not change.

  If no booking has that id, signal it by raising `KeyError` with the id: `raise KeyError(booking_id)`. Errors get their own lesson later; that one line is all you need here.

  Example: moving `"b1"` to `"11:00"` in `[{"id": "b1", "name": "Amara", "slot": "09:00"}]` returns `[{"id": "b1", "name": "Amara", "slot": "11:00"}]`, and the original still says `"09:00"`.
starter: |
  def reschedule(bookings: list[dict], booking_id: str, new_slot: str) -> list[dict]:
      ...
visibleTests: |
  def test_moves_the_booking():
      bookings = [
          {"id": "b1", "name": "Amara", "slot": "09:00"},
          {"id": "b2", "name": "Jonas", "slot": "10:00"},
      ]
      result = reschedule(bookings, "b1", "11:00")
      assert result == [
          {"id": "b1", "name": "Amara", "slot": "11:00"},
          {"id": "b2", "name": "Jonas", "slot": "10:00"},
      ]

  def test_input_list_is_unchanged():
      bookings = [{"id": "b1", "name": "Amara", "slot": "09:00"}]
      reschedule(bookings, "b1", "11:00")
      assert bookings == [{"id": "b1", "name": "Amara", "slot": "09:00"}]
hiddenTests: |
  def test_returns_a_new_list():
      bookings = [{"id": "b1", "name": "Amara", "slot": "09:00"}]
      assert reschedule(bookings, "b1", "11:00") is not bookings

  def test_original_dict_is_not_changed():
      original = {"id": "b1", "name": "Amara", "slot": "09:00"}
      bookings = [original]
      reschedule(bookings, "b1", "11:00")
      assert original["slot"] == "09:00"

  def test_unknown_id_raises_key_error():
      bookings = [{"id": "b1", "name": "Amara", "slot": "09:00"}]
      try:
          reschedule(bookings, "nope", "11:00")
      except KeyError as error:
          assert error.args == ("nope",)
      else:
          raise AssertionError("expected KeyError")

  def test_empty_list_raises_key_error():
      try:
          reschedule([], "b1", "11:00")
      except KeyError:
          pass
      else:
          raise AssertionError("expected KeyError")

  def test_order_is_kept():
      bookings = [
          {"id": "b1", "name": "A", "slot": "09:00"},
          {"id": "b2", "name": "B", "slot": "10:00"},
          {"id": "b3", "name": "C", "slot": "11:00"},
      ]
      result = reschedule(bookings, "b2", "12:00")
      assert [b["id"] for b in result] == ["b1", "b2", "b3"]
      assert result[1]["slot"] == "12:00"
feedback:
  - test: test_input_list_is_unchanged
    message: 'The list you were given, or a dict inside it, changed. Build a new list, and build a new dict for the booking you move, for example `{**booking, "slot": new_slot}`.'
  - test: test_original_dict_is_not_changed
    message: 'You changed a dict that the caller still holds. Build a new dict for the booking you move, for example `{**booking, "slot": new_slot}`.'
  - test: test_unknown_id_raises_key_error
    message: When no booking has the id, raise KeyError(booking_id) instead of returning quietly.
  - test: test_moves_the_booking
    message: The booking with that id should get the new slot, and every other booking should stay exactly as it was.
  - test: test_returns_a_new_list
    message: Return a new list, not the list you were given.
  - test: test_empty_list_raises_key_error
    message: 'An empty list has no booking with that id, so this is also a missing id: raise KeyError.'
  - test: test_order_is_kept
    message: Keep the bookings in their original order; only the slot of one booking changes.
