id: py-02-debug-slow-duplicates
lesson: py-02
runtime: python
kind: debug
pools:
  - lesson
title: A duplicate check that gets slow on a busy day
difficulty: 3
competencies:
  - py.complexity
  - py.collections
timeoutMs: 8000
packages: []
prompt: |
  `has_duplicates(items)` says whether any value appears twice in a list of hashable values, such as the caller ids from one day. It returns the right answer, but on a busy day it takes far too long. The failing test does not measure time. It counts how many times Python has to compare two items with `==`, using a special item type, so the result is the same on every computer.
  Find the line that makes the work grow too fast and fix it. The function must still return `True` or `False` and must not change the list.
starter: |
  def has_duplicates(items):
      seen = []
      for item in items:
          if item in seen:
              return True
          seen.append(item)
      return False
visibleTests: |
  class Tracked:
      comparisons = 0

      def __init__(self, value):
          self.value = value

      def __hash__(self):
          return hash(self.value)

      def __eq__(self, other):
          Tracked.comparisons += 1
          return self.value == other.value


  def test_finds_a_duplicate():
      assert has_duplicates(["amara", "bayu", "amara"]) is True

  def test_no_duplicate():
      assert has_duplicates(["amara", "bayu", "chen"]) is False

  def test_work_does_not_grow_with_every_pair():
      items = [Tracked(n) for n in range(800)]
      Tracked.comparisons = 0
      assert has_duplicates(items) is False
      assert Tracked.comparisons < 10 * len(items)
hiddenTests: |
  class Tracked:
      comparisons = 0

      def __init__(self, value):
          self.value = value

      def __hash__(self):
          return hash(self.value)

      def __eq__(self, other):
          Tracked.comparisons += 1
          return self.value == other.value


  def test_empty_list():
      assert has_duplicates([]) is False

  def test_one_item():
      assert has_duplicates([7]) is False

  def test_duplicate_at_the_end():
      assert has_duplicates(list(range(50)) + [0]) is True

  def test_adjacent_duplicates():
      assert has_duplicates(["a", "a"]) is True

  def test_works_with_tuples():
      assert has_duplicates([(1, "a"), (2, "b"), (1, "a")]) is True

  def test_input_is_not_changed():
      items = [3, 1, 3]
      has_duplicates(items)
      assert items == [3, 1, 3]

  def test_work_stays_small_when_there_is_a_duplicate_late():
      items = [Tracked(n) for n in range(800)] + [Tracked(799)]
      Tracked.comparisons = 0
      assert has_duplicates(items) is True
      assert Tracked.comparisons < 10 * len(items)
feedback:
  - test: test_work_does_not_grow_with_every_pair
    message: Your function compared items far too many times. For each new item it looked through everything seen so far, so the work grows with the square of the list. Use a collection that answers "have I seen this?" without scanning.
  - test: test_work_stays_small_when_there_is_a_duplicate_late
    message: With a duplicate near the end the function still compared too many items. Check how `seen` is searched.
  - test: test_works_with_tuples
    message: Tuples of hashable values are hashable too, so they can go in a set. Check that you did not make the function depend on the type of the items.
  - test: test_input_is_not_changed
    message: The function should only read the list it was given.
hints:
  - Which line runs once per item, and how many items does it have to look at each time?
  - '`item in seen` looks at every earlier item when `seen` is a list. Which collection answers "is it in here?" without looking at each one?'
  - |-
    seen = ____()
    for item in items:
        if item in seen:
            return True
        seen.____(item)
    return False
referenceSolution: |
  def has_duplicates(items):
      seen = set()
      for item in items:
          if item in seen:
              return True
          seen.add(item)
      return False
wrongSolutions:
  - label: Still compares every pair with two nested loops
    code: |
      def has_duplicates(items):
          for i in range(len(items)):
              for j in range(i + 1, len(items)):
                  if items[i] == items[j]:
                      return True
          return False
  - label: Counts each item with list.count, which scans the whole list every time
    code: |
      def has_duplicates(items):
          for item in items:
              if items.count(item) > 1:
                  return True
          return False
  - label: Adds the item before checking, so every list with one item looks like a duplicate
    code: |
      def has_duplicates(items):
          seen = set()
          for item in items:
              seen.add(item)
              if item in seen:
                  return True
          return False
explanation: |
  `item in seen` on a list compares `item` with the stored items one by one, so a list of n items costs about n comparisons per check and about n squared over two for the whole function. A set finds an item by its hash, so a check takes about the same time however many items are stored. The loop then does n cheap checks: linear time, at the cost of memory for the set. Alternative: `len(set(items)) != len(items)` is shorter, but it always builds the whole set, while the loop stops at the first repeat. A third option is to sort the list and compare neighbours, which costs n log n but needs items that can be ordered and needs no extra set.
