      def parse_response(raw: str) -> dict:
          head, _, body = raw.partition("\r\n\r\n")
          lines = head.split("\r\n")
          _version, _, rest = lines[0].partition(" ")
          code, _, reason = rest.partition(" ")
          headers = {}
          for line in lines[1:]:
              name, _, value = line.partition(":")
              headers[name.strip()] = value.strip()
          return {"status": code, "reason": reason, "headers": headers, "body": body}
explanation: |
  A response has the same layout as a request: a first line, header lines, a blank line, then the body. `partition` splits at the first occurrence only, which is exactly the rule for all three splits here: the first blank line ends the headers (the body may contain more), the first colon ends a header name (a value such as a URL may contain more), and the first space after the code starts the reason phrase (which may have several words, or none). The status code is text on the wire, so convert it with `int`. Header names are case-insensitive, so lower-casing them gives one form to look up. Alternative: a regular expression such as `^HTTP/\S+ (\d{3}) ?(.*)$` for the status line is compact, but harder to read and to debug for a small fixed format. In real code you would use an HTTP library, which also handles things this exercise ignores, such as repeated headers and chunked bodies.
