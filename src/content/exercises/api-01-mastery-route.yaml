referenceSolution: |
  def match_route(method: str, path: str, routes: list[tuple[str, str]]) -> dict:
      def captures(pattern: str, actual_path: str) -> dict | None:
          wanted = pattern.split("/")
          actual = actual_path.split("/")
          if len(wanted) != len(actual):
              return None
          params = {}
          for i in range(len(wanted)):
              want, got = wanted[i], actual[i]
              if want[:1] == "{" and want[-1:] == "}" and got != "":
                  params[want[1:-1]] = got
              elif want != got:
                  return None
          return params

      allowed = set()
      for route_method, pattern in routes:
          params = captures(pattern, path)
          if params is None:
              continue
          if route_method == method:
              return {"status": 200, "params": params}
          allowed.add(route_method)
      if allowed:
          return {"status": 405, "allow": sorted(allowed)}
      return {"status": 404}
