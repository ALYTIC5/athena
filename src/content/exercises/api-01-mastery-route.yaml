visibleTests: |
  ROUTES = [
      ("GET", "/bookings"),
      ("POST", "/bookings"),
      ("GET", "/bookings/{ref}"),
      ("DELETE", "/bookings/{ref}"),
      ("GET", "/customers/{customer}/bookings"),
  ]


  def test_a_collection_route():
      assert match_route("GET", "/bookings", ROUTES) == {"status": 200, "params": {}}

  def test_a_route_with_a_parameter():
      assert match_route("DELETE", "/bookings/b-7", ROUTES) == {"status": 200, "params": {"ref": "b-7"}}

  def test_unknown_path_is_404():
      assert match_route("GET", "/agents", ROUTES) == {"status": 404}
