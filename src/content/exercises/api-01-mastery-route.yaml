explanation: |
  Routing is a comparison of segments. Splitting both the pattern and the path at `/` and requiring the same number of segments stops `/bookings/{ref}` from matching `/bookings/b-7/cancel`. A braced segment captures one non-empty segment and every other segment must be equal. The method comes second on purpose: a path that matches some route but not for this method is a different problem from a path nobody knows, so the answer is 405 Method Not Allowed with the allowed methods, instead of 404. Collecting the methods in a set removes repeats and `sorted` makes the answer stable. Alternative: a regular expression per route, built from the pattern, is what many frameworks do. It is faster for many routes, but the segment version is easier to read and shows the rule.
