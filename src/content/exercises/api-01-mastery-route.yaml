title: Match a request to a route, or answer 404 or 405
difficulty: 3
competencies:
  - api.rest-design
  - api.methods
timeoutMs: 5000
packages: []
prompt: |
  A web framework matches each request to a route. Write `match_route(method, path, routes)`.

  - `routes` is a list of `(method, pattern)` pairs, such as `("GET", "/bookings/{ref}")`. A pattern is split into segments at `/`. A segment in braces, like `{ref}`, matches **exactly one** non-empty segment of the path and captures it. Every other segment must match exactly.
  - If a route matches both the method and the path, return `{"status": 200, "params": {...}}` with the captured values, for example `{"ref": "b-7"}`. The first matching route wins.
  - If the path matches some route but not for this method, return `{"status": 405, "allow": [...]}` where `allow` is the sorted list of methods that route set accepts for that path (no duplicates).
  - If no route matches the path, return `{"status": 404}`.

  Paths always start with `/` and have no trailing slash or query string.
starter: |
