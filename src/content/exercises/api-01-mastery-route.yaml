  def test_a_longer_path_is_not_matched_by_a_shorter_pattern():
      assert match_route("GET", "/bookings/b-7/cancel", ROUTES) == {"status": 404}

  def test_a_shorter_path_is_not_matched_by_a_longer_pattern():
      assert match_route("GET", "/customers/c-1", ROUTES) == {"status": 404}

  def test_nested_route_captures_the_middle_segment():
      assert match_route("GET", "/customers/c-1/bookings", ROUTES) == {"status": 200, "params": {"customer": "c-1"}}

  def test_fixed_segments_must_match_exactly():
      assert match_route("GET", "/customers/c-1/calls", ROUTES) == {"status": 404}

  def test_an_empty_segment_does_not_match_a_parameter():
      assert match_route("GET", "/bookings/", ROUTES) == {"status": 404}

  def test_no_routes():
      assert match_route("GET", "/bookings", []) == {"status": 404}

  def test_the_first_matching_route_wins():
      routes = [("GET", "/calls/{id}"), ("GET", "/calls/{call}")]
      assert match_route("GET", "/calls/c-5", routes) == {"status": 200, "params": {"id": "c-5"}}

  def test_methods_from_all_routes_for_the_path_are_listed_once():
      routes = [("GET", "/calls/{id}"), ("PATCH", "/calls/{call}"), ("GET", "/calls/{x}")]
      assert match_route("DELETE", "/calls/c-5", routes) == {"status": 405, "allow": ["GET", "PATCH"]}

  def test_method_names_are_exact():
      assert match_route("get", "/bookings", ROUTES) == {"status": 405, "allow": ["GET", "POST"]}
