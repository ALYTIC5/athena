explanation: |
  `remember` runs once for each decorated function, so the `memory` dict inside it belongs to that function alone: the wrapper is a closure over it. The wrapper uses `*args` to accept any positional arguments, and the tuple `args` is the dict key. `args not in memory` is the right test, because testing the stored value would treat `None` or `0` as "missing". The result is stored only after `func` returns, so an exception leaves the memory unchanged. Alternative: the standard library provides `functools.cache` and `functools.lru_cache`, which do this and also handle keyword arguments; writing it yourself shows what they do. A cache that never forgets can use a lot of memory, which is why `lru_cache` can limit its size.
