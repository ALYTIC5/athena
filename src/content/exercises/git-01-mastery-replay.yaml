referenceSolution: |
  def reachable(parents: dict[str, list[str]], tip: str) -> set[str]:
      seen: set[str] = set()
      todo = [tip]
      while todo:
          commit = todo.pop()
          if commit not in seen:
              seen.add(commit)
              todo.extend(parents[commit])
      return seen


  def commits_to_replay(parents: dict[str, list[str]], upstream: str, branch: str) -> list[str]:
      known = reachable(parents, upstream)
      replay = []
      commit = branch
      while commit not in known:
          replay.append(commit)
          commit = parents[commit][0]
      return replay[::-1]
wrongSolutions:
  - label: Returns the commits newest first
    code: |
      def reachable(parents: dict[str, list[str]], tip: str) -> set[str]:
          seen: set[str] = set()
          todo = [tip]
          while todo:
              commit = todo.pop()
              if commit not in seen:
                  seen.add(commit)
                  todo.extend(parents[commit])
          return seen


      def commits_to_replay(parents: dict[str, list[str]], upstream: str, branch: str) -> list[str]:
          known = reachable(parents, upstream)
          replay = []
          commit = branch
          while commit not in known:
              replay.append(commit)
              commit = parents[commit][0]
          return replay
  - label: Follows only the first parent of upstream's history
    code: |
      def commits_to_replay(parents: dict[str, list[str]], upstream: str, branch: str) -> list[str]:
          known = set()
          commit = upstream
          while True:
              known.add(commit)
              if not parents[commit]:
                  break
              commit = parents[commit][0]
          replay = []
          commit = branch
          while commit not in known:
              replay.append(commit)
              commit = parents[commit][0]
          return replay[::-1]
  - label: Returns every commit of the branch, including the ones upstream already has
    code: |
      def reachable(parents: dict[str, list[str]], tip: str) -> set[str]:
          seen: set[str] = set()
          todo = [tip]
          while todo:
              commit = todo.pop()
              if commit not in seen:
                  seen.add(commit)
                  todo.extend(parents[commit])
          return seen


      def commits_to_replay(parents: dict[str, list[str]], upstream: str, branch: str) -> list[str]:
          replay = []
          commit = branch
          while True:
              replay.append(commit)
              if not parents[commit]:
                  break
              commit = parents[commit][0]
          return replay[::-1]
explanation: |
  Git decides what to replay with a set difference: the commits reachable from your branch minus the commits reachable
  from `upstream`. Because your own commits are a straight line, you can find them by walking back from the tip until you
  hit a commit that upstream has, then reverse the list so the oldest is first. `reachable` must follow every parent: in
  the merge example the branch started from `s1`, which upstream only has through the second parent of its merge commit,
  and a first-parent walk would wrongly replay `s1` and `r`. Alternative: `sorted(reachable(branch) - reachable(upstream))`
  finds the same set but loses the order, which is why the walk is better here.
