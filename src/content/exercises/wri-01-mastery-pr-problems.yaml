explanation: |
  The function strips the title once and reuses it, then collects the stripped, lower-cased body lines that are outside code fences into a set, so each heading check is a membership test. Every rule appends to one list, which keeps both "report all problems" and the documented order. Alternative: return a list of `(code, check)` pairs and loop over them; that scales better when a team adds more rules, but for five rules the plain `if` statements are easier to read. In a real team this kind of check is often done by a CI job or a bot, and a pull request template (see the lesson) pre-fills the headings so authors rarely break them.
