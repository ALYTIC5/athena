      class RateLimiter:
          """Allows at most `limit` calls in any window of `window_s` seconds."""

          def __init__(self, limit, window_s, clock):
              self._limit = limit
              self._window_s = window_s
              self._clock = clock
              self._calls = []

          def allow(self):
              now = self._clock()
              self._calls = [t for t in self._calls if now - t < self._window_s]
              if len(self._calls) < self._limit:
                  self._calls.append(now)
                  return True
              return False


      class FakeClock:
          def __init__(self, start=0.0):
              self._time = start

          def now(self):
              self._time += 1
              return self._time

          def advance(self, seconds):
              if seconds < 0:
                  raise ValueError("time cannot go backwards")
              self._time += seconds
explanation: |
  A fake clock is a small working replacement for the real one: it keeps a number, lets the test move it with `advance`, and never changes by itself. Because `RateLimiter` asks a function for the time, the test passes `clock.now` and then controls exactly when the window has passed, with no waiting and no flakiness. Keeping the time on `self` gives each clock its own value, and refusing a negative advance catches a test that tries to go back in time. Alternative: `monkeypatch.setattr(time, "time", ...)` replaces the real clock for one test, which is useful for code you cannot change. Passing the clock in is cleaner when you can.
