  - label: Leaves a hyphen at the end after cutting
    code: |
      def branch_name(issue_number: int, title: str) -> str:
          slug = "-".join("".join(c if c.isalnum() else " " for c in title.lower()).split())[:40]
          if not slug:
              return f"issue-{issue_number}"
          return f"issue-{issue_number}-{slug}"
  - label: Returns a trailing hyphen when the slug is empty
    code: |
      def branch_name(issue_number: int, title: str) -> str:
          slug = "-".join("".join(c if c.isalnum() else " " for c in title.lower()).split())
          slug = slug[:40].rstrip("-")
          return f"issue-{issue_number}-{slug}"
  - label: Keeps underscores as part of a word
    code: |
      def branch_name(issue_number: int, title: str) -> str:
          kept = "".join(c if (c.isalnum() or c == "_") else " " for c in title.lower())
          slug = "-".join(kept.split())[:40].rstrip("-")
          if not slug:
              return f"issue-{issue_number}"
          return f"issue-{issue_number}-{slug}"
explanation: |
  The loop builds words from runs of letters and digits. A symbol ends the current word, and further symbols in a row end nothing more, so runs collapse and no hyphen appears at the ends. Joining the words with hyphens gives the slug. The cut comes last, because a cut can land just after a separator, and the empty check keeps the name from ending in a hyphen. Alternative: replace every other character with a space, call `split()` and join with hyphens. That is shorter and does the same, but the explicit loop shows each step. A branch name is only a label, and the project's CONTRIBUTING file may ask for a different style.
