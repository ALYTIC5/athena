referenceSolution: |
  from dataclasses import dataclass
  from typing import Protocol


  @dataclass(frozen=True)
  class Booking:
      guest: str
      slot: str
      phone: str


  class Sender(Protocol):
      def send(self, to: str, text: str) -> None: ...


  class ReminderService:
      def __init__(self, sender: Sender) -> None:
          self._sender = sender

      def remind(self, bookings: list[Booking]) -> int:
          sent = 0
          for booking in bookings:
              if not booking.phone.strip():
                  continue
              text = f"Reminder: {booking.guest}, your appointment is at {booking.slot}."
              self._sender.send(booking.phone, text)
              sent += 1
          return sent
