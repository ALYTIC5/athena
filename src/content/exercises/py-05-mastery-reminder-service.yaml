explanation: |
  `ReminderService` receives its sender from outside, which is composition: it uses an object with a `send` method and does not care how it works. The `Sender` protocol tells a type checker what shape is needed, and Python itself never checks it, so a test can pass a simple fake with the same method. That is why this service is easy to test without sending a real message. The loop skips bookings without a phone number, counts only the messages it sent, and does not catch errors, so a problem with the real sender is visible to the caller. Alternative: inheriting from a base sender class would also work, but then every test has to subclass it. A protocol only asks for the method.
