id: py-05-mastery-reminder-service
lesson: py-05
runtime: python
kind: make
pools:
  - mastery
title: 'A ReminderService that uses whatever sender it is given'
difficulty: 3
competencies:
  - py.classes
  - py.typing
timeoutMs: 5000
packages: []
prompt: |
  A reminder service should not know how messages are sent, so tests can use a fake sender. `Sender` is a `Protocol`: any object with a `send(to, text)` method counts as a sender. Complete `ReminderService`:

  - `ReminderService(sender)` keeps the sender it is given. It never creates a sender itself.
  - `remind(bookings)` sends one message for each booking that has a phone number (not empty, and not only spaces), in the order given: `sender.send(booking.phone, text)` where `text` is `Reminder: <guest>, your appointment is at <slot>.`
  - It returns how many messages it sent. It does not change the bookings.
  - If `send` raises an error, let it go on to the caller.
  - Add type hints to `__init__` and `remind`.

  Example: for `Booking("Amara", "09:00", "+44 7700 900123")` the text is `Reminder: Amara, your appointment is at 09:00.`
starter: |
  from dataclasses import dataclass
  from typing import Protocol


  @dataclass(frozen=True)
  class Booking:
      guest: str
      slot: str
      phone: str


  class Sender(Protocol):
      def send(self, to: str, text: str) -> None: ...


  class ReminderService:
      ...
visibleTests: |
  class FakeSender:
      def __init__(self):
          self.sent = []

      def send(self, to, text):
          self.sent.append((to, text))


  def test_sends_a_reminder_for_a_booking():
      sender = FakeSender()
      count = ReminderService(sender).remind([Booking("Amara", "09:00", "+44 7700 900123")])
      assert count == 1
      assert sender.sent == [("+44 7700 900123", "Reminder: Amara, your appointment is at 09:00.")]

  def test_bookings_without_a_phone_number_are_skipped():
      sender = FakeSender()
      count = ReminderService(sender).remind([Booking("Bayu", "10:00", "")])
      assert count == 0
      assert sender.sent == []
hiddenTests: |
  import inspect


  class FakeSender:
      def __init__(self):
          self.sent = []

      def send(self, to, text):
          self.sent.append((to, text))


  def test_order_is_kept_and_only_phone_numbers_count():
      sender = FakeSender()
      bookings = [
          Booking("Amara", "09:00", "+44 7700 900123"),
          Booking("Bayu", "10:00", "   "),
          Booking("Chen", "11:00", "+44 7700 900456"),
      ]
      assert ReminderService(sender).remind(bookings) == 2
      assert [to for to, _ in sender.sent] == ["+44 7700 900123", "+44 7700 900456"]

  def test_empty_list():
      sender = FakeSender()
      assert ReminderService(sender).remind([]) == 0
      assert sender.sent == []

  def test_two_services_use_their_own_senders():
      first, second = FakeSender(), FakeSender()
      ReminderService(first).remind([Booking("Amara", "09:00", "+44 7700 900123")])
      ReminderService(second).remind([Booking("Bayu", "10:00", "+44 7700 900456")])
      assert len(first.sent) == 1 and len(second.sent) == 1
      assert first.sent[0][0] != second.sent[0][0]

  def test_errors_from_the_sender_reach_the_caller():
      class Broken:
          def send(self, to, text):
              raise ConnectionError("offline")

      try:
          ReminderService(Broken()).remind([Booking("Amara", "09:00", "+44 7700 900123")])
      except ConnectionError:
          return
      raise AssertionError("expected ConnectionError")

  def test_earlier_messages_are_sent_before_an_error():
      class FailsSecond:
          def __init__(self):
              self.sent = []

          def send(self, to, text):
              if len(self.sent) == 1:
                  raise ConnectionError("offline")
              self.sent.append(to)

      sender = FailsSecond()
      bookings = [
          Booking("Amara", "09:00", "+44 7700 900123"),
          Booking("Chen", "11:00", "+44 7700 900456"),
      ]
      try:
          ReminderService(sender).remind(bookings)
      except ConnectionError:
          pass
      assert sender.sent == ["+44 7700 900123"]

  def test_bookings_are_not_changed():
      bookings = [Booking("Amara", "09:00", "+44 7700 900123")]
      ReminderService(FakeSender()).remind(bookings)
      assert bookings == [Booking("Amara", "09:00", "+44 7700 900123")]

  def test_type_hints_are_present():
      for name in ["__init__", "remind"]:
          signature = inspect.signature(getattr(ReminderService, name))
          for parameter in list(signature.parameters.values())[1:]:
              assert parameter.annotation is not inspect.Parameter.empty, name
      assert inspect.signature(ReminderService.remind).return_annotation is not inspect.Signature.empty
