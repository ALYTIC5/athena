referenceSolution: |
  from collections import Counter


  def summarise_calls(calls: list[dict]) -> dict:
      per_caller = Counter(c["caller"] for c in calls)
      by_hour = Counter(c["hour"] for c in calls)
      busiest_hour = min(by_hour, key=lambda h: (-by_hour[h], h)) if by_hour else None
      reasons = Counter(c["reason"] for c in calls)
      top_reasons = sorted(reasons.items(), key=lambda item: (-item[1], item[0]))[:3]
      return {
          "per_caller": dict(per_caller),
          "busiest_hour": busiest_hour,
          "top_reasons": top_reasons,
      }
wrongSolutions:
  - label: Uses most_common, so tied reasons keep first-seen order instead of alphabetical order
    code: |
      from collections import Counter


      def summarise_calls(calls: list[dict]) -> dict:
          per_caller = Counter(c["caller"] for c in calls)
          by_hour = Counter(c["hour"] for c in calls)
          busiest_hour = min(by_hour, key=lambda h: (-by_hour[h], h)) if by_hour else None
          top_reasons = Counter(c["reason"] for c in calls).most_common(3)
          return {
              "per_caller": dict(per_caller),
              "busiest_hour": busiest_hour,
              "top_reasons": top_reasons,
          }
  - label: Picks the busiest hour with max, so a tie goes to the hour seen first
    code: |
      from collections import Counter


      def summarise_calls(calls: list[dict]) -> dict:
          per_caller = Counter(c["caller"] for c in calls)
          by_hour = Counter(c["hour"] for c in calls)
          busiest_hour = max(by_hour, key=by_hour.get) if by_hour else None
          reasons = Counter(c["reason"] for c in calls)
          top_reasons = sorted(reasons.items(), key=lambda item: (-item[1], item[0]))[:3]
          return {
              "per_caller": dict(per_caller),
              "busiest_hour": busiest_hour,
              "top_reasons": top_reasons,
          }
  - label: Crashes on an empty day by reading the first item of an empty list
    code: |
      from collections import Counter


      def summarise_calls(calls: list[dict]) -> dict:
          per_caller = Counter(c["caller"] for c in calls)
          by_hour = Counter(c["hour"] for c in calls)
          busiest_hour = sorted(by_hour.items(), key=lambda item: (-item[1], item[0]))[0][0]
          reasons = Counter(c["reason"] for c in calls)
          top_reasons = sorted(reasons.items(), key=lambda item: (-item[1], item[0]))[:3]
          return {
              "per_caller": dict(per_caller),
              "busiest_hour": busiest_hour,
              "top_reasons": top_reasons,
          }
  - label: Sorts the caller's list in place, so the input changes
    code: |
      from collections import Counter


      def summarise_calls(calls: list[dict]) -> dict:
          calls.sort(key=lambda c: c["hour"])
          per_caller = Counter(c["caller"] for c in calls)
          by_hour = Counter(c["hour"] for c in calls)
          busiest_hour = min(by_hour, key=lambda h: (-by_hour[h], h)) if by_hour else None
          reasons = Counter(c["reason"] for c in calls)
          top_reasons = sorted(reasons.items(), key=lambda item: (-item[1], item[0]))[:3]
          return {
              "per_caller": dict(per_caller),
              "busiest_hour": busiest_hour,
              "top_reasons": top_reasons,
          }
explanation: |
  One pass per question: a `Counter` for callers, one for hours and one for reasons. Each count is linear in the number of calls. Ranking uses `sorted` with a key that returns a tuple: a negative count puts the highest count first, and the value itself breaks ties. That is why the answer does not depend on the order of the log. For the busiest hour, `min` with the same key avoids sorting everything when you only need one winner. Alternative: `most_common` is shorter, but ties keep first-seen order, which is not what the rules ask for. Another alternative is a single loop with three `defaultdict(int)` counters; it does the same work with more code.
