explanation: |
  Two ranges are separate when one ends before or exactly when the other starts. Negating that gives the overlap test: each range starts before the other ends, with strict comparisons, so ranges that only touch do not count. That single expression also covers one range inside another and identical ranges. `__post_init__` runs after the generated `__init__`, so it is the place to validate fields, and in a frozen dataclass it must only read them. The string `"TimeRange"` in the hint of `overlaps` is a forward reference: the class does not exist yet while its own body is being run. Alternative: `datetime` ranges would work the same way. Integers keep the exercise free of time zones.
