id: sql-02-having
lesson: sql-02
runtime: sql
kind: make
pools:
  - lesson
title: 'Customers with several bookings'
difficulty: 2
competencies:
  - sql.aggregation
timeoutMs: 5000
estMin: 2
extensions: []
schema: |
  CREATE TABLE customers (
    id integer PRIMARY KEY,
    name text NOT NULL
  );
  CREATE TABLE bookings (
    id integer PRIMARY KEY,
    customer_id integer NOT NULL REFERENCES customers(id),
    starts timestamp NOT NULL,
    ends timestamp NOT NULL
  );
  CREATE TABLE calls (
    id integer PRIMARY KEY,
    customer_id integer REFERENCES customers(id),
    duration_s integer,
    reason text
  );
  INSERT INTO customers VALUES
    (1, 'Amara Okafor'),
    (2, 'Jonas Weber'),
    (3, 'Mei Tanaka'),
    (4, 'Sofia Reyes'),
    (5, 'Tomas Novak');
  INSERT INTO bookings VALUES
    (10, 1, '2026-11-02 09:00', '2026-11-02 10:00'),
    (11, 1, '2026-11-02 09:30', '2026-11-02 10:30'),
    (12, 1, '2026-11-09 09:00', '2026-11-09 10:00'),
    (13, 3, '2026-11-03 14:00', '2026-11-03 15:00'),
    (14, 3, '2026-11-03 15:00', '2026-11-03 16:00'),
    (15, 2, '2026-11-02 09:15', '2026-11-02 09:45');
  INSERT INTO calls VALUES
    (1, 1, 120, 'booking'),
    (2, 1, 45, 'billing'),
    (3, 2, 300, 'cancel'),
    (4, 3, NULL, 'booking'),
    (5, 3, 200, 'booking'),
    (6, NULL, 60, NULL),
    (7, 4, 400, 'billing'),
    (8, 4, 20, 'booking');
prompt: |
  Three tables: `customers` (`id`, `name`), `bookings` (`id`, `customer_id`, `starts`, `ends`) and `calls` (`id`, `customer_id` which is NULL when the caller is unknown, `duration_s` which is NULL for an unanswered call, and `reason`). Each booking and each call belongs to at most one customer.

  Select the `name` of every customer who has two or more bookings, in `name` order.
starter: |
  SELECT ...
referenceSolution: |
  SELECT c.name FROM customers c JOIN bookings b ON b.customer_id = c.id GROUP BY c.id, c.name HAVING COUNT(*) >= 2 ORDER BY c.name;
compare:
  orderMatters: true
checks: []
wrongSolutions:
  - label: 'Uses > 2, so a customer with exactly two bookings is left out'
    code: |
      SELECT c.name FROM customers c JOIN bookings b ON b.customer_id = c.id GROUP BY c.id, c.name HAVING COUNT(*) > 2 ORDER BY c.name;
  - label: 'Uses >= 1, which keeps every customer who has a booking'
    code: |
      SELECT c.name FROM customers c JOIN bookings b ON b.customer_id = c.id GROUP BY c.id, c.name HAVING COUNT(*) >= 1 ORDER BY c.name;
  - label: 'Puts the aggregate in WHERE, which PostgreSQL rejects'
    code: |
      SELECT c.name FROM customers c JOIN bookings b ON b.customer_id = c.id WHERE COUNT(*) >= 2 GROUP BY c.id, c.name ORDER BY c.name;
hints:
  - 'You want to keep groups, not rows. Which clause filters groups?'
  - 'Group the bookings by customer, then filter the groups with HAVING and an aggregate.'
  - 'SELECT c.name FROM customers c JOIN bookings b ON b.customer_id = c.id GROUP BY c.id, c.name ____ COUNT(*) >= ____ ORDER BY c.name;'
explanation: |
  `WHERE` filters rows before they are grouped, so it cannot see an aggregate such as `COUNT(*)`. `HAVING` filters the groups after the aggregate has been calculated. Customers 1 and 3 have three and two bookings, so they pass `COUNT(*) >= 2`. Alternative: put the grouping in a subquery and filter its result with WHERE. That works too, but HAVING says it more directly.
