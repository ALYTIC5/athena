hints:
  - 'Each buggy version breaks one rule. Which inputs sit just inside and just outside each rule?'
  - 'Valid slots to add: midnight and another half hour. Invalid ones: a minute value that is not 00 or 30, an hour that is not digits (such as ab:cd), a space around the slot, and an hour without its leading zero.'
  - '@pytest.mark.parametrize("slot", ["24:00", "09:15", "ab:cd", " 09:00", "9:00", ____])'
referenceSolution: |
  import pytest
  from impl import is_valid_slot


  @pytest.mark.parametrize("slot", ["09:00", "23:30", "00:00", "12:30"])
  def test_valid_slots_are_accepted(slot):
      assert is_valid_slot(slot) is True


  @pytest.mark.parametrize("slot", ["24:00", "09:15", "09:60", "ab:cd", " 09:00", "9:00", ""])
  def test_invalid_slots_are_rejected(slot):
      assert is_valid_slot(slot) is False
wrongSolutions:
  - label: 'Only checks slots that are valid'
    code: |
      import pytest
      from impl import is_valid_slot


      @pytest.mark.parametrize("slot", ["09:00", "23:30", "00:00"])
      def test_valid_slots_are_accepted(slot):
          assert is_valid_slot(slot) is True
  - label: 'Rejects a few obvious cases but not the edges of each rule'
    code: |
      import pytest
      from impl import is_valid_slot


      @pytest.mark.parametrize("slot", ["09:00", "23:30"])
      def test_valid_slots_are_accepted(slot):
          assert is_valid_slot(slot) is True


      @pytest.mark.parametrize("slot", ["24:00", ""])
      def test_invalid_slots_are_rejected(slot):
          assert is_valid_slot(slot) is False
explanation: |
  Each buggy version fails one rule, and a parametrised test is a cheap way to list the edges of every rule: the hour 24 just outside the range, a minute that is neither 00 nor 30, an hour that is not digits (such as ab:cd), a space around the slot, an hour without its leading zero, and midnight on the valid side. Each value is reported as its own test case, so a failure names the exact input. Valid cases and invalid cases go in separate tests because they assert different things. Alternative: one parametrised test with a second parameter for the expected result keeps the pairs together, which reads well when the cases are mixed.
