id: py-06-write-tests-slot-validator
lesson: py-06
runtime: python
kind: write-tests
pools:
  - lesson
title: 'Parametrised tests for a slot validator'
difficulty: 2
competencies:
  - py.pytest
timeoutMs: 20000
estMin: 6
packages: [pytest]
prompt: |
  `is_valid_slot(text)` says whether a text is a bookable slot. A slot is written `HH:MM` with two-digit hours from `00` to `23`, and minutes that are exactly `00` or `30`. Anything else is not a slot, and the function returns `False` for it, without raising an error.

  Finish the two parametrised tests. `@pytest.mark.parametrize` runs one test function once for each value in the list, and reports each case separately. Replace the blanks with values, and add more values: your tests must pass on the correct function and fail on every buggy version, so they must cover the edges of each rule.
starter: |
  import pytest
  from impl import is_valid_slot


  @pytest.mark.parametrize("slot", ["09:00", "23:30", ____])
  def test_valid_slots_are_accepted(slot):
      assert is_valid_slot(slot) is True


  @pytest.mark.parametrize("slot", ["24:00", ____, ____])
  def test_invalid_slots_are_rejected(slot):
      assert is_valid_slot(slot) is False
implementations:
  correct: |
    def is_valid_slot(text):
        if not text.isascii() or len(text) != 5 or text[2] != ":":
            return False
        hours, minutes = text[:2], text[3:]
        if not (hours.isdigit() and minutes.isdigit()):
            return False
        return int(hours) <= 23 and minutes in ("00", "30")
  buggy:
