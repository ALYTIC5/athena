explanation: |
  `git merge` asks two questions about the histories. Is the other branch already part of mine? Then it prints
  "Already up to date". Is my tip part of the other branch's history? Then my branch can simply move forward to it (a
  fast-forward), with no merge commit. If neither is true the histories have diverged and Git needs a merge commit with
  two parents. The order matters: when both tips are the same commit both questions are true, and "up to date" is the
  right answer. The reachable set follows every parent, because a merge commit brings in a whole second line of history.
  Alternative: compute `mine = reachable(parents, current)` and `theirs = reachable(parents, other)` once and compare
  with set operations (`other in mine`, `current in theirs`), which avoids walking the graph twice.
