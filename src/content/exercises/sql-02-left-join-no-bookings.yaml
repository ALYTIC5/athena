id: sql-02-left-join-no-bookings
lesson: sql-02
runtime: sql
kind: make
pools:
  - lesson
title: 'Customers who have never booked'
difficulty: 2
competencies:
  - sql.joins
  - sql.nulls
timeoutMs: 5000
estMin: 2
extensions: []
schema: |
  CREATE TABLE customers (
    id integer PRIMARY KEY,
    name text NOT NULL
  );
  CREATE TABLE bookings (
    id integer PRIMARY KEY,
    customer_id integer NOT NULL REFERENCES customers(id),
    starts timestamp NOT NULL,
    ends timestamp NOT NULL
  );
  CREATE TABLE calls (
    id integer PRIMARY KEY,
    customer_id integer REFERENCES customers(id),
    duration_s integer,
    reason text
  );
  INSERT INTO customers VALUES
    (1, 'Amara Okafor'),
    (2, 'Jonas Weber'),
    (3, 'Mei Tanaka'),
    (4, 'Sofia Reyes'),
    (5, 'Tomas Novak');
  INSERT INTO bookings VALUES
    (10, 1, '2026-11-02 09:00', '2026-11-02 10:00'),
    (11, 1, '2026-11-02 09:30', '2026-11-02 10:30'),
    (12, 1, '2026-11-09 09:00', '2026-11-09 10:00'),
    (13, 3, '2026-11-03 14:00', '2026-11-03 15:00'),
    (14, 3, '2026-11-03 15:00', '2026-11-03 16:00'),
    (15, 2, '2026-11-02 09:15', '2026-11-02 09:45');
  INSERT INTO calls VALUES
    (1, 1, 120, 'booking'),
    (2, 1, 45, 'billing'),
    (3, 2, 300, 'cancel'),
    (4, 3, NULL, 'booking'),
    (5, 3, 200, 'booking'),
    (6, NULL, 60, NULL),
    (7, 4, 400, 'billing'),
    (8, 4, 20, 'booking');
prompt: |
  Three tables: `customers` (`id`, `name`), `bookings` (`id`, `customer_id`, `starts`, `ends`) and `calls` (`id`, `customer_id` which is NULL when the caller is unknown, `duration_s` which is NULL for an unanswered call, and `reason`). Each booking and each call belongs to at most one customer.

  Select the `name` of every customer who has no bookings, in `name` order.
starter: |
  SELECT ...
referenceSolution: |
  SELECT c.name FROM customers c LEFT JOIN bookings b ON b.customer_id = c.id WHERE b.id IS NULL ORDER BY c.name;
compare:
  orderMatters: true
checks: []
wrongSolutions:
  - label: 'Uses an inner join, which drops exactly the customers that have no bookings'
    code: |
      SELECT c.name FROM customers c JOIN bookings b ON b.customer_id = c.id WHERE b.id IS NULL ORDER BY c.name;
  - label: 'Tests with = NULL, which is never true'
    code: |
      SELECT c.name FROM customers c LEFT JOIN bookings b ON b.customer_id = c.id WHERE b.id = NULL ORDER BY c.name;
  - label: 'Keeps the customers that do have a booking'
    code: |
      SELECT DISTINCT c.name FROM customers c LEFT JOIN bookings b ON b.customer_id = c.id WHERE b.id IS NOT NULL ORDER BY c.name;
hints:
  - 'Which join keeps a customer even when no booking matches, and what do the booking columns hold for such a customer?'
  - 'Use a LEFT JOIN from customers to bookings. For a customer with no match, the booking columns are NULL, so test one of them with IS NULL.'
  - 'SELECT c.name FROM customers c ____ JOIN bookings b ON b.customer_id = c.id WHERE b.id IS ____ ORDER BY c.name;'
explanation: |
  A left join keeps every row of the left table (customers). When no booking matches, SQL fills the booking columns with NULL, so `b.id IS NULL` finds the customers without bookings. An inner join would have thrown those customers away before the WHERE ran. Alternative: `WHERE NOT EXISTS (SELECT 1 FROM bookings b WHERE b.customer_id = c.id)` says the same thing without a join, and many people find it easier to read.
