hints:
  - Which exception does json.loads raise when the text cannot be parsed, and which operator checks that a key is absent?
  - 'The exception is `json.JSONDecodeError`, and the operator for "is absent from" is two words.'
  - 'except ____ as error:   and   if "hour" ____ booking:   where the first blank has the module name and the exception name, and the second blank has two words'
referenceSolution: |
  import json


  def load_bookings(text):
      try:
          bookings = json.loads(text)
      except json.JSONDecodeError as error:
          raise ValueError("not valid JSON") from error
      for booking in bookings:
          if "hour" not in booking:
              raise ValueError("missing hour")
      return bookings
wrongSolutions:
  - label: Catches KeyError, which json.loads never raises, so bad text escapes as JSONDecodeError
    code: |
      import json


      def load_bookings(text):
          try:
              bookings = json.loads(text)
          except KeyError as error:
              raise ValueError("not valid JSON") from error
          for booking in bookings:
              if "hour" not in booking:
                  raise ValueError("missing hour")
          return bookings
  - label: Tests the key the wrong way round, so valid bookings are rejected
    code: |
      import json


      def load_bookings(text):
          try:
              bookings = json.loads(text)
          except json.JSONDecodeError as error:
              raise ValueError("not valid JSON") from error
          for booking in bookings:
              if "hour" in booking:
                  raise ValueError("missing hour")
          return bookings
  - label: Drops the original error, so the cause is lost
    code: |
      import json


      def load_bookings(text):
          try:
              bookings = json.loads(text)
          except json.JSONDecodeError:
              raise ValueError("not valid JSON") from None
          for booking in bookings:
              if "hour" not in booking:
                  raise ValueError("missing hour")
          return bookings
explanation: |
  `json.loads` raises `json.JSONDecodeError` for text that is not JSON, and that is the most specific exception to catch. Raising a `ValueError` with your own message, `from error`, keeps the original error as the cause, so the traceback shows both. A `ValueError` is a good type for "the data is not what we expect". Alternative: `json.JSONDecodeError` is a subclass of `ValueError`, so `except ValueError` would also work here, but it is wider and could hide other problems. Looking before you leap, with `if "hour" not in booking`, is fine here because no other code can change the dict between the check and the use.
