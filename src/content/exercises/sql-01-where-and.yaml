id: sql-01-where-and
lesson: sql-01
runtime: sql
kind: make
pools:
  - lesson
title: 'Long calls later in the day'
difficulty: 1
competencies:
  - sql.select
timeoutMs: 5000
estMin: 2
extensions: []
schema: |
  CREATE TABLE calls (
    id integer PRIMARY KEY,
    caller_name text NOT NULL,
    hour integer NOT NULL,
    duration_s integer,
    reason text
  );
  INSERT INTO calls VALUES
    (1, 'Amara', 11, 120, 'booking'),
    (2, 'Bayu', 9, 45, 'billing'),
    (3, 'Chen', 9, NULL, NULL),
    (4, 'Dara', 9, 300, 'booking'),
    (5, 'Esi', 16, 60, NULL),
    (6, 'Farid', 10, 15, 'cancel'),
    (7, 'Gita', 15, NULL, 'booking'),
    (8, 'Hana', 12, 200, 'billing'),
    (9, 'Ivo', 11, 90, 'booking'),
    (10, 'Jun', 10, 30, 'cancel');
prompt: |
  The table `calls` has one row per call: `id`, `caller_name`, `hour` (0 to 23), `duration_s` (seconds, or NULL if the call was not answered) and `reason` (NULL if no reason was recorded). Keep the column names.

  Select `caller_name` of the calls that lasted at least 60 seconds and started at hour 11 or later, in `id` order.
starter: |
  SELECT ...
referenceSolution: |
  SELECT caller_name FROM calls WHERE duration_s >= 60 AND hour >= 11 ORDER BY id;
compare:
  orderMatters: true
checks: []
wrongSolutions:
  - label: 'Uses > instead of >=, so a call of exactly 60 seconds is left out'
    code: |
      SELECT caller_name FROM calls WHERE duration_s > 60 AND hour >= 11 ORDER BY id;
  - label: 'Uses OR, so a call that meets only one condition is kept'
    code: |
      SELECT caller_name FROM calls WHERE duration_s >= 60 OR hour >= 11 ORDER BY id;
  - label: 'Uses hour > 11, so calls at hour 11 are left out'
    code: |
      SELECT caller_name FROM calls WHERE duration_s >= 60 AND hour > 11 ORDER BY id;
hints:
  - 'There are two conditions. Must a row meet both of them, or only one?'
  - 'Join the two conditions with AND. At least means greater than or equal to, and so does or later.'
  - 'SELECT caller_name FROM calls WHERE duration_s ____ 60 ____ hour ____ 11 ORDER BY id;'
explanation: |
  `WHERE a AND b` keeps a row only when both conditions are true, and `>=` includes the boundary value. Rows where `duration_s` is NULL are left out too, because a comparison with NULL is never true (more about that below). Alternative: `NOT (duration_s < 60 OR hour < 11)` selects the same rows, but the positive form is easier to read.
