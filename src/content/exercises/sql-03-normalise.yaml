id: sql-03-normalise
lesson: sql-03
runtime: sql
kind: make
pools:
  - lesson
title: 'Split a messy table into two'
difficulty: 3
competencies:
  - sql.normalisation
  - sql.schema
timeoutMs: 5000
estMin: 3
extensions: []
schema: |
  CREATE TABLE calls_raw (
    call_id integer PRIMARY KEY,
    caller_name text NOT NULL,
    caller_phone text NOT NULL,
    reason text,
    duration_s integer
  );
  INSERT INTO calls_raw VALUES
    (1, 'Amara Okafor', '+44 7700 900123', 'booking', 120),
    (2, 'Bayu Singh', '+44 7700 900456', 'billing', 45),
    (3, 'Amara Okafor', '+44 7700 900123', 'cancel', 30),
    (4, 'Chen Wei', '+44 7700 900789', 'booking', 200),
    (5, 'Bayu Singh', '+44 7700 900456', 'booking', 60);
prompt: |
  `calls_raw` repeats each caller's name and phone number on every call, so a changed phone number would need many updates. Split it into two tables, and leave `calls_raw` as it is:

  - `callers`: `id` (generated identity primary key), `name` (required) and `phone` (required, unique). One row for each different caller, filled from `calls_raw`.
  - `calls`: `id` (an integer primary key that keeps the `call_id` of each raw row), `caller_id` (required, a foreign key to `callers`), `reason` and `duration_s`. It has no name or phone column. One row for each raw call, filled from `calls_raw`.

  Callers are identified by their phone number.
starter: |
  CREATE TABLE callers (
    ...
  );

  INSERT INTO callers ...

  CREATE TABLE calls (
    ...
  );

  INSERT INTO calls ...
referenceSolution: |
  CREATE TABLE callers (
    id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    name text NOT NULL,
    phone text NOT NULL UNIQUE
  );

  INSERT INTO callers (name, phone)
  SELECT DISTINCT caller_name, caller_phone FROM calls_raw;

  CREATE TABLE calls (
    id integer PRIMARY KEY,
    caller_id integer NOT NULL REFERENCES callers(id),
    reason text,
    duration_s integer
  );

  INSERT INTO calls (id, caller_id, reason, duration_s)
  SELECT r.call_id, c.id, r.reason, r.duration_s
  FROM calls_raw r
  JOIN callers c ON c.phone = r.caller_phone;
compare: none
checks:
