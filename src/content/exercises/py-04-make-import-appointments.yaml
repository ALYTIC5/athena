referenceSolution: |
  import csv
  import io
  from datetime import datetime, timezone
  from zoneinfo import ZoneInfo


  def import_appointments(csv_text: str, tz_name: str) -> tuple[list[dict], list[str]]:
      zone = ZoneInfo(tz_name)
      appointments = []
      errors = []
      used_ids = set()
      for number, row in enumerate(csv.DictReader(io.StringIO(csv_text)), start=1):
          appointment_id = (row.get("id") or "").strip()
          customer = (row.get("customer") or "").strip()
          raw = (row.get("local_time") or "").strip()
          if not appointment_id:
              errors.append(f"row {number}: missing id")
              continue
          if not customer:
              errors.append(f"row {number}: missing customer")
              continue
          try:
              local = datetime.fromisoformat(raw)
          except ValueError:
              errors.append(f"row {number}: invalid time")
              continue
          if local.tzinfo is not None:
              errors.append(f"row {number}: invalid time")
              continue
          if appointment_id in used_ids:
              errors.append(f"row {number}: duplicate id")
              continue
          used_ids.add(appointment_id)
          utc = local.replace(tzinfo=zone).astimezone(timezone.utc).isoformat()
          appointments.append({"id": appointment_id, "customer": customer, "utc": utc})
      return appointments, errors
