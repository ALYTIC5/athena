explanation: |
  The function checks the four rules one after another and appends a code for each rule that applies, so it reports every problem in the documented order. The `None` check comes first so the number comparison never sees `None`. Alternative: keep a list of `(code, test)` pairs and loop over it. That scales better when you add rules, but for four rules the plain `if` statements are easier to read. The thresholds are rules of thumb, not GitHub rules, and a real maintainer's reply is a better guide than any score.
