id: api-02-mastery-create-handler
lesson: api-02
runtime: python
kind: make
pools:
  - mastery
title: Decide the status code for POST /bookings
difficulty: 3
competencies:
  - api.fastapi
  - api.status-codes
timeoutMs: 5000
estMin: 15
packages: []
prompt: |
  A framework calls a function you write for each route. Keep the decisions in a plain function, so you can test them without a server. Write `handle_create(bookings, payload)` for `POST /bookings`. It returns a pair `(status, body)`.

  - `bookings` is a dict from a booking ref such as `"b-1"` to a booking dict. It stands in for the database. `payload` is the dict parsed from the JSON body.
  - **Rules for the payload:** `customer` is required and must be text that is not blank after stripping. `slot` is required and must be non-empty text. `party_size` is optional (default 1) and must be an `int` from 1 to 12; the text `"4"` is **not** accepted here, and neither are `True` and `False` (in Python they count as ints, so check the exact type).
  - If any rule is broken, return `(422, {"detail": [...]})`. The list has one dict `{"field": name, "message": text}` for **every** broken rule, in the order customer, slot, party_size.
  - Otherwise, if another booking already has the same `slot`, return `(409, {"detail": "Slot already booked"})`. Check the payload first, then the conflict.
  - Otherwise create the booking `{"ref": ..., "customer": ..., "slot": ..., "party_size": ...}`. The ref is `"b-"` plus the number of bookings **after** adding it (so the first is `"b-1"`). The customer is stored stripped. Add it to `bookings` and return `(201, booking)`.
  - A 422 or a 409 must leave `bookings` unchanged.
starter: |
  def handle_create(bookings: dict, payload: dict) -> tuple[int, dict]:
      ...
visibleTests: |
  def test_a_valid_booking_is_created():
      bookings = {}
      status, body = handle_create(bookings, {"customer": "Amara Okafor", "slot": "2026-11-12T09:00"})
      assert status == 201
      assert body == {"ref": "b-1", "customer": "Amara Okafor", "slot": "2026-11-12T09:00", "party_size": 1}
      assert bookings["b-1"] == body

  def test_a_missing_customer_is_422():
      status, body = handle_create({}, {"slot": "2026-11-12T09:00"})
      assert status == 422
      assert [d["field"] for d in body["detail"]] == ["customer"]

  def test_a_taken_slot_is_409():
      bookings = {"b-1": {"ref": "b-1", "customer": "Bo Lindqvist", "slot": "2026-11-12T09:00", "party_size": 2}}
      status, body = handle_create(bookings, {"customer": "Amara Okafor", "slot": "2026-11-12T09:00"})
      assert (status, body) == (409, {"detail": "Slot already booked"})
