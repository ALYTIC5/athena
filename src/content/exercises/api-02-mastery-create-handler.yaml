referenceSolution: |
  def handle_create(bookings: dict, payload: dict) -> tuple[int, dict]:
      problems = []
      customer = payload.get("customer")
      if not isinstance(customer, str) or not customer.strip():
          problems.append({"field": "customer", "message": "customer must be text that is not blank"})
      slot = payload.get("slot")
      if not isinstance(slot, str) or not slot:
          problems.append({"field": "slot", "message": "slot must be non-empty text"})
      party_size = payload.get("party_size", 1)
      if type(party_size) is not int or not 1 <= party_size <= 12:
          problems.append({"field": "party_size", "message": "party_size must be a whole number from 1 to 12"})
      if problems:
          return 422, {"detail": problems}
      if any(b["slot"] == slot for b in bookings.values()):
          return 409, {"detail": "Slot already booked"}
      ref = f"b-{len(bookings) + 1}"
      booking = {"ref": ref, "customer": customer.strip(), "slot": slot, "party_size": party_size}
      bookings[ref] = booking
      return 201, booking
