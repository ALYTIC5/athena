  def test_every_broken_rule_is_listed_in_order():
      status, body = handle_create({}, {"customer": "  ", "slot": "", "party_size": 0})
      assert status == 422
      assert [d["field"] for d in body["detail"]] == ["customer", "slot", "party_size"]
      assert all(isinstance(d["message"], str) and d["message"] for d in body["detail"])

  def test_party_size_bounds():
      for size in (1, 12):
          assert handle_create({}, {"customer": "A", "slot": "s", "party_size": size})[0] == 201
      for size in (0, 13, -1):
          status, body = handle_create({}, {"customer": "A", "slot": "s", "party_size": size})
          assert status == 422 and [d["field"] for d in body["detail"]] == ["party_size"]

  def test_party_size_text_is_not_accepted():
      status, body = handle_create({}, {"customer": "A", "slot": "s", "party_size": "4"})
      assert status == 422 and [d["field"] for d in body["detail"]] == ["party_size"]

  def test_true_is_not_a_party_size():
      status, body = handle_create({}, {"customer": "A", "slot": "s", "party_size": True})
      assert status == 422 and [d["field"] for d in body["detail"]] == ["party_size"]

  def test_party_size_defaults_to_one():
      status, body = handle_create({}, {"customer": "A", "slot": "s"})
      assert (status, body["party_size"]) == (201, 1)

  def test_the_customer_is_stored_stripped():
      status, body = handle_create({}, {"customer": "  Amara Okafor ", "slot": "s"})
      assert body["customer"] == "Amara Okafor"

  def test_a_customer_that_is_not_text_is_422():
      status, body = handle_create({}, {"customer": 42, "slot": "s"})
      assert status == 422 and [d["field"] for d in body["detail"]] == ["customer"]

  def test_the_payload_is_checked_before_the_conflict():
      bookings = {"b-1": {"ref": "b-1", "customer": "Bo", "slot": "s", "party_size": 1}}
      status, body = handle_create(bookings, {"customer": "", "slot": "s"})
      assert status == 422

  def test_a_422_leaves_the_store_unchanged():
      bookings = {}
      handle_create(bookings, {"customer": "", "slot": "s"})
      assert bookings == {}

  def test_a_409_leaves_the_store_unchanged():
      existing = {"ref": "b-1", "customer": "Bo", "slot": "s", "party_size": 1}
      bookings = {"b-1": existing}
      handle_create(bookings, {"customer": "A", "slot": "s"})
      assert bookings == {"b-1": existing}

  def test_the_second_booking_gets_the_next_ref():
      bookings = {}
      handle_create(bookings, {"customer": "A", "slot": "s1"})
      status, body = handle_create(bookings, {"customer": "B", "slot": "s2", "party_size": 3})
      assert (status, body["ref"]) == (201, "b-2")
      assert set(bookings) == {"b-1", "b-2"}

  def test_a_different_slot_is_not_a_conflict():
      bookings = {"b-1": {"ref": "b-1", "customer": "Bo", "slot": "s1", "party_size": 1}}
      assert handle_create(bookings, {"customer": "A", "slot": "s2"})[0] == 201
