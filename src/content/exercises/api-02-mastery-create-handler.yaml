explanation: |
  The function keeps the decisions apart from the framework: first validate the whole payload and report every problem (422), then check the state of the world (409), and only then change it (201). Order matters because a request that is malformed should never reach the database check, and nothing is stored until every check has passed. A FastAPI route would do the same work, with the Pydantic model doing the first step and an `HTTPException` doing the second.

  An alternative is to raise a small exception class from each check and turn it into a status code in one place. That reads well when there are many rules, at the cost of reporting only the first problem unless you collect them.
