explanation: |
  The factory `retry` checks its settings once and returns `decorator`, which wraps the function in a loop. The `except exceptions` clause takes the tuple directly, so only the listed types (and their subclasses) are retried. Anything else propagates at once, because retrying a `KeyError` or a bug would only waste time. On the last attempt the bare `raise` re-raises the exception that is being handled, so the caller sees the real error. Alternative: a `while` loop with an attempt counter does the same thing. In production code, you would usually also wait between attempts, with a growing delay, and only retry calls that are safe to repeat (idempotent), which is why the list of exceptions is a parameter and not a default.
