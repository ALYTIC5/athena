id: api-02-make-ticket-model
lesson: api-02
runtime: python
kind: make
pools:
  - lesson
title: Validate a support ticket with a Pydantic model
difficulty: 3
competencies:
  - api.fastapi
  - api.status-codes
timeoutMs: 8000
estMin: 10
packages:
  - pydantic
prompt: |
  The support form of a booking assistant sends tickets as JSON. Write a Pydantic model `TicketIn` that checks them, the way a FastAPI route would before its own code runs.

  - `title`: text, required. Spaces at the start and end are removed. After that it must not be blank, and it can be at most 80 characters long.
  - `priority`: a whole number from 1 (urgent) to 4 (low). The default is 3.
  - `contact`: text or `None`, default `None`. When it is given, it must contain exactly one `@`. This is a simple check, not full email validation.

  Bad input must raise `pydantic.ValidationError`, and every problem must be reported together, not only the first. The model is built with `TicketIn.model_validate(payload)` or `TicketIn(**payload)`.

  Example: `{"title": "  Printer jam ", "priority": "2"}` gives a ticket with title `"Printer jam"`, priority `2` and contact `None`.
starter: |
  from pydantic import BaseModel, Field, field_validator


  class TicketIn(BaseModel):
      ...
visibleTests: |
  from pydantic import BaseModel, ValidationError


  def error_fields(payload):
      try:
          TicketIn.model_validate(payload)
      except ValidationError as error:
          return sorted(str(e["loc"][0]) for e in error.errors())
      return []


  def test_a_valid_ticket():
      ticket = TicketIn.model_validate({"title": "Printer jam", "priority": 2})
      assert ticket.title == "Printer jam"
      assert ticket.priority == 2
      assert ticket.contact is None

  def test_the_default_priority_is_three():
      assert TicketIn(title="Login fails").priority == 3

  def test_a_blank_title_is_rejected():
      assert error_fields({"title": "   "}) == ["title"]
hiddenTests: |
  def test_it_is_a_pydantic_model():
      assert issubclass(TicketIn, BaseModel)

  def test_spaces_around_the_title_are_removed():
      assert TicketIn(title="  Printer jam ").title == "Printer jam"

  def test_title_length_boundary():
      assert TicketIn(title="x" * 80).title == "x" * 80
      assert error_fields({"title": "x" * 81}) == ["title"]

  def test_a_missing_title_is_an_error():
      assert error_fields({"priority": 2}) == ["title"]

  def test_priority_bounds():
      assert TicketIn(title="a", priority=1).priority == 1
      assert TicketIn(title="a", priority=4).priority == 4
      assert error_fields({"title": "a", "priority": 0}) == ["priority"]
      assert error_fields({"title": "a", "priority": 5}) == ["priority"]

  def test_priority_text_that_is_a_number_is_converted():
      assert TicketIn(title="a", priority="2").priority == 2

  def test_priority_that_is_not_a_number_is_rejected():
      assert error_fields({"title": "a", "priority": "high"}) == ["priority"]

  def test_a_valid_contact_is_kept():
      assert TicketIn(title="a", contact="amara@example.com").contact == "amara@example.com"

  def test_contact_needs_exactly_one_at_sign():
      assert error_fields({"title": "a", "contact": "amara.example.com"}) == ["contact"]
      assert error_fields({"title": "a", "contact": "amara@@example.com"}) == ["contact"]
      assert error_fields({"title": "a", "contact": "a@b@example.com"}) == ["contact"]

  def test_an_explicit_none_contact_is_allowed():
      assert TicketIn.model_validate({"title": "a", "contact": None}).contact is None

  def test_every_problem_is_reported_together():
      assert error_fields({"title": " ", "priority": 9, "contact": "x"}) == ["contact", "priority", "title"]

  def test_the_fields_are_exactly_these_three():
      assert TicketIn(title=" a ").model_dump() == {"title": "a", "priority": 3, "contact": None}
feedback:
  - test: test_a_valid_ticket
    message: 'A valid payload must build a ticket whose title, priority and contact are the values given (contact is None when left out).'
  - test: test_the_default_priority_is_three
    message: 'Give priority a default of 3 with Field(default=3, ge=1, le=4).'
  - test: test_priority_that_is_not_a_number_is_rejected
    message: 'The text "high" is not a number, so priority must be an int field and fail with a ValidationError.'
  - test: test_the_fields_are_exactly_these_three
    message: 'The model should have exactly the fields title, priority and contact, with the defaults 3 and None, and a stripped title.'
  - test: test_it_is_a_pydantic_model
    message: 'TicketIn must inherit from BaseModel. A plain class or a dataclass does not check anything when it is built.'
  - test: test_spaces_around_the_title_are_removed
    message: 'A validator must return the cleaned value. Return value.strip(), not the original value, and make sure the validator returns something.'
  - test: test_a_blank_title_is_rejected
    message: 'A title of only spaces is blank. Strip it first, then raise ValueError when nothing is left. min_length=1 alone counts the spaces.'
  - test: test_title_length_boundary
    message: '80 characters are allowed and 81 are not. Add max_length=80 to the title Field, or check the length in the validator.'
  - test: test_priority_bounds
    message: 'Priority runs from 1 to 4 with both ends allowed. Use Field(default=3, ge=1, le=4). Check that you set both ge and le.'
  - test: test_priority_text_that_is_a_number_is_converted
    message: 'Pydantic converts the text "2" to the number 2 by default. Do not switch strict mode on or write your own type check.'
  - test: test_contact_needs_exactly_one_at_sign
    message: 'Count the @ signs: value.count("@") != 1 is an error. A test like "@" in value lets a@b@c through.'
  - test: test_an_explicit_none_contact_is_allowed
    message: 'A validator also runs when the caller passes contact=None. Return None unchanged before you call string methods on the value.'
  - test: test_every_problem_is_reported_together
    message: 'Let Pydantic collect the errors: put each rule in Field or in a field_validator, and do not check fields by hand in one place.'
  - test: test_a_missing_title_is_an_error
    message: 'title has no default, so leaving it out is an error. Do not give it a default value.'
