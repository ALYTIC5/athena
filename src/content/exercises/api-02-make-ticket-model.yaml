  - label: 'A plain class: nothing is checked when it is built'
    code: |
      class TicketIn:
          def __init__(self, title, priority=3, contact=None):
              self.title = title
              self.priority = priority
              self.contact = contact

          @classmethod
          def model_validate(cls, payload):
              return cls(**payload)
explanation: |
  Pydantic checks the data when the object is built, so the rules live in one place and every problem is collected into one `ValidationError`. Field arguments such as `max_length`, `ge` and `le` cover the simple rules. A `field_validator` covers rules you write as code, and whatever it returns replaces the value, which is why it must return the cleaned text and why it must cope with `None` for an optional field.

  An alternative for the title is `model_config = ConfigDict(str_strip_whitespace=True)` with `min_length=1` on the field. That is shorter, but it strips every text field in the model, and a custom message for the blank case needs a validator anyway. In a FastAPI route, a body that fails this model is answered with status 422 before your function starts.
