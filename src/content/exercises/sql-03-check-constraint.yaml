id: sql-03-check-constraint
lesson: sql-03
runtime: sql
kind: make
pools:
  - lesson
title: 'Refuse a shift that ends before it starts'
difficulty: 2
competencies:
  - sql.schema
  - sql.nulls
timeoutMs: 5000
estMin: 2
extensions: []
schema: |
  SELECT 1;
prompt: |
  Create a table `shifts` with:

  - `id`: a generated identity primary key.
  - `starts_at` and `ends_at`: timestamps with time zone, both required.
  - A rule in the table definition that a shift must end after it starts. A shift of zero length is also refused.
starter: |
  CREATE TABLE shifts (
    ...
  );
referenceSolution: |
  CREATE TABLE shifts (
    id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    starts_at timestamptz NOT NULL,
    ends_at timestamptz NOT NULL,
    CHECK (ends_at > starts_at)
  );
compare: none
checks:
  - "WITH i AS (INSERT INTO shifts (starts_at, ends_at) VALUES ('2026-11-02 09:00+00', '2026-11-02 17:00+00') RETURNING 1) SELECT count(*) = 1 FROM i"
  - sql: "INSERT INTO shifts (starts_at, ends_at) VALUES ('2026-11-02 17:00+00', '2026-11-02 09:00+00');"
    expectError: '23514'
  - sql: "INSERT INTO shifts (starts_at, ends_at) VALUES ('2026-11-02 09:00+00', '2026-11-02 09:00+00');"
    expectError: '23514'
  - sql: "INSERT INTO shifts (starts_at, ends_at) VALUES ('2026-11-02 09:00+00', NULL);"
    expectError: '23502'
  - sql: "INSERT INTO shifts (starts_at, ends_at) VALUES (NULL, '2026-11-02 17:00+00');"
    expectError: '23502'
wrongSolutions:
  - label: 'Has no check, so a shift can end before it starts'
    code: |
      CREATE TABLE shifts (
        id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        starts_at timestamptz NOT NULL,
        ends_at timestamptz NOT NULL
      );
  - label: 'Uses >=, so a shift of zero length is accepted'
    code: |
      CREATE TABLE shifts (
        id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        starts_at timestamptz NOT NULL,
        ends_at timestamptz NOT NULL,
        CHECK (ends_at >= starts_at)
      );
  - label: 'Leaves ends_at without NOT NULL, and a CHECK accepts NULL'
    code: |
      CREATE TABLE shifts (
        id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        starts_at timestamptz NOT NULL,
        ends_at timestamptz,
        CHECK (ends_at > starts_at)
      );
hints:
  - 'Which constraint tests a condition on the values of a row?'
  - 'CHECK (condition) refuses a row when the condition is false. Remember that a CHECK also passes when the condition is unknown, which happens with NULL.'
  - |-
    ends_at timestamptz ____ ____,
    CHECK (ends_at ____ starts_at)
explanation: |
  `CHECK (ends_at > starts_at)` refuses any row for which the condition is false (SQLSTATE 23514). The strict `>` also refuses a shift of zero length. A CHECK passes when its condition is unknown, and a comparison with NULL is unknown, so a NULL `ends_at` would slip through, which is why the columns also need `NOT NULL`. Alternative: a range type with an exclusion constraint (`EXCLUDE USING gist`) can also refuse overlapping shifts, which a CHECK cannot do because it sees only one row.
