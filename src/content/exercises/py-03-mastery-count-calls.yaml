referenceSolution: |
  import functools


  def count_calls(func):
      @functools.wraps(func)
      def wrapper(*args, **kwargs):
          wrapper.calls += 1
          return func(*args, **kwargs)

      wrapper.calls = 0
      return wrapper
wrongSolutions:
  - label: Keeps one count in a global variable, shared by every decorated function
    code: |
      import functools

      total = 0


      def count_calls(func):
          @functools.wraps(func)
          def wrapper(*args, **kwargs):
              global total
              total += 1
              wrapper.calls = total
              return func(*args, **kwargs)

          wrapper.calls = 0
          return wrapper
  - label: Does not forward keyword arguments
    code: |
      import functools


      def count_calls(func):
          @functools.wraps(func)
          def wrapper(*args):
              wrapper.calls += 1
              return func(*args)

          wrapper.calls = 0
          return wrapper
  - label: Counts only after the call, so a call that raises is not counted
    code: |
      import functools


      def count_calls(func):
          @functools.wraps(func)
          def wrapper(*args, **kwargs):
              result = func(*args, **kwargs)
              wrapper.calls += 1
              return result

          wrapper.calls = 0
          return wrapper
  - label: Drops the result of the original function
    code: |
      import functools


      def count_calls(func):
          @functools.wraps(func)
          def wrapper(*args, **kwargs):
              wrapper.calls += 1
              func(*args, **kwargs)

          wrapper.calls = 0
          return wrapper
explanation: |
  A function is an object, so the wrapper can carry its own `calls` attribute. Each time `count_calls` decorates a function it creates a new wrapper with its own count, so counts never mix. The wrapper adds one first, then forwards `*args` and `**kwargs` and returns the result, so a call that raises is still counted. `functools.wraps` copies the original name and docstring. Alternative: a `nonlocal` counter inside `count_calls` also works for counting, but the outside code could not read it, which is why an attribute is convenient here.
