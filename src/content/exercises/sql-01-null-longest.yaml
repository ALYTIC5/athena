id: sql-01-null-longest
lesson: sql-01
runtime: sql
kind: make
pools:
  - lesson
title: 'The three longest answered calls'
difficulty: 2
competencies:
  - sql.nulls
  - sql.select
timeoutMs: 5000
estMin: 2
extensions: []
schema: |
  CREATE TABLE calls (
    id integer PRIMARY KEY,
    caller_name text NOT NULL,
    hour integer NOT NULL,
    duration_s integer,
    reason text
  );
  INSERT INTO calls VALUES
    (1, 'Amara', 11, 120, 'booking'),
    (2, 'Bayu', 9, 45, 'billing'),
    (3, 'Chen', 9, NULL, NULL),
    (4, 'Dara', 9, 300, 'booking'),
    (5, 'Esi', 16, 60, NULL),
    (6, 'Farid', 10, 15, 'cancel'),
    (7, 'Gita', 15, NULL, 'booking'),
    (8, 'Hana', 12, 200, 'billing'),
    (9, 'Ivo', 11, 90, 'booking'),
    (10, 'Jun', 10, 30, 'cancel');
prompt: |
  The table `calls` has one row per call: `id`, `caller_name`, `hour` (0 to 23), `duration_s` (seconds, or NULL if the call was not answered) and `reason` (NULL if no reason was recorded). Keep the column names.

  Select `caller_name` and `duration_s` of the 3 longest calls, longest first. Unanswered calls (`duration_s` is NULL) are not candidates.
starter: |
  SELECT ...
referenceSolution: |
  SELECT caller_name, duration_s FROM calls WHERE duration_s IS NOT NULL ORDER BY duration_s DESC LIMIT 3;
compare:
  orderMatters: true
checks: []
wrongSolutions:
  - label: 'Forgets that NULLs sort first in a descending sort, so unanswered calls fill the top rows'
    code: |
      SELECT caller_name, duration_s FROM calls ORDER BY duration_s DESC LIMIT 3;
  - label: 'Sorts ascending, so it returns the shortest answered calls'
    code: |
      SELECT caller_name, duration_s FROM calls WHERE duration_s IS NOT NULL ORDER BY duration_s LIMIT 3;
hints:
  - 'Where do the rows with a NULL duration appear in a descending sort in PostgreSQL?'
  - 'In PostgreSQL, NULL sorts as if it were larger than any value, so it comes first in DESC order. Remove the unanswered calls before you sort, or tell ORDER BY to put NULLs last.'
  - 'SELECT caller_name, duration_s FROM calls WHERE duration_s ____ ____ ____ ORDER BY duration_s DESC LIMIT 3;'
explanation: |
  By default PostgreSQL sorts NULL as larger than any other value, so `ORDER BY duration_s DESC` puts the unanswered calls at the top, and `LIMIT 3` then returns them. Filtering with `IS NOT NULL` fixes it. Alternative: `ORDER BY duration_s DESC NULLS LAST` keeps the NULL rows but sorts them at the end, which is better when you need them in the result too.
