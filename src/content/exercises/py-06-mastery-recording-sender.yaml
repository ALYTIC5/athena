    code: |
      def notify_all(sender, numbers, text):
          failed = []
          for number in numbers:
              try:
                  sender.send(number, text)
              except ConnectionError:
                  failed.append(number)
          return failed


      class RecordingSender:
          def __init__(self, fail_for=()):
              self._fail_for = fail_for
              self.sent = []

          def send(self, to, text):
              if to in self._fail_for.union(()):
                  raise ConnectionError(to)
              self.sent.append((to, text))
explanation: |
  A fake sender does the minimum a real one would do from the code's point of view: it accepts `send(to, text)`, and it can be told to fail. Recording the pairs in `sent` lets the test check what would have been sent, and raising `ConnectionError` for chosen numbers lets the test check the error path, which is hard to trigger with a real service. Copying `fail_for` into a set makes the `in` test fast and works for any collection. The record is created in `__init__`, so each fake starts empty. Alternative: `unittest.mock.Mock` can record calls and raise errors without writing a class, using `side_effect`. A hand-written fake is clearer when the behaviour is more than a line or two.
