  - label: Strips every hash, so a level-3 heading counts
    code: |
      REQUIRED = ["Overview", "Quickstart", "Configuration", "Tests"]


      def missing_sections(readme: str) -> list[str]:
          found = set()
          in_code = False
          for line in readme.split("\n"):
              if line.strip().startswith("```"):
                  in_code = not in_code
              elif not in_code and line.startswith("##"):
                  found.add(line.lstrip("#").strip().lower())
          return [name for name in REQUIRED if name.lower() not in found]
  - label: Matches by prefix, so "Quickstart guide" answers "Quickstart"
    code: |
      REQUIRED = ["Overview", "Quickstart", "Configuration", "Tests"]


      def missing_sections(readme: str) -> list[str]:
          found = []
          in_code = False
          for line in readme.split("\n"):
              if line.strip().startswith("```"):
                  in_code = not in_code
              elif not in_code and line.startswith("## "):
                  found.append(line[3:].strip().lower())
          return [n for n in REQUIRED if not any(f.startswith(n.lower()) for f in found)]
explanation: |
  The function walks the README once, keeping a flag for "inside a code fence". Only a line that starts with `## ` outside a fence adds a heading to the set, and the result is built from `REQUIRED`, so the order never depends on the file. A set makes each lookup constant time, but with four names a list would work just as well. Alternative: a regular expression such as `re.match(r"## (.+?)\s*$", line)` finds headings in one step, but you still need the fence flag, and the plain `startswith` is easier to read.
