patternExplanation: |
  Recursion means a function solves a problem by calling itself on a smaller version of the same problem. Every recursive function needs a base case that stops the calls and a recursive case that moves toward it. To list every subset, build one bundle at a time: for a target size, try each add-on that comes after the last one you picked, add it, recurse to fill the rest, then remove it again. Removing it is called backtracking, and it lets one working list be reused for every branch. The base case is a bundle that has reached the target size. Save a copy of the working list, because the list keeps changing afterwards. Looping the target size from 0 up to the number of add-ons gives the required order. There are 2^n bundles, so output size, not the recursion, sets the cost.
commonMistakes:
  - 'Saving the working list instead of a copy of it, so every saved bundle ends up empty'
  - 'Forgetting to undo a choice (the pop) before trying the next one'
  - 'Starting the size loop at 1 and losing the empty bundle'
followUps:
  - 'How would you list only the bundles whose total price is under a budget, and stop early?'
  - 'How does the output change if add-ons can repeat?'
