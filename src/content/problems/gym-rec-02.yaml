id: gym-rec-02
title: 'Every possible bundle of add-ons'
pattern: recursion
competencies: [int.recursion]
difficulty: medium
timeLimitMin: 40
statement: |
  A booking page offers optional add-ons. A customer can pick any subset of them, including none. Write `bundles(addons)` that returns every possible bundle as a list of lists. Order the bundles by size first (smaller bundles first). Bundles of the same size follow the order of the add-ons in the input, as `itertools.combinations` would give them. Inside a bundle, keep the input order. The input has no duplicates and must not be changed.
examples:
  - "bundles(['a', 'b', 'c']) returns [[], ['a'], ['b'], ['c'], ['a', 'b'], ['a', 'c'], ['b', 'c'], ['a', 'b', 'c']]"
  - 'bundles([]) returns [[]]'
constraints:
  - '0 to 12 add-ons'
  - 'Add-ons are distinct strings'
starter: |
  def bundles(addons):
      ...
visibleTests: |
  def test_example():
      assert bundles(["a", "b", "c"]) == [[], ["a"], ["b"], ["c"], ["a", "b"], ["a", "c"], ["b", "c"], ["a", "b", "c"]]

  def test_no_addons():
      assert bundles([]) == [[]]
hiddenTests: |
  import itertools

  def test_one_addon():
      assert bundles(["x"]) == [[], ["x"]]

  def test_four_addons_in_order():
      result = bundles(["a", "b", "c", "d"])
      assert len(result) == 16
      assert result[:5] == [[], ["a"], ["b"], ["c"], ["d"]]
      assert result[5:11] == [["a", "b"], ["a", "c"], ["a", "d"], ["b", "c"], ["b", "d"], ["c", "d"]]
      assert result[-1] == ["a", "b", "c", "d"]

  def test_input_is_not_changed():
      addons = ["a", "b", "c"]
      bundles(addons)
      assert addons == ["a", "b", "c"]

  def test_bundles_are_separate_lists():
      result = bundles(["a", "b"])
      result[1].append("z")
      assert result[2] == ["b"]
      assert bundles(["a", "b"]) == [[], ["a"], ["b"], ["a", "b"]]

  def test_twelve_addons():
      addons = [f"addon{i}" for i in range(12)]
      expected = []
      for size in range(13):
          expected.extend([list(c) for c in itertools.combinations(addons, size)])
      assert bundles(addons) == expected
referenceSolutions:
  - code: |
      def bundles(addons):
          result = []

          def choose(start, size, current):
              if len(current) == size:
                  result.append(list(current))
                  return
              for i in range(start, len(addons)):
                  current.append(addons[i])
                  choose(i + 1, size, current)
                  current.pop()

          for size in range(len(addons) + 1):
              choose(0, size, [])
          return result
    time: 'O(n * 2^n)'
    space: 'O(n * 2^n)'
wrongSolutions:
