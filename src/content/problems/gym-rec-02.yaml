  - label: 'Right bundles, but not grouped by size'
    code: |
      def bundles(addons):
          result = []

          def go(i, current):
              if i == len(addons):
                  result.append(list(current))
                  return
              go(i + 1, current)
              current.append(addons[i])
              go(i + 1, current)
              current.pop()

          go(0, [])
          return result
