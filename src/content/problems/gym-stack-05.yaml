                      undone.append(notes.pop())
              elif command == "redo":
                  if undone:
                      notes.append(undone.pop())
              else:
                  notes.append(command[4:])
          return notes
  - label: 'Redo restores the oldest undone note first'
    code: |
      def edit_session(commands):
          notes = []
          undone = []
          for command in commands:
              if command == "undo":
                  if notes:
                      undone.append(notes.pop())
              elif command == "redo":
                  if undone:
                      notes.append(undone.pop(0))
              else:
                  notes.append(command[4:])
                  undone.clear()
          return notes
  - label: 'Crashes on redo with nothing to redo'
    code: |
      def edit_session(commands):
          notes = []
          undone = []
          for command in commands:
              if command == "undo":
                  if notes:
                      undone.append(notes.pop())
              elif command == "redo":
                  notes.append(undone.pop())
              else:
                  notes.append(command[4:])
                  undone.clear()
          return notes
patternExplanation: |
  A stack lets you add and remove at one end only, so the item you handle next is always the one added last. A Python list does this with append() and pop(). Undo and redo need two stacks. Undo moves the top note from the notes stack to the undone stack, and redo moves it back, so the note undone last is always redone first. A new note starts a new history, so it clears the undone stack: otherwise redo could bring back a note that no longer fits. Each command moves one item, so the work is linear.
commonMistakes:
  - 'Not clearing the redo history after an add'
  - 'Redoing from the wrong end of the undone list'
  - 'Not checking for an empty stack before popping'
followUps:
  - 'How would you limit the redo history to 10 notes?'
  - 'How would you add a command that undoes everything?'
