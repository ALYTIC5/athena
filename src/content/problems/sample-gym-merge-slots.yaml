id: sample-gym-merge-slots
title: Merge overlapping bookings
pattern: intervals
competencies: [int.intervals]
difficulty: medium
timeLimitMin: 40
statement: |
  Bookings are `(start, end)` pairs in whole minutes with `start < end`, in any order. Write `merge_bookings(bookings)`
  returning a new list of merged bookings sorted by start. Bookings that overlap or touch (one ends exactly when the
  next starts) become one booking.
examples:
  - 'merge_bookings([(9, 11), (10, 12), (15, 16)]) returns [(9, 12), (15, 16)]'
  - 'merge_bookings([(1, 2), (2, 3)]) returns [(1, 3)]'
constraints:
  - '0 to 100000 bookings'
  - 'Do not change the input list'
starter: |
  def merge_bookings(bookings):
      ...
visibleTests: |
  def test_overlap():
      assert merge_bookings([(9, 11), (10, 12), (15, 16)]) == [(9, 12), (15, 16)]

  def test_touching():
      assert merge_bookings([(1, 2), (2, 3)]) == [(1, 3)]
hiddenTests: |
  def test_empty():
      assert merge_bookings([]) == []

  def test_unsorted_input():
      assert merge_bookings([(15, 16), (9, 11), (10, 12)]) == [(9, 12), (15, 16)]

  def test_contained_booking():
      assert merge_bookings([(1, 10), (2, 3), (4, 5)]) == [(1, 10)]

  def test_chain():
      assert merge_bookings([(1, 3), (3, 5), (5, 7)]) == [(1, 7)]

  def test_input_unchanged():
      bookings = [(5, 6), (1, 2)]
      merge_bookings(bookings)
      assert bookings == [(5, 6), (1, 2)]

  def test_large_input():
      bookings = [(i * 2, i * 2 + 1) for i in range(40000)]
      assert len(merge_bookings(bookings)) == 40000
referenceSolutions:
  - code: |
      def merge_bookings(bookings):
          merged = []
          for start, end in sorted(bookings):
              if merged and start <= merged[-1][1]:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], end))
              else:
                  merged.append((start, end))
          return merged
    time: O(n log n)
    space: O(n)
wrongSolutions:
  - label: 'Does not sort first'
    code: |
      def merge_bookings(bookings):
          merged = []
          for start, end in bookings:
              if merged and start <= merged[-1][1]:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], end))
              else:
                  merged.append((start, end))
          return merged
  - label: 'Keeps the later end instead of the larger end'
    code: |
      def merge_bookings(bookings):
          merged = []
          for start, end in sorted(bookings):
              if merged and start <= merged[-1][1]:
                  merged[-1] = (merged[-1][0], end)
              else:
                  merged.append((start, end))
          return merged
  - label: 'Treats touching bookings as separate'
    code: |
      def merge_bookings(bookings):
          merged = []
          for start, end in sorted(bookings):
              if merged and start < merged[-1][1]:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], end))
              else:
                  merged.append((start, end))
          return merged
patternExplanation: |
  Sort by start, then sweep once. Each booking either extends the last merged booking (take the larger end) or starts a new one.
commonMistakes:
  - 'Forgetting to sort'
  - 'Replacing the end instead of taking the maximum when a booking is contained in another'
followUps:
  - 'How would you find free gaps between bookings?'
  - 'How would you insert one new booking into an already merged list?'
