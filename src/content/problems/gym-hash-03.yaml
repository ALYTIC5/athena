id: gym-hash-03
title: 'The first caller who phoned exactly twice'
pattern: hashing
competencies: [int.hashing]
difficulty: easy
timeLimitMin: 20
statement: |
  A booking line logs the id of each caller in the order they phoned. Write `first_double_caller(calls)` that returns the id of the caller who phoned exactly twice in total and whose first call came earliest in the log. Return `None` if nobody phoned exactly twice.
examples:
  - "first_double_caller(['a', 'b', 'a', 'c', 'c']) returns 'a'"
  - "first_double_caller(['a', 'a', 'a', 'b']) returns None"
constraints:
  - '0 to 100000 calls'
  - 'Ids are non-empty strings'
starter: |
  def first_double_caller(calls):
      ...
visibleTests: |
  def test_example():
      assert first_double_caller(["a", "b", "a", "c", "c"]) == "a"

  def test_nobody_phoned_exactly_twice():
      assert first_double_caller(["a", "a", "a", "b"]) is None
hiddenTests: |
  def test_empty():
      assert first_double_caller([]) is None

  def test_single_call():
      assert first_double_caller(["a"]) is None

  def test_three_calls_do_not_count():
      assert first_double_caller(["a", "a", "a", "b", "b"]) == "b"

  def test_earliest_first_call_wins_even_if_the_other_caller_repeats_first():
      assert first_double_caller(["x", "a", "a", "x"]) == "x"

  def test_later_caller_may_be_the_only_match():
      assert first_double_caller(["a", "b", "c", "c"]) == "c"

  def test_large_input_with_the_match_at_the_end():
      calls = [str(i) for i in range(30000)] * 3 + ["only", "only"]
      assert first_double_caller(calls) == "only"

  def test_input_unchanged():
      calls = ["a", "b", "a"]
      first_double_caller(calls)
      assert calls == ["a", "b", "a"]
referenceSolutions:
  - code: |
      def first_double_caller(calls):
          counts = {}
          for caller in calls:
              counts[caller] = counts.get(caller, 0) + 1
          for caller in calls:
              if counts[caller] == 2:
                  return caller
          return None
    time: 'O(n)'
    space: 'O(n)'
wrongSolutions:
  - label: 'Treats at least twice as exactly twice'
    code: |
      def first_double_caller(calls):
          counts = {}
          for caller in calls:
              counts[caller] = counts.get(caller, 0) + 1
          for caller in calls:
              if counts[caller] >= 2:
                  return caller
          return None
  - label: 'Picks the caller whose second call comes first, not the caller whose first call comes first'
    code: |
      def first_double_caller(calls):
          counts = {}
          for caller in calls:
              counts[caller] = counts.get(caller, 0) + 1
              if counts[caller] == 2:
                  total = calls.count(caller)
                  if total == 2:
                      return caller
          return None
  - label: 'Uses list.count for each caller, so the work grows with the square of the log'
    code: |
      def first_double_caller(calls):
          for caller in calls:
              if calls.count(caller) == 2:
                  return caller
          return None
patternExplanation: |
  A dict can hold a count for each key. You cannot know that a caller phoned exactly twice until you have seen the whole log, so use two passes: one to count, and one in log order to return the first caller whose count is 2. Scanning the log, not the dict, keeps the rule about whose first call came earliest obvious (scanning the dict would also work, because a dict keeps the order in which keys were first added). Two linear passes are still linear.
commonMistakes:
  - "Treating 'exactly twice' as 'at least twice'"
  - 'Answering with the caller whose second call arrives first'
  - 'Using list.count inside the loop'
followUps:
  - 'Can you do it in one pass?'
  - 'What if the log does not fit in memory?'
