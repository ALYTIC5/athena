          def __init__(self, value, left=None, right=None):
              self.value = value
              self.left = left
              self.right = right



      def closest_shared_manager(root, a, b):
          return root.value
patternExplanation: |
  A binary tree is a set of nodes where each node holds a value and has at most two children, called left and right. A missing child is None. Most tree problems are solved by a function that handles one node and calls itself on the two children, so the base case is almost always `None`. Ask each subtree whether it contains a or b. Return a node's value the moment it equals a or b, since nothing below it can be a lower shared manager for that employee. At every node you then get two answers, one from each side. If both sides found something, a and b are in different subtrees, so this node is the first one that sees both: it is the answer. If only one side found something, pass that answer up unchanged. Because the answer from deeper in the tree is passed up, the lowest shared manager wins. Do not use the sorted-tree shortcut of comparing ids with the node: it only works for a search tree, and this tree is not sorted. Test for `is not None`, not for truthiness, because an id of 0 is valid. Each node is visited once.
commonMistakes:
  - 'Using the search tree shortcut on an unsorted tree'
  - 'Testing the answer for truthiness, which treats id 0 as missing'
  - 'Forgetting that a node can be its own descendant when a manages b'
followUps:
  - 'How would it change if a or b might not be in the tree?'
  - 'How would you answer many queries quickly on the same tree?'
