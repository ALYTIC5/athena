id: gym-sw-02
title: 'The longest run of calls inside a time budget'
pattern: sliding-window
competencies: [int.sliding-window]
difficulty: easy
timeLimitMin: 20
statement: |
  An agent has `budget` minutes. Write `longest_run(lengths, budget)` that returns how many calls are in the longest run of calls that follow each other in the list and whose lengths add up to `budget` minutes or less. Return `0` if no single call fits. Call lengths are whole numbers of minutes, 1 or more.
examples:
  - 'longest_run([3, 1, 2, 1, 1], 5) returns 4'
  - 'longest_run([5], 4) returns 0'
constraints:
  - '0 to 100000 calls'
  - 'Every length is 1 or more'
  - 'budget is 0 or more'
starter: |
  def longest_run(lengths, budget):
      ...
visibleTests: |
  def test_example():
      assert longest_run([3, 1, 2, 1, 1], 5) == 4

  def test_nothing_fits():
      assert longest_run([5], 4) == 0
hiddenTests: |
  def test_empty():
      assert longest_run([], 10) == 0

  def test_total_exactly_equal_to_the_budget():
      assert longest_run([1, 1, 1], 3) == 3

  def test_only_single_calls_fit():
      assert longest_run([2, 2, 2], 3) == 1

  def test_zero_budget():
      assert longest_run([1], 0) == 0

  def test_a_long_call_splits_the_runs():
      assert longest_run([9, 1, 1, 1], 3) == 3

  def test_best_run_is_in_the_middle():
      assert longest_run([5, 1, 1, 1, 5], 3) == 3

  def test_input_unchanged():
      lengths = [1, 2, 3]
      longest_run(lengths, 3)
      assert lengths == [1, 2, 3]

  def test_large_input():
      assert longest_run([1] * 100000, 50000) == 50000
referenceSolutions:
  - code: |
      def longest_run(lengths, budget):
          best = 0
          total = 0
          left = 0
          for right, length in enumerate(lengths):
              total += length
              while total > budget and left <= right:
                  total -= lengths[left]
                  left += 1
              best = max(best, right - left + 1)
          return best
    time: 'O(n)'
    space: 'O(1)'
wrongSolutions:
  - label: 'Shrinks the run when the total reaches the budget, so a total equal to the budget is refused'
    code: |
      def longest_run(lengths, budget):
          best = 0
          total = 0
          left = 0
          for right, length in enumerate(lengths):
              total += length
              while total >= budget and left <= right:
                  total -= lengths[left]
                  left += 1
              best = max(best, right - left + 1)
          return best
  - label: 'Never shrinks the run, so it only measures the start of the list'
    code: |
      def longest_run(lengths, budget):
          total = 0
          count = 0
          for length in lengths:
              if total + length > budget:
                  break
              total += length
              count += 1
          return count
  - label: 'Tries every start and extends it as far as it fits, so the work grows with the square of the list'
    code: |
      def longest_run(lengths, budget):
          best = 0
          for start in range(len(lengths)):
              total = 0
              for end in range(start, len(lengths)):
                  total += lengths[end]
                  if total > budget:
                      break
                  best = max(best, end - start + 1)
          return best
patternExplanation: |
  Because every length is positive, adding a call can only raise the total and removing one can only lower it. Grow the run on the right one call at a time. If the total goes over the budget, shrink the run from the left until it fits again. Each call enters the run once and leaves it once, so the work is linear, even though the run changes size.
commonMistakes:
  - 'Using >= and refusing a total that equals the budget'
  - 'Only extending to the right and never shrinking'
  - 'Starting a new scan at every position'
followUps:
  - 'Why does this fail if a length can be 0 or negative?'
  - 'How would you return the start and end of the longest run?'
