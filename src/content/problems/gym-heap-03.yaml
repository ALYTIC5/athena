  - label: 'Takes only the first time of each log'
    code: |
      import heapq

      def merge_logs(logs):
          heap = [(log[0], i) for i, log in enumerate(logs) if log]
          heapq.heapify(heap)
          result = []
          while heap:
              value, i = heapq.heappop(heap)
              result.append(value)
          return result
  - label: 'Drops the last time of every log'
    code: |
      import heapq

      def merge_logs(logs):
          heap = []
          for log_index, log in enumerate(logs):
              if log:
                  heapq.heappush(heap, (log[0], log_index, 0))
          result = []
          while heap:
              value, log_index, position = heapq.heappop(heap)
              if position + 1 < len(logs[log_index]):
                  result.append(value)
                  heapq.heappush(heap, (logs[log_index][position + 1], log_index, position + 1))
          return result
patternExplanation: |
  A heap is a structure that always gives you the smallest item fast. Python's heapq module keeps a plain list as a min-heap: heappush adds an item and heappop removes the smallest, each in O(log n). To get the largest items, keep a heap of the items you want and push the weakest one out. Merging k sorted lists: the next time in the result is always the smallest of the current front items of the lists. Keep those k front items in a min-heap as tuples of (time, which log, position). Pop the smallest, add its time to the result, and push the next item from the same log if there is one. The heap never holds more than k items, so each of the n times costs O(log k). Skip empty logs when you seed the heap. The index in the tuple also settles ties without comparing anything else. Sorting all the times together gives the same answer in O(n log n); the heap version wins when k is small, and it is the method used when the logs are too large to load at once.
commonMistakes:
  - 'Indexing log[0] on an empty log'
  - 'Pushing only the first item of each log and never the next one'
  - 'Dropping the last item by testing the position at the wrong moment'
followUps:
  - 'How would you merge logs that are too big to fit in memory?'
  - 'How would you return which office each time came from?'
