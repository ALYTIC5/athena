id: gym-heap-03
title: 'Merge the sorted call logs'
pattern: heaps
competencies: [int.heaps]
difficulty: medium
timeLimitMin: 40
statement: |
  Each office keeps its call times in a sorted list (earliest first). Write `merge_logs(logs)` that takes a list of these sorted lists and returns one sorted list with every call time from every office. Some offices may have empty logs. Equal times all stay in the result.
examples:
  - 'merge_logs([[1, 4, 9], [2, 3], [5]]) returns [1, 2, 3, 4, 5, 9]'
  - 'merge_logs([[], [7]]) returns [7]'
constraints:
  - '0 to 1000 logs, 0 to 1000 times each'
  - 'Each log is sorted from earliest to latest'
  - 'Times are ints'
starter: |
  def merge_logs(logs):
      ...
visibleTests: |
  def test_example():
      assert merge_logs([[1, 4, 9], [2, 3], [5]]) == [1, 2, 3, 4, 5, 9]

  def test_empty_log():
      assert merge_logs([[], [7]]) == [7]
hiddenTests: |
  def test_no_logs():
      assert merge_logs([]) == []

  def test_all_empty():
      assert merge_logs([[], [], []]) == []

  def test_one_log():
      assert merge_logs([[1, 2, 3]]) == [1, 2, 3]

  def test_equal_times_are_all_kept():
      assert merge_logs([[1, 5], [1, 5], [5]]) == [1, 1, 5, 5, 5]

  def test_one_log_is_much_longer():
      assert merge_logs([[1, 2, 3, 4, 5, 6], [10]]) == [1, 2, 3, 4, 5, 6, 10]

  def test_input_is_not_changed():
      logs = [[1, 3], [2]]
      merge_logs(logs)
      assert logs == [[1, 3], [2]]

  def test_many_logs():
      logs = [list(range(i, 100000, 100)) for i in range(100)]
      assert merge_logs(logs) == list(range(100000))
referenceSolutions:
  - code: |
      import heapq

      def merge_logs(logs):
          heap = []
          for log_index, log in enumerate(logs):
              if log:
                  heapq.heappush(heap, (log[0], log_index, 0))
          result = []
          while heap:
              value, log_index, position = heapq.heappop(heap)
              result.append(value)
              if position + 1 < len(logs[log_index]):
                  heapq.heappush(heap, (logs[log_index][position + 1], log_index, position + 1))
          return result
    time: 'O(n log k)'
    space: 'O(k)'
wrongSolutions:
  - label: 'Crashes on an empty log'
