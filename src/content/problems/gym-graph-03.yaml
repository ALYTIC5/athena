      def count_groups(n, links):
          return max(n - len(links), 1) if n else 0
patternExplanation: |
  A graph is a set of nodes joined by edges. Here a graph is a dict that maps each node to the list of nodes it points to. Graphs can contain cycles, so any walk through one must remember which nodes it has already visited, or it can loop forever. A group is a connected component. Count them by starting a search from every office that has not been seen yet: that search marks the whole group, so each new start means one more group. Build the neighbour lists for both directions, because a line works both ways. Loop over all n offices, not only those that appear in a link, so an office with no lines counts as its own group. Use a stack in a loop, not recursion, because a chain of 100000 offices exceeds Python's recursion limit. Another method is union-find: start with n groups and subtract one each time a line joins two different groups. Both run in about O(n + m).
commonMistakes:
  - 'Looping only over offices that appear in a link'
  - 'Adding each line in one direction only'
  - 'Subtracting the number of lines, which breaks when lines repeat or form a cycle'
followUps:
  - 'How would you find the size of the biggest group?'
  - 'How would you do it with union-find, and when is that better?'
