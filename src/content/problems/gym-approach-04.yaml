id: gym-approach-04
title: "Tidy a caller's name"
pattern: approach
competencies: [int.approach]
difficulty: easy
timeLimitMin: 15
statement: |
  Names arrive from a web form in all kinds of shapes. Write `clean_name(text)` that returns the name tidied up:

  - remove spaces from both ends, and reduce any run of spaces between words to one space;
  - in each word, make the first letter a capital and every other letter lower case.

  An empty or all-space text gives an empty string. Words are separated by spaces only; hyphens and apostrophes do not start a new word.
examples:
  - "clean_name('  amara   OKAFOR ') returns 'Amara Okafor'"
  - 'clean_name("O''BRIEN") returns "O''brien"'
constraints:
  - 'Text of 0 to 200 characters'
  - 'Words are separated by spaces'
starter: |
  def clean_name(text):
      ...
visibleTests: |
  def test_example():
      assert clean_name("  amara   OKAFOR ") == "Amara Okafor"

  def test_single_word():
      assert clean_name("bayu") == "Bayu"
hiddenTests: |
  def test_apostrophe_does_not_start_a_new_word():
      assert clean_name("O'BRIEN") == "O'brien"

  def test_hyphen_does_not_start_a_new_word():
      assert clean_name("mei-ling  tan") == "Mei-ling Tan"

  def test_only_spaces():
      assert clean_name("   ") == ""

  def test_empty():
      assert clean_name("") == ""

  def test_one_letter_words():
      assert clean_name("a b") == "A B"

  def test_already_clean_text_is_unchanged():
      assert clean_name("Chen Wei") == "Chen Wei"
referenceSolutions:
  - code: |
      def clean_name(text):
          return " ".join(w[:1].upper() + w[1:].lower() for w in text.split())
    time: 'O(n)'
    space: 'O(n)'
wrongSolutions:
  - label: 'Uses title(), which also capitalises after a hyphen or an apostrophe'
    code: |
      def clean_name(text):
          return " ".join(text.split()).title()
  - label: 'Capitalises the first letter but leaves the rest as typed'
    code: |
      def clean_name(text):
          return " ".join(w[:1].upper() + w[1:] for w in text.split())
  - label: 'Capitalises only the first word and keeps the extra spaces'
    code: |
      def clean_name(text):
          return text.strip().capitalize()
patternExplanation: |
  Work through the think-aloud checklist before you type: clarify the rules, write two or three examples by hand (including an empty or edge case), describe the simple solution, then code it, test it on your examples and say its cost.

  The examples expose the traps: extra spaces, a name in capitals, and punctuation inside a word. `text.split()` with no argument removes the extra spaces in one step. `str.title()` looks right but treats a hyphen or an apostrophe as the start of a new word.
commonMistakes:
  - 'Using title() without checking names with apostrophes or hyphens'
  - 'Stripping the ends but not the spaces between words'
  - 'Capitalising only the first word'
followUps:
  - 'What names break any simple rule?'
  - 'How would you store the name exactly as typed as well?'
