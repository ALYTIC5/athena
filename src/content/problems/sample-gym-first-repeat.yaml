id: sample-gym-first-repeat
title: First repeated caller
pattern: hashing
competencies: [int.hashing]
difficulty: easy
timeLimitMin: 20
statement: |
  A support line logs the id of each caller in the order they phoned. Write `first_repeated_caller(calls)`
  that returns the first id whose second call arrives earliest, or `None` if nobody phoned twice.

  "First" means: scan the log in order and return the id of the first call that is not the caller's first.
examples:
  - "first_repeated_caller(['a', 'b', 'a', 'b']) returns 'a'"
  - "first_repeated_caller(['x', 'y', 'z']) returns None"
constraints:
  - '0 to 100000 calls'
  - 'Ids are non-empty strings'
starter: |
  def first_repeated_caller(calls):
      ...
visibleTests: |
  def test_example():
      assert first_repeated_caller(["a", "b", "a", "b"]) == "a"

  def test_no_repeat():
      assert first_repeated_caller(["x", "y", "z"]) is None
hiddenTests: |
  def test_empty():
      assert first_repeated_caller([]) is None

  def test_first_to_repeat_not_first_seen():
      assert first_repeated_caller(["a", "b", "b", "a"]) == "b"

  def test_repeat_of_first_item():
      assert first_repeated_caller(["a", "a"]) == "a"

  def test_input_unchanged():
      calls = ["a", "b", "a"]
      first_repeated_caller(calls)
      assert calls == ["a", "b", "a"]

  def test_large_input_with_late_repeat():
      calls = [str(i) for i in range(50000)] + ["49999"]
      assert first_repeated_caller(calls) == "49999"
referenceSolutions:
  - code: |
      def first_repeated_caller(calls):
          seen = set()
          for caller in calls:
              if caller in seen:
                  return caller
              seen.add(caller)
          return None
    time: O(n)
    space: O(n)
wrongSolutions:
  - label: 'Returns the most common caller instead of the first to repeat'
    code: |
      def first_repeated_caller(calls):
          counts = {}
          for caller in calls:
              counts[caller] = counts.get(caller, 0) + 1
          best = None
          for caller, n in counts.items():
              if n > 1 and (best is None or n > counts[best]):
                  best = caller
          return best
  - label: 'Returns the first id that appears twice anywhere, in order of first appearance'
    code: |
      def first_repeated_caller(calls):
          for caller in calls:
              if calls.count(caller) > 1:
                  return caller
          return None
patternExplanation: |
  A set remembers what you have seen in constant time per lookup. Scan once; the first id already in the set is the answer.
commonMistakes:
  - 'Sorting or counting everything first, which answers a different question'
  - 'Using list.count inside the loop, which makes the whole function quadratic'
followUps:
  - 'What if the log does not fit in memory?'
  - 'What if you also need the position of both calls?'
