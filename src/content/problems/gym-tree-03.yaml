patternExplanation: |
  A binary tree is a set of nodes where each node holds a value and has at most two children, called left and right. A missing child is None. Most tree problems are solved by a function that handles one node and calls itself on the two children, so the base case is almost always `None`. Grouping by level is a breadth-first walk: visit every node of one level before any node of the next. A queue does this. Start with the root. In each round, take exactly as many nodes as the queue holds right now (that is one level), record their values, and add their children to the back. Children join at the back, so they wait for the next round, and adding left before right keeps each level in left-to-right order. Use collections.deque so taking from the front is O(1), because list.pop(0) shifts every element. Each node is queued once, so the time is linear, and the queue holds at most one level, so the extra memory is the width of the tree.
commonMistakes:
  - 'Walking depth-first, which gives a flat list instead of levels'
  - 'Not fixing the level size before the round starts, so levels blend together'
  - 'Adding the right child before the left child'
followUps:
  - 'How would you return the levels bottom-up?'
  - 'How would you return only the last node of each level (the right-side view)?'
